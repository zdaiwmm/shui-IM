<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机通知 · v2 单页摘要</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;--bg:light-dark(#f7f9fc,#181e28);--ink:light-dark(#233147,#e4eaf3);--muted:light-dark(#69758a,#a4b2c7);--line:light-dark(#dce3ed,#38475e);--accent:#327cee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:620px;margin:auto;padding:30px 24px}aside{padding:18px;border:1px solid var(--line);border-radius:18px}h1{font-size:32px;margin:12px 0;font-weight:550}p{color:var(--muted);font-size:13px;line-height:1.7}small{color:var(--accent)}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:82px;border-bottom:1px solid var(--line)}.row p{margin:6px 0}.switch{flex:none;position:relative;width:52px;height:44px;background:transparent;border:0}.switch:before{content:'';position:absolute;inset:7px 0;border-radius:18px;background:var(--line)}.switch:after{content:'';position:absolute;left:3px;top:10px;width:24px;height:24px;border-radius:50%;background:white}.switch[aria-checked=true]:before{background:var(--accent)}.switch[aria-checked=true]:after{left:25px}.switch:disabled{opacity:.4}button,select{font:inherit;color:inherit;min-height:44px}label{display:flex;gap:12px;align-items:center;margin-bottom:20px}h2{font-size:17px;margin-top:30px}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
</style><main><label>模拟能力<select id="scenario"><option value="available">本机支持通知</option><option value="blocked">系统已阻止</option><option value="home">需添加到主屏幕</option><option value="service">服务不可用</option><option value="network">暂无法确认</option></select></label><small>本机所有空间 · 通知 v2</small><h1>通知管理</h1><p>统一管理本机所有空间的新消息提醒。</p><aside><strong id="status">本机支持通知</strong><p id="reason">开启后，系统会在有新消息时提醒你。</p></aside><div class="row"><div><strong id="master-label">允许本机通知</strong><p>只影响当前浏览器或主屏幕应用。</p></div><button id="master" class="switch" role="switch" aria-labelledby="master-label" aria-checked="false"></button></div><h2>各空间通知</h2><p>总开关关闭时暂停全部通知，保留每个空间的选择。</p><div id="spaces"></div><p id="feedback" role="status"></p><h2>只显示通用的新消息提醒</h2><p>不显示空间名、发送者、聊天文字或附件内容。点击后仍需解锁。提醒可能受专注模式、网络及后台限制影响。</p><p>原型仅模拟，不申请系统权限、不发送通知、不读取任何聊天数据。</p></main>
<script>
const scenario=document.querySelector('#scenario'),statusNode=document.querySelector('#status'),reason=document.querySelector('#reason'),master=document.querySelector('#master'),spaces=document.querySelector('#spaces'),feedback=document.querySelector('#feedback');
let enabled=false;const prefs=[true,false,true],names=['林间','海边','小屋'];const states={available:['本机支持通知','开启后，系统会在有新消息时提醒你。'],blocked:['系统已阻止通知','请在浏览器或系统设置中允许通知后再回来。'],home:['添加到主屏幕后可用','通过 Safari 分享菜单添加到主屏幕，再从主屏幕打开。'],service:['通知服务暂不可用','请稍后重试。'],network:['暂时无法确认','请检查网络后重试。']};
function render(){const state=scenario.value;statusNode.textContent=states[state][0];reason.textContent=states[state][1];master.setAttribute('aria-checked',enabled);master.disabled=!enabled&&state!=='available';spaces.replaceChildren(...names.map((name,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<strong id="space-${i}">${name}</strong><button class="switch" role="switch" aria-labelledby="space-${i}" aria-checked="${prefs[i]}" ${!enabled||state!=='available'?'disabled':''}></button>`;row.querySelector('button').onclick=()=>{prefs[i]=!prefs[i];render()};return row}));}
master.onclick=()=>{enabled=!enabled;feedback.textContent=enabled?'模拟：系统允许且服务端已确认，通知已开启':'全部暂停，各空间选择已保留';render()};scenario.onchange=render;render();
</script></html>
