function later(fn,ms){const gen=generation;const id=setTimeout(()=>{timers.delete(id);if(gen===generation&&!locked)fn();},ms);timers.add(id);return id}

function cubic(p,a=.16,b=1,c=.3,d=1){let lo=0,hi=1,u=p;for(let i=0;i<14;i++){u=(lo+hi)/2;const x=3*(1-u)*(1-u)*u*a+3*(1-u)*u*u*c+u*u*u;if(x<p)lo=u;else hi=u;}return 3*(1-u)*(1-u)*u*b+3*(1-u)*u*u*d+u*u*u}
function motion(key,target,paint,{from=0,duration=280,omega=22,curve=[.16,1,.3,1]}={}){let c=channels.get(key);if(!c){c={x:from,v:0,target:from,paint,active:false};channels.set(key,c)}c.paint=paint;c.target=target;c.start=c.x;c.elapsed=0;c.duration=duration;c.omega=omega;c.curve=curve;c.active=true;if(reduced()){c.x=target;c.v=0;c.active=false;paint(target);return c}if(mode==='baseline')c.v=0;paint(c.x);if(!raf)raf=requestAnimationFrame(tick);return c}
let last=0;function tick(now){const dt=last?Math.min(32,now-last):16;last=now;let active=0,maxV=0;for(const c of channels.values()){if(!c.active)continue;const step=dt*(slow?.25:1);if(mode==='baseline'){c.elapsed+=step;const p=Math.min(1,c.elapsed/c.duration),old=c.x;c.x=c.start+(c.target-c.start)*cubic(p,...c.curve);c.v=(c.x-old)/(step/1000);if(p===1)c.active=false}else{let remaining=step/1000;while(remaining>0){const h=Math.min(remaining,.004);c.v+=(c.omega*c.omega*(c.target-c.x)-2*c.omega*c.v)*h;const next=c.x+c.v*h;if((c.target-c.x)*(c.target-next)<0){c.x=c.target;c.v=0}else c.x=next;remaining-=h;}if(Math.abs(c.target-c.x)<.001&&Math.abs(c.v)<.008){c.x=c.target;c.v=0;c.active=false}}c.paint(c.x);if(c.active)active++;maxV=Math.max(maxV,Math.abs(c.v))}$('#motion-state').textContent=active?t('运动中','Moving'):t('已停稳','Settled');$('#motion-meter').style.transform=`scaleX(${Math.min(1,maxV/8)})`;if(active)raf=requestAnimationFrame(tick);else{raf=0;last=0}}

function action(a,el){if(locked)return;if(a.startsWith('tab')&&/^tab\d$/.test(a)){state.tab=Number(a.slice(3));drawCategory();return}if(a.startsWith('chapter')){state.page=Number(a.slice(7));closePanel();drawReader();return}switch(a){case'send':send();break;case'burst':send();later(()=>send(),140);later(()=>send(),280);break;case'receive':send(true);break;case'fail':state.failNext=true;toast(t('下一次发送将模拟保存失败','Next send will simulate a local save failure'));break;case'reply':if(scene===1&&!state.reply){const b=$('#source .bubble');const max=stage.clientWidth/6;snap('replyDemo',0,x=>replyMove(b,x));motion('replyDemo',96,x=>replyMove(b,x),{duration:260,omega:19});later(()=>{motion('replyDemo',0,x=>replyMove(b,x),{duration:260,omega:25});if(!state.reply)toggleReply()},slow?1500:430)}else toggleReply();break;case'jump':{const list=$('#messages');state.returnTop=list.scrollTop;list.scrollTop=0;const b=$('#original .bubble');b.style.outline='2px solid var(--accent)';later(()=>b.style.outline='',1400);toast(t('已定位原消息','Original message located'));break}case'return':$('#messages').scrollTop=state.returnTop||0;toast(t('已返回引用位置','Returned to quote'));break;case'menu':if(scene>3){toast(t('请在第 03 组体验消息菜单','Try message actions in scene 03'));break}state.source||=$('#source .bubble');openPanel('menu');break;case'react':react();break;case'menuReply':closePanel();if(!state.reply)toggleReply();break;case'copy':toast(t('已复制（模拟）','Copied (simulated)'));closePanel();break;case'lines':{const before=snapshot(),d=$('#draft');state.lines=!state.lines;d.value=state.lines?t('周末见。\n我带相机。\n不用赶时间。','See you this weekend.\nI’ll bring the camera.\nNo rush.'):t('周末见。','See you this weekend.');d.style.height=state.lines?'88px':'44px';layoutComposer(before);break}case'keyboard':keyboard();break;case'expressions':keyboard(true);break;case'emoji':$('#draft').value+=(el?.textContent||'🙂');break;case'forward':route(true);break;case'back':route(false);break;case'reverse':route(true);later(()=>route(false),120);break;case'drawer':case'sheet':case'alert':openPanel(a);break;case'close':closePanel();break;case'spaceSettings':$('.panel').innerHTML=`${btn('drawer','返回空间','Back to spaces','plain')}<h2>${t('设置','Settings')}</h2><div class="group"><div class="item">${t('设备管理','Devices')} ›</div><div class="item">${t('我的恢复码','Recovery code')} ›</div></div>${btn('close','关闭','Close','plain')}`;snap('settings',0,x=>$('.panel').style.opacity=x);motion('settings',1,p=>$('.panel')&&($('.panel').style.opacity=p),{duration:180,omega:25});break;case'confirm':closePanel();toast(t('示例记录已移除','Sample removed'));break;case'photo':photo(true);break;case'photoClose':closePanel();photo(false);break;case'zoom':zoom();break;case'photoNext':photoNext();break;case'photoPrev':photoNext(-1);break;case'details':if(!state.photo)photo(true);openPanel('details');break;case'tabNext':state.tab=(state.tab+1)%3;drawCategory();break;case'empty':state.empty=!state.empty;drawCategory();break;case'packs':packs();break;case'reorder':if(!state.packs)packs();reorderPack(0,3);break;case'sticker':toast(t('表情已发送（模拟）','Expression sent (simulated)'));break;case'galleryPreview':toast(t('完整图片交互请切换第 07 组','Full image interaction is in scene 07'));break;case'fileNotice':toast(t('阅读交互请切换第 09 组','Reading interaction is in scene 09'));break;case'prev':if(state.page>0){state.page--;drawReader(true,-1)}else toast(t('已是第一页','First page'));break;case'next':if(state.page<2){state.page++;drawReader(true,1)}else toast(t('已是最后一页','Last page'));break;case'search':search();break;case'find':{const q=$('#searchbar input').value.trim();const article=$(`[data-reader-page="${state.page}"]`);if(q&&article.textContent.includes(q)){toast(t('找到匹配内容','Match found'));article.style.background='var(--accent-soft)';later(()=>article.style.background='',1000)}else toast(t('没有找到匹配内容','No matches'));break}case'directory':openPanel('directory');break;case'load':state.progress=0;load();break;case'retry':load();break;case'error':state.loadToken++;setStatus('error');break;case'success':state.loadToken++;state.progress=1;motion('progress',1,p=>$('#progress').style.transform=`scaleX(${p})`,{duration:180,omega:26});setStatus('success');break;case'toast':state.count++;toast(t(`已保存 · 第 ${state.count} 次反馈`,`Saved · notice ${state.count}`));break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b);const n=e.target.closest('[data-scene]');if(n){scene=Number(n.dataset.scene);renderShell()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.panel)closePanel();else if(state.photo)photo(false);else if(state.route)route(false)}if(e.key==='Tab'&&state.panel){const f=[...$('.panel').querySelectorAll('button,input')].filter(n=>!n.disabled);if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
$('#language').onclick=()=>{language=language==='zh'?'en':'zh';renderShell()};$('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};$('#baseline').onclick=()=>{mode='baseline';renderShell()};$('#proposed').onclick=()=>{mode='proposed';renderShell()};$('#speed').onclick=()=>{slow=!slow;$('#speed').textContent=slow?t('0.25× 慢放','0.25× slow'):t('1× 正常速度','1× normal')};$('#reset').onclick=reset;$('#reduce').onchange=reset;matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',reset);
$('#privacy').onclick=()=>{clearWork();locked=true;stage.innerHTML=`<div class="lock"><strong>${t('内容已遮挡','Content concealed')}</strong><p class="muted center">${t('所有演示动画和待处理反馈已立即停止。','All demo animations and pending feedback have stopped.')}</p><button id="resume">${t('重新开始演示','Restart demo')}</button></div>`;$('#motion-state').textContent=t('立即停止','Stopped');$('#motion-meter').style.transform='scaleX(0)';$('#resume').onclick=reset;};
renderShell();
</script></body></html>
