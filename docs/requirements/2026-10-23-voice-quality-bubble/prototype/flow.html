<!doctype html><html lang="zh-CN" data-color-scheme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语音消息流程 V1</title><link rel="stylesheet" href="/src/design-tokens.css"><link rel="stylesheet" href="./prototype.css"><style>.flows{max-width:1080px;padding:0 28px 56px;margin:auto}.flow-panel{margin-bottom:40px}.flow-panel h2{font-size:20px;font-weight:600}.flow-panel p{color:var(--ink-muted);font-size:12px}.flow-scroll{overflow:auto;border-block:1px solid var(--line);padding:20px 0}.flow-scroll svg{width:100%;min-width:680px;height:auto;stroke:none}.node rect{fill:var(--surface-raised);stroke:var(--line);stroke-width:1}.node text{font:13px var(--font-ui);fill:var(--ink);text-anchor:middle;stroke:none}.node .small{font-size:11px;fill:var(--ink-muted)}.node.start rect{fill:var(--accent-soft);stroke:none}.edge{stroke:var(--line-strong);stroke-width:1.5;fill:none;marker-end:url(#arrow)}.edge-label{font:11px var(--font-ui);fill:var(--ink-muted);text-anchor:middle;stroke:none}</style></head><body><header class="workbench-header"><div><p class="eyebrow">QUIET ROOM / FLOW V1</p><h1>从点击，到播放。</h1><p class="intro">气泡与音频对照流程 · V1已确认，布局按V1.1修订</p></div><nav><a href="./index.html">返回气泡</a><a href="./audio.html">音频对照</a><a href="../flow.md">Mermaid 源码</a></nav></header><main class="flows"><section class="flow-panel"><h2>01　语音气泡</h2><p>整条点击、单条播放、暂停续播、失败重试；任何加载或播放都服从隐私停止。</p><div class="flow-scroll"><svg viewBox="0 0 1000 570" role="img" aria-label="语音气泡交互流程"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line-strong)"/></marker></defs><g class="node start" transform="translate(50 20)"><rect width="240" height="58" rx="10"/><text x="120" y="26">进入聊天列表</text><text class="small" x="120" y="45">按时长显示紧凑气泡</text></g><path class="edge" d="M290 49H380"/><g class="node" transform="translate(380 20)"><rect width="240" height="58" rx="10"/><text x="120" y="34">点击整条气泡</text></g><path class="edge" d="M500 78V126"/><g class="node" transform="translate(380 128)"><rect width="240" height="58" rx="10"/><text x="120" y="26">检查当前状态</text><text class="small" x="120" y="45">未播放 / 播放中 / 发送失败</text></g><path class="edge" d="M380 157H170V232"/><text class="edge-label" x="258" y="146">未播放 / 重播</text><g class="node" transform="translate(50 234)"><rect width="240" height="58" rx="10"/><text x="120" y="26">加载</text><text class="small" x="120" y="45">再次点击取消；失败可重试</text></g><path class="edge" d="M500 186V234"/><text class="edge-label" x="537" y="213">播放中</text><g class="node" transform="translate(380 234)"><rect width="240" height="58" rx="10"/><text x="120" y="26">暂停并保留位置</text><text class="small" x="120" y="45">再次点击回到加载 / 播放</text></g><path class="edge" d="M620 157H830V232"/><text class="edge-label" x="733" y="146">发送失败</text><g class="node" transform="translate(710 234)"><rect width="240" height="58" rx="10"/><text x="120" y="26">同条消息重试</text><text class="small" x="120" y="45">原位状态，不重复创建消息</text></g><path class="edge" d="M170 292V343"/><g class="node start" transform="translate(50 345)"><rect width="240" height="62" rx="10"/><text x="120" y="27">单条播放 · 声波动画</text><text class="small" x="120" y="47">点另一条暂停前一条；结束可重播</text></g><path class="edge" d="M290 376H380"/><g class="node" transform="translate(380 345)"><rect width="240" height="62" rx="10"/><text x="120" y="27">长按 / 右键操作</text><text class="small" x="120" y="47">回复或删除；长按不误触播放</text></g><path class="edge" d="M170 407V476H710"/><path class="edge" d="M830 292V444"/><g class="node" transform="translate(710 446)"><rect width="240" height="72" rx="10"/><text x="120" y="26">锁定、隐藏或离开</text><text class="small" x="120" y="46">停止加载与播放</text><text class="small" x="120" y="62">返回不自动续播</text></g><text class="edge-label" x="480" y="465">所有活动状态均受此约束</text></svg></div></section><section class="flow-panel"><h2>02　本地音频对照</h2><p>明确区分文件失真与播放会话失真。合成流测试不证明 iPhone 的物理录放、回声处理或系统路由。</p><div class="flow-scroll"><svg viewBox="0 0 1000 400" role="img" aria-label="本地音频对照流程"><g class="node start" transform="translate(30 20)"><rect width="280" height="60" rx="10"/><text x="140" y="25">合成信号 / 主动选择物理麦克风</text><text class="small" x="140" y="45">物理麦克风最多 4 秒，不上传</text></g><path class="edge" d="M310 50H370"/><g class="node" transform="translate(370 20)"><rect width="260" height="60" rx="10"/><text x="130" y="25">基线真实录音器</text><text class="small" x="130" y="45">原始编码 → 解码 → 24k WAV</text></g><path class="edge" d="M630 50H690"/><g class="node" transform="translate(690 20)"><rect width="280" height="60" rx="10"/><text x="140" y="25">分阶段采样与指标</text><text class="small" x="140" y="45">峰值 / RMS / 削波 / 释放时序</text></g><path class="edge" d="M830 80V146"/><g class="node" transform="translate(690 148)"><rect width="280" height="60" rx="10"/><text x="140" y="25">现有加密 / 解密在内存往返</text><text class="small" x="140" y="45">完整文件 SHA-256 相等</text></g><path class="edge" d="M690 178H630"/><g class="node start" transform="translate(370 148)"><rect width="260" height="60" rx="10"/><text x="130" y="25">本机试听与受控压力输入</text><text class="small" x="130" y="45">64k / 128k，削波与接点平滑对照</text></g><path class="edge" d="M370 178H310"/><g class="node" transform="translate(30 148)"><rect width="280" height="60" rx="10"/><text x="140" y="25">记录结论与证据边界</text><text class="small" x="140" y="45">已证实 / 条件性风险 / 真机缺口</text></g><path class="edge" d="M170 208V288H370"/><g class="node" transform="translate(370 260)"><rect width="600" height="65" rx="10"/><text x="300" y="27">停止、隐藏或离开：停麦、停止试听、撤销对象 URL</text><text class="small" x="300" y="48">不写入真实聊天、恢复材料、持久存储或服务器</text></g></svg></div></section><p class="boundary">此页是 Mermaid 源码的同版可视摘要，分支细节见源码。气泡播放为模拟计时；加解密验证使用本机临时密钥与合成音频。真实回执和隐私生命周期仍以产品契约为准。</p></main></body></html>
