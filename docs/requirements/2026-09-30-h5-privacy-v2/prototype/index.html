<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H5 遮蔽 V2 · 交互原型</title><style>
:root{color-scheme:light;--paper:oklch(97.9% .008 248);--paper-pure:oklch(99.4% .004 248);--surface:oklch(94.8% .014 248);--ink:oklch(22.5% .022 250);--ink-muted:oklch(43.5% .024 250);--ink-faint:oklch(56% .018 250);--accent:oklch(58.5% .205 254);--outgoing:oklch(48% .2 254);--line:oklch(78% .025 245 / .58)}
body.dark{color-scheme:dark;--paper:oklch(20.5% .024 252);--paper-pure:oklch(23.5% .025 252);--surface:oklch(27% .028 252);--ink:oklch(95% .012 245);--ink-muted:oklch(76% .022 245);--ink-faint:oklch(64% .018 245);--accent:oklch(74% .17 245);--line:oklch(58% .03 250 / .48)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}button,textarea{font:inherit}button{min-height:44px;cursor:pointer;border:1px solid var(--line);border-radius:14px;color:var(--ink);background:var(--paper-pure);padding:9px 15px}button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[disabled]{opacity:.5;cursor:default}.primary{background:var(--accent);color:var(--paper-pure);border:0}.workspace{max-width:1120px;margin:32px auto;padding:0 24px;display:grid;grid-template-columns:minmax(250px,1fr) 390px;gap:40px;align-items:start}h1{font-size:26px;line-height:1.3;margin:0 0 12px}h2{font-size:17px;margin:24px 0 10px}.intro{color:var(--ink-muted);max-width:540px}.controls{display:flex;gap:8px;flex-wrap:wrap}.cases{display:grid;gap:9px}.cases button{text-align:left}.cases .active{border-color:var(--accent)}.state{margin-top:18px;padding:14px 0;border-top:1px solid var(--line);color:var(--ink-muted)}.state strong{color:var(--ink)}.phone{width:390px;height:760px;max-width:100%;position:relative;background:var(--paper-pure);border:1px solid var(--line);border-radius:0;overflow:hidden}.chrome{height:44px;padding:10px 20px;display:flex;justify-content:space-between;background:var(--paper-pure);font-size:12px}.screen{position:absolute;inset:44px 0 0;background:var(--paper-pure)}.header{height:65px;padding:18px 24px;border-bottom:1px solid var(--line);font-weight:600}.messages{padding:25px 24px;display:flex;flex-direction:column;gap:20px}.bubble{padding:12px 16px;border-radius:19px;max-width:82%;background:var(--surface);align-self:flex-start}.bubble.outgoing{background:var(--outgoing);color:white;align-self:flex-end}.tiny{font-size:12px;color:var(--ink-faint)}.photo{height:115px;display:grid;place-items:center;background:var(--surface);border-radius:19px;color:var(--ink-faint)}.composer{position:absolute;bottom:25px;left:20px;right:20px;display:flex;gap:10px;align-items:center}.composer textarea{width:100%;resize:none;height:50px;padding:12px;border:1px solid var(--line);border-radius:24px;background:var(--paper);color:var(--ink)}.composer button{border-radius:50%;padding:9px 14px}.cover{position:absolute;inset:0;background:var(--paper-pure);color:var(--ink-muted);z-index:10}.cover-error{position:absolute;top:150px;left:32px;right:32px}.cover-error svg{width:42px;height:48px;margin-bottom:24px;color:var(--ink-faint)}.cover h1{font-size:22px;font-weight:500;margin-bottom:18px}.cover p,.cover ul{font-size:14px}.cover ul{padding-left:20px}.cover code{font:11px ui-monospace,SFMono-Regular,monospace;color:var(--ink-faint);display:block;margin-top:22px}.entry{position:absolute;right:0;bottom:0;width:104px;height:100px;border:0;border-radius:0;padding:0;background:transparent;touch-action:none}.entry.holding{background:color-mix(in oklch,var(--accent) 8%,transparent)}.gateway{height:100%;padding:24px;display:flex;justify-content:flex-end;flex-direction:column;padding-bottom:42px;gap:14px}.error{color:#d24c48}.tool{position:absolute;z-index:20;left:12px;right:12px;bottom:12px;border:1px solid var(--line);border-radius:22px;background:var(--paper-pure);padding:22px;box-shadow:0 12px 45px #0002}.tool h2{margin:5px 0 16px}.tool p{color:var(--ink-muted)}.tool .controls button{flex:1}.call{position:absolute;inset:0;background:var(--paper-pure);padding:70px 24px;text-align:center}.call h2{font-size:26px}.camera{height:260px;background:var(--surface);display:grid;place-items:center;color:var(--ink-faint);margin-top:30px}.center{padding:120px 24px;text-align:center;color:var(--ink-muted)}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}a{color:var(--accent)}.note{font-size:12px;color:var(--ink-faint);margin-top:15px}@media(max-width:760px){.workspace{display:flex;flex-direction:column;padding:0 12px;margin:20px auto;gap:24px}.phone{align-self:center;width:min(390px,100%);height:720px}.controls{gap:6px}.cases{grid-template-columns:1fr 1fr}.cases button{font-size:13px;padding:10px}.intro{font-size:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main class="workspace"><section><h1 data-t="title"></h1><p class="intro" data-t="intro"></p><nav class="controls" aria-label="原型设置"><button id="language">中 / EN</button><button id="theme" data-t="theme"></button><button id="reset" data-t="reset"></button></nav><h2 data-t="choose"></h2><div class="cases" id="cases"></div><h2 data-t="events"></h2><div class="controls" id="events"></div><div class="state" role="status" aria-live="polite"><strong data-t="current"></strong><div id="status"></div></div><p class="note" data-t="hint"></p><p class="note" data-t="limit"></p></section><section class="phone" aria-label="Quiet Room 模拟页面"><div class="chrome"><span>9:41</span><span>Quiet Room</span><span>•••</span></div><div class="screen" id="screen"></div></section></main><script>
const words={zh:{title:'H5 隐私遮蔽 · V2',intro:'使用合成内容验证遮蔽、系统操作与返回流程。右侧沿用当前产品的遮蔽外观和长按入口。',theme:'浅色 / 深色',reset:'重新开始',choose:'切换场景',events:'触发事件',current:'当前模拟状态',hint:'普通失焦后回焦仍保持遮蔽。没有明确结束信号时，长按页面右下角 1 秒继续；已锁定时进入验证。',limit:'此原型不调用真实系统工具、通行密钥或聊天数据，不能证明系统缩略图安全。',chat:'正常聊天',picker:'选择文件',keyboard:'键盘 / 选字工具',unknown:'未归属失焦',call:'通话中遮蔽',empty:'空内容',loading:'加载中',failure:'加载失败',blur:'再次失焦',focus:'回到前台',hidden:'进入后台',expiry:'期限到',late:'迟到结果',clear:'正常显示 · 会话有效',masked:'已遮蔽 · 会话暂时保留',locked:'已锁定 · 需要重新验证',verifying:'等待验证',failed:'验证失败 · 可重试',header:'私密空间',message1:'这是用于验证流程的合成消息。',message2:'草稿在临时遮蔽后仍保留。',photo:'合成图片占位',draft:'这是一条未发送的测试草稿',input:'输入消息',plus:'打开选择文件模拟',send:'发送（模拟）',unavailable:'无法访问此网站',closed:'连接已意外关闭。',try:'请试试以下办法：',network:'检查网络连接',proxy:'检查代理服务器和防火墙',entry:'长按继续',toolTitle:'选择文件（模拟）',toolBody:'选择或取消后，模拟工具完成并确认回焦，原会话可以继续。',select:'选择',cancel:'取消',keyboardTitle:'键盘工具（模拟）',keyboardBody:'系统编辑工具没有可靠的结束信号。关闭后页面保持遮蔽，使用现有入口继续。',done:'关闭工具',unlock:'解锁',verifyFail:'模拟验证失败',verifyCancel:'取消验证',verifyError:'验证未完成，请重试。',callTitle:'对方',callBody:'视频通话 · 合成界面',camera:'合成视频区域',hangup:'结束通话',emptyBody:'还没有消息',loadingBody:'正在加载…',failureBody:'加载失败，请重试',retry:'重试',background:'后台已锁定；迟到结果不会恢复页面。',lateStatus:'迟到结果已拒绝，页面状态不变。',corner:'请长按页面右下角 1 秒',owned:'系统操作进行中，页面保持遮蔽。'},en:{title:'H5 privacy curtain · V2',intro:'Synthetic content demonstrates concealment, system operations and return flows. The preview retains the current cover and hold gesture.',theme:'Light / Dark',reset:'Start again',choose:'Scenarios',events:'Events',current:'Simulated state',hint:'Focus alone does not reveal the page. Without a confirmed operation end, hold the bottom-right corner for one second to continue. A locked session requires verification.',limit:'No real system tools, passkeys or chat data are used. This prototype does not verify system thumbnails.',chat:'Conversation',picker:'File picker',keyboard:'Keyboard / selection',unknown:'Unowned blur',call:'Call concealment',empty:'Empty',loading:'Loading',failure:'Load failure',blur:'Another blur',focus:'Return to foreground',hidden:'Enter background',expiry:'Expire deadline',late:'Late result',clear:'Visible · session valid',masked:'Concealed · session temporarily retained',locked:'Locked · verification required',verifying:'Awaiting verification',failed:'Verification failed · retry available',header:'Private space',message1:'This is a synthetic message for flow testing.',message2:'The draft survives temporary concealment.',photo:'Synthetic image placeholder',draft:'An unsent synthetic draft',input:'Message',plus:'Open simulated file picker',send:'Send (simulated)',unavailable:'This site can’t be reached',closed:'The connection was unexpectedly closed.',try:'Try:',network:'Checking the connection',proxy:'Checking the proxy and firewall',entry:'Hold to continue',toolTitle:'File picker (simulated)',toolBody:'Select or cancel confirms completion and focus return. The original session can continue.',select:'Select',cancel:'Cancel',keyboardTitle:'Keyboard tool (simulated)',keyboardBody:'The editing tool has no reliable completion signal. After closing, use the existing entry to continue.',done:'Close tool',unlock:'Unlock',verifyFail:'Simulate failed verification',verifyCancel:'Cancel verification',verifyError:'Verification was not completed. Try again.',callTitle:'Other person',callBody:'Video call · synthetic view',camera:'Synthetic video area',hangup:'End call',emptyBody:'No messages yet',loadingBody:'Loading…',failureBody:'Could not load. Try again.',retry:'Retry',background:'Background transition locked the session. Late results cannot restore it.',lateStatus:'Late result rejected. State unchanged.',corner:'Hold the bottom-right corner for one second',owned:'System operation active. Page remains concealed.'}};
let language='zh',scene='chat',view='clear',tool=null,foreground=true,valid=true,holdTimer=null,detail='',draft=null;
const t=k=>words[language][k]; const screen=document.querySelector('#screen');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chat(){return `<div class="header">${t('header')}</div><div class="messages"><div class="bubble">${t('message1')}</div><div class="bubble outgoing">${t('message2')}</div><div class="photo">${t('photo')}</div><span class="tiny">9:41</span></div><div class="composer"><button id="picker-open" aria-label="${t('plus')}">＋</button><textarea id="draft" aria-label="${t('input')}">${esc(draft??t('draft'))}</textarea><button id="send" aria-label="${t('send')}">↑</button></div>`;}
function cover(){return `<div class="cover"><div class="cover-error"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 5h19l9 9v29H10zM29 5v10h9M17 25h2m10 0h2M18 35l5-3 6 3"/></svg><h1>${t('unavailable')}</h1><p>${t('closed')}</p><p>${t('try')}</p><ul><li>${t('network')}</li><li>${t('proxy')}</li></ul><code>ERR_CONNECTION_CLOSED 0</code></div><button class="entry" id="entry" aria-label="${t('entry')}"></button></div>`;}
function render(){document.documentElement.lang=language==='zh'?'zh-CN':'en';document.title=t('title');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelector('.phone').setAttribute('aria-label',language==='zh'?'Quiet Room 模拟页面':'Quiet Room simulated page');document.querySelector('nav').setAttribute('aria-label',language==='zh'?'原型设置':'Prototype settings');document.querySelector('#cases').innerHTML=['chat','picker','keyboard','unknown','call','empty','loading','failure'].map(k=>`<button data-scene="${k}" class="${scene===k?'active':''}">${t(k)}</button>`).join('');document.querySelector('#events').innerHTML=['blur','focus','hidden','expiry','late'].map(k=>`<button data-event="${k}">${t(k)}</button>`).join('');document.querySelector('#status').textContent=t(view)+(detail?' · '+t(detail):'');
if(view==='verifying'||view==='failed'){screen.innerHTML=`<div class="gateway">${view==='failed'?`<p class="error" role="alert">${t('verifyError')}</p>`:''}<button id="unlock" class="primary">${t('unlock')}</button><button id="fail">${t('verifyFail')}</button><button id="verify-cancel">${t('verifyCancel')}</button></div>`;document.querySelector('#unlock').onclick=()=>{valid=true;view='clear';scene='chat';detail='';render()};document.querySelector('#fail').onclick=()=>{view='failed';render()};document.querySelector('#verify-cancel').onclick=()=>{view='locked';render()};return}
let content=scene==='call'?`<div class="call"><h2>${t('callTitle')}</h2><p>${t('callBody')}</p><div class="camera">${t('camera')}</div><button id="hangup">${t('hangup')}</button></div>`:['empty','loading','failure'].includes(scene)?`<div class="header">${t('header')}</div><div class="center">${t(scene+'Body')}${scene==='failure'?`<p><button id="retry">${t('retry')}</button></p>`:''}</div>`:chat();screen.innerHTML=view==='clear'?content:cover();
if(tool){screen.insertAdjacentHTML('beforeend',`<section class="tool" role="dialog" aria-label="${t(tool==='picker'?'toolTitle':'keyboardTitle')}"><span class="tiny">${language==='zh'?'系统界面模拟':'Simulated system surface'}</span><h2>${t(tool==='picker'?'toolTitle':'keyboardTitle')}</h2><p>${t(tool==='picker'?'toolBody':'keyboardBody')}</p><div class="controls">${tool==='picker'?`<button id="choose" class="primary">${t('select')}</button><button id="cancel">${t('cancel')}</button>`:`<button id="done">${t('done')}</button>`}</div></section>`)}
const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};bind('picker-open',()=>start('picker'));bind('hangup',()=>start('chat'));bind('retry',()=>start('chat'));bind('send',()=>{draft='';render()});const input=document.querySelector('#draft');if(input)input.oninput=()=>draft=input.value;
for(const id of ['choose','cancel'])bind(id,()=>{tool=null;if(valid&&foreground&&view==='masked'){view='clear';scene='chat';detail=''}else detail='lateStatus';render()});bind('done',()=>{tool=null;foreground=true;detail='corner';render()});const entry=document.querySelector('#entry');if(entry){const cancel=()=>{clearTimeout(holdTimer);entry.classList.remove('holding')};entry.onpointerdown=e=>{e.preventDefault();entry.setPointerCapture(e.pointerId);entry.classList.add('holding');holdTimer=setTimeout(()=>{if(!foreground)return;if(valid){view='clear';if(['unknown','keyboard'].includes(scene))scene='chat'}else view='verifying';detail='';render()},1000)};entry.onpointerup=cancel;entry.onpointercancel=cancel;entry.onlostpointercapture=cancel}}
function start(next){clearTimeout(holdTimer);scene=next;valid=true;foreground=true;view=['picker','keyboard','unknown'].includes(next)?'masked':'clear';tool=['picker','keyboard'].includes(next)?next:null;detail=tool?'owned':next==='unknown'?'corner':'';render()}
function event(type){if(type==='hidden'||type==='expiry'){valid=false;view='locked';tool=null;foreground=type!=='hidden';detail=type==='hidden'?'background':''}else if(type==='blur'){if(view==='clear')view='masked';foreground=false;detail=''}else if(type==='focus'){foreground=true;detail=valid?'corner':'background'}else detail='lateStatus';render()}
document.querySelector('#cases').onclick=e=>{if(e.target.dataset.scene)start(e.target.dataset.scene)};document.querySelector('#events').onclick=e=>{if(e.target.dataset.event)event(e.target.dataset.event)};document.querySelector('#language').onclick=()=>{language=language==='zh'?'en':'zh';render()};document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');document.querySelector('#reset').onclick=()=>{draft=null;start('chat')};window.prototypeState=()=>({scene,view,tool,foreground,valid});render();
</script></body></html>
