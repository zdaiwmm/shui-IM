<!doctype html><html lang="zh-CN" data-color-scheme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chamber · 语言与反馈 · 静态原型 V1.1</title>
<link rel="stylesheet" href="../../../../src/design-tokens.css">
<style>

line);border-radius:12px;box-shadow:0 4px 18px #18231c18;font-size:13px;color:var(--danger)}.field-error{color:var(--danger);font-size:12px;margin-top:8px}.invalid{border-color:var(--danger)}.note-strip{padding:18px 0 0;color:var(--ink-muted);font-size:12px;display:flex;gap:24px}.admin-board{padding:28px;width:1440px}.admin-shell{display:grid;grid-template-columns:240px 1fr;min-height:780px;border:1px solid var(--line);background:var(--paper)}.sidebar{background:var(--paper-pure);border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 32px}.brand strong{display:block;font-size:17px}.brand small{color:var(--ink-muted);font-size:12px}.brandmark{width:34px;height:34px;border-radius:12px;background:var(--action-surface);color:var(--action-ink);display:grid;place-items:center}.nav-label{font-size:11px;color:var(--ink-muted);margin:18px 12px 8px}.nav{display:flex;align-items:center;gap:12px;min-height:44px;border-radius:12px;padding:10px 12px;margin-bottom:5px}.active{background:var(--accent-soft);color:var(--accent);font-weight:600}.sidebar-foot{margin-top:auto;padding:20px 10px 0;color:var(--ink-muted);font-size:12px}.topbar{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--paper-pure)}.topbar h1{font-size:24px}.outline{padding:8px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper-pure)}.workspace{padding:26px 28px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.tabs{display:flex;gap:24px}.tab{padding:10px 0;color:var(--ink-muted);border-bottom:2px solid transparent}.tab.selected{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}.table-wrap{border:1px solid var(--line);border-radius:12px;background:var(--paper-pure);overflow:hidden}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{font-size:12px;color:var(--ink-muted);font-weight:500;background:var(--surface);padding:14px 16px}td{padding:20px 16px;border-top:1px solid var(--line-subtle)}.selected-row{background:color-mix(in srgb,var(--accent-soft) 40%,var(--paper-pure))}.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:7px;font-size:12px;padding:3px 8px}.badge.read{background:var(--surface);color:var(--ink-muted)}.text-action{color:var(--accent);font-weight:500}.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:18px;color:var(--ink-muted);font-size:12px}.detail{margin-top:24px;border-top:1px solid var(--line);padding-top:22px}.detail-head{display:flex;justify-content:space-between;align-items:center}.detail-meta{display:flex;gap:32px;color:var(--ink-muted);font-size:12px;margin:16px 0}.detail-body{font-size:14px;line-height:1.9;max-width:70ch}.detail-note{font-size:12px;color:var(--ink-muted);margin-top:20px}.flow-board{padding:32px;width:1298px}.flow{display:flex;align-items:center;gap:16px;margin:28px 0 40px}.node{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface-raised);width:220px;min-height:110px}.node b{display:block;margin-bottom:7px}.node p{font-size:12px;color:var(--ink-muted)}
</style>
<div id="root"></div><script>
const params=new URLSearchParams(location.search),dark=params.get('theme')==='dark';document.documentElement.dataset.colorScheme=dark?'dark':'light';document.documentElement.style.colorScheme=dark?'dark':'light';
const paths={check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18"/>',chat:'<path d="M21 11a8 8 0 0 1-8 8H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/>',shield:'<path d="m12 3 8 3v5c0 5-8 10-8 10S4 16 4 11V6Z"/><path d="m8 11 3 3 5-5"/>',device:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/>',key:'<circle cx="8" cy="8" r="5"/><path d="m12 12 9 9m-5-5 3-3m0 6 3-3"/>',archive:'<rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v13h14V8M10 12h4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',heart:'<path d="M20 5c-3-3-7 0-8 2-1-2-5-5-8-2s-1 7 8 14C21 12 23 8 20 5Z"/>',appearance:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 3a9 9 0 0 1 0 18Z"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',activity:'<path d="M2 12h5l3-8 4 16 3-8h5"/>'};
const icon=(n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.chat}</svg>`;
const head=(title,desc)=>`<div class="board-head"><div><p class="eyebrow">CHAMBER / LANGUAGE & FEEDBACK</p><h1>${title}</h1><p class="sub">${desc}</p></div><span class="version">静态原型 V1.1 · ${dark?'深色':'浅色'} · 2026.10.28</span></div>`;
const footer=(txt='返回')=>`<footer class="footer"><button class="back">${txt}</button></footer>`;
const screen=(name,body,cls='')=>`<div><p class="caption">${name}</p><section class="screen ${cls}"><div class="safe"></div>${body}</section></div>`;
const row=(label,n,value='')=>`<div class="row"><span class="tile">${icon(n)}</span><span class="label">${label}</span>${value?`<span class="value">${value}</span>`:''}${icon('chevron','chevron')}</div>`;
function settings(){return `<div class="content settings"><header class="settings-title"><h1>设置</h1><button class="close">${icon('close')}</button></header><p class="group-title">聊天体验</p><div class="group">${row('外观','appearance')}${row('在线状态样式','heart','在线胶囊')}${row('语言 / Language','globe','简体中文')}</div><p class="group-title">隐私保护</p><div class="group">${row('应用锁与自动锁定','key')}${row('入口遮蔽页','shield')}</div><p class="group-title">密室与设备</p><div class="group">${row('切换密室','chat')}${row('设备管理','device')}${row('帮对方进入密室','device')}</div><p class="group-title">备份与恢复</p><div class="group">${row('恢复凭证','key')}${row('聊天记录恢复','archive')}</div><p class="group-title">关于</p><div class="group">${row('用户反馈','chat')}${row('版本记录','clock')}</div></div>`}
const languages=[['English','EN'],['简体中文','简'],['繁體中文','繁'],['Español','ES'],['Français','FR'],['Deutsch','DE'],['Português','PT'],['Русский','RU'],['العربية','AR'],['日本語','JA'],['हिन्दी','HI']];
function language(){return `<div class="content language"><header class="page-title"><h1>语言 / Language</h1><p>选择后立即生效，仅用于此设备。</p></header><div class="group"><div class="row"><span class="label">跟随系统</span><span class="value">当前：简体中文</span></div></div><p class="group-title">选择语言</p><div class="group">${languages.map(([name,code])=>`<div class="row"><span class="label" dir="auto">${name}</span><span class="lang-code">${code}</span>${name==='简体中文'?`<span class="check">${icon('check')}</span>`:'<span style="width:19px"></span>'}</div>`).join('')}</div><p class="hint">无法匹配系统语言时使用 English。</p></div>${footer()}`}
const example='希望反馈提交成功后，可以明确提示已经收到。这样我就知道不需要再次提交了。';
function feedback(state='filled'){let empty=state==='empty',error=state==='error';return `<div class="content"><header class="page-title"><h1>用户反馈</h1><p>告诉我们遇到的问题，或你的建议。</p></header><div class="field"><label>邮箱<span class="required">必填</span></label><input class="input ${error?'invalid':''}" value="${empty?'':error?'lin@':'lin@example.com'}" placeholder="name@example.com" readonly>${error?'<p class="field-error">请输入有效的邮箱地址。</p>':'<p class="hint">用于必要时与你联系。</p>'}</div><div class="field"><label>反馈内容<span class="required">必填</span></label><textarea class="input textbox" placeholder="请描述具体问题、出现步骤或你的建议。" readonly>${empty?'':example}</textarea><p class="counter">${empty?0:example.length} / 5,000</p></div><p class="privacy">${icon('shield')}<span>邮箱和反馈内容将提交给管理员查看。<br>请勿填写聊天内容、密码或恢复凭证。</span></p><button class="primary">${state==='sending'?'正在提交…':'提交反馈'}</button></div>${footer()}${state==='failed'?'<div class="toast">提交失败，内容已保留，请重试。</div>':''}`}
function success(){return `<div class="status-content"><div class="success-mark">${icon('check')}</div><h1>反馈已提交</h1><p>谢谢你的反馈，我们已收到。<br>如需进一步了解，我们会通过邮箱联系你。</p></div>${footer('返回设置')}`}
function mobile(){return `<div class="board">${head('语言与用户反馈','沿用当前设置分组与子页结构，新增 11 种语言和反馈入口。')}<div class="screens">${screen('01 / 设置入口',settings())}${screen('02 / 语言选择 · 手动选择简体中文',language())}${screen('03 / 用户反馈 · 填写示例',feedback())}</div><div class="note-strip"><span>390 × 844 页面视口 · 系统字体 · 44px 操作区</span><span>繁体中文独立选项 · 邮箱与正文必填</span><span>仅设计预览，未连接实际服务</span></div></div>`}
function states(){return `<div class="board">${head('填写、重试与提交完成','输入错误原位提示；网络失败保留本次输入；提交成功后可返回设置。')}<div class="screens">${screen('04 / 邮箱格式错误',feedback('error'))}${screen('05 / 网络失败 · 保留输入',feedback('failed'))}${screen('06 / 提交成功',success())}</div><div class="note-strip"><span>提交中按钮显示“正在提交…”并禁止重复操作。</span><span>反馈不会自动附带聊天、密钥或恢复材料。</span></div></div>`}
function admin(){return `<div class="admin-board">${head('后台 · 用户反馈','新增同级入口，按提交时间倒序查看；列表与完整内容使用模拟数据。')}<div class="admin-shell"><aside class="sidebar"><div class="brand"><div class="brandmark">${icon('chat')}</div><div><strong>Chamber</strong><small>管理工作区</small></div></div><p class="nav-label">工作区</p>${[['总览','grid'],['密室管理','chat'],['归档与备份','archive'],['表情资源','appearance'],['用户反馈','chat']].map(([t,i])=>`<div class="nav ${t==='用户反馈'?'active':''}">${icon(i)}${t}</div>`).join('')}<p class="nav-label">管理</p><div class="nav">${icon('activity')}运维诊断</div><div class="nav">${icon('shield')}安全与审计</div><div class="sidebar-foot">私密聊天仅显示元数据<br>用户主动提交的反馈单独查看</div></aside><main><header class="topbar"><div><p class="eyebrow">CHAMBER / 管理工作区</p><h1>用户反馈</h1></div><button class="outline">退出后台</button></header><div class="workspace"><div class="toolbar"><div class="tabs"><span class="tab selected">全部 3</span><span class="tab">未读 2</span><span class="tab">已读 1</span></div><button class="outline">刷新</button></div><div class="table-wrap"><table><thead><tr><th>状态</th><th>邮箱</th><th>反馈摘要</th><th>提交时间</th><th>操作</th></tr></thead><tbody><tr class="selected-row"><td><span class="badge">未读</span></td><td>lin@example.com</td><td>希望反馈提交成功后，可以明确提示…</td><td>2026-10-28 14:32</td><td class="text-action">收起详情</td></tr><tr><td><span class="badge">未读</span></td><td>chen@example.com</td><td>希望能使用繁體中文介面。</td><td>2026-10-28 13:06</td><td class="text-action">查看</td></tr><tr><td><span class="badge read">已读</span></td><td>alex@example.com</td><td>Thank you for adding language settings.</td><td>2026-10-28 11:48</td><td class="text-action">查看</td></tr></tbody></table></div><div class="pagination"><span>共 3 条 · 第 1 页</span><div><button class="outline" disabled>上一页</button> <button class="outline" disabled>下一页</button></div></div><section class="detail"><div class="detail-head"><h2>反馈详情</h2><button class="outline">标记为已读</button></div><div class="detail-meta"><span>邮箱：lin@example.com</span><span>提交于 2026-10-28 14:32</span><span>状态：未读</span></div><p class="detail-body">${example}</p><p class="detail-note">仅包含用户主动填写的邮箱和反馈原文。</p></section></div></main></div><p class="rule">静态模拟数据 · 阅读原文及手动标记已读 · 本期不包含站内回复功能</p></div>`}
function flow(){let nodes=(data)=>`<div class="flow">${data.map(([a,b],i)=>`${i?icon('chevron'):''}<div class="node"><b>${a}</b><p>${b}</p></div>`).join('')}</div>`;return `<div class="flow-board">${head('语言初始化与反馈流程','静态流程说明，供确认行为边界。')}<h2>首次进入与语言选择</h2>${nodes([['读取本机偏好','已有手动选择时优先使用。'],['匹配设备语言','无手动选择时按设备语言顺序匹配，区分简繁体。'],['未匹配 → English','明确繁体标签匹配繁体；简体标签匹配简体。'],['设置中切换','立即生效并保存在本设备，可重新选择跟随系统。']])}<h2>反馈提交与后台查看</h2>${nodes([['设置 → 用户反馈','邮箱与多行正文必填，正文最多 5,000 字。'],['校验后提交','格式错误原位提示；提交中禁止重复操作。'],['提交结果','成功显示已收到；失败保留输入并允许重试。'],['后台查看','鉴权后查看列表与原文，手动标记已读。']])}<p class="rule">本版本仅确认静态页面与流程；系统语言、持久化、提交接口、限流和真实权限在正式实施阶段验证。</p></div>`}
document.querySelector('#root').innerHTML=({mobile,states,admin,flow}[params.get('view')]||mobile)();
</script></html>
