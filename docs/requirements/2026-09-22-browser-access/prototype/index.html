  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;qr-access&quot;&gt;
 &lt;div class=&quot;q-head&quot;&gt;&lt;strong&gt;多浏览器接入 · 交互图&lt;/strong&gt;&lt;span class=&quot;q-tag&quot;&gt;S5 · 可点击演示&lt;/span&gt;&lt;/div&gt;
 &lt;nav class=&quot;q-tabs&quot; aria-label=&quot;交互场景&quot;&gt;&lt;/nav&gt;
 &lt;div class=&quot;q-layout&quot;&gt;&lt;nav class=&quot;q-rail&quot; aria-label=&quot;流程节点&quot;&gt;&lt;/nav&gt;&lt;div&gt;&lt;div class=&quot;q-phone&quot;&gt;&lt;div class=&quot;q-top&quot;&gt;&lt;button class=&quot;q-back&quot; data-action=&quot;back&quot;&gt;‹ 返回&lt;/button&gt;&lt;span id=&quot;q-device&quot;&gt;新浏览器&lt;/span&gt;&lt;span&gt;Quiet Room&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;q-screen&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;q-sim&quot; aria-label=&quot;演示条件&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;qr-access&#x27;);
const btn=(t,a,k=&#x27;primary&#x27;)=&gt;`&lt;button class=&quot;q-button ${k} cursor-interaction&quot; data-action=&quot;${a}&quot;&gt;${t}&lt;/button&gt;`;
const info=t=&gt;`&lt;div class=&quot;q-info&quot;&gt;${t}&lt;/div&gt;`;
const intro=(t,p,b,a)=&gt;`&lt;div class=&quot;q-brand&quot; aria-hidden=&quot;true&quot;&gt;↗&lt;/div&gt;&lt;h2&gt;${t}&lt;/h2&gt;&lt;p&gt;${p}&lt;/p&gt;${b||&#x27;&#x27;}&lt;div class=&quot;q-actions&quot;&gt;${a||&#x27;&#x27;}&lt;/div&gt;`;
let scenario=&#x27;browser&#x27;,screen=&#x27;welcome&#x27;,modal=null,authFor=&#x27;browser&#x27;,browserOK=false,browserRequest=false,oldSelected=&#x27;晚风&#x27;,selected=&#x27;晚风&#x27;,notice=&#x27;&#x27;,serial=0;
let rooms={&#x27;晚风&#x27;:{status:&#x27;none&#x27;,deadline:0,id:0},&#x27;周末计划&#x27;:{status:&#x27;none&#x27;,deadline:0,id:0}};
const scenarios={browser:{name:&#x27;浏览器授权&#x27;,steps:[[&#x27;welcome&#x27;,&#x27;点击继续&#x27;],[&#x27;auth&#x27;,&#x27;系统验证&#x27;],[&#x27;wait&#x27;,&#x27;等待其他在线设备&#x27;],[&#x27;old&#x27;,&#x27;其他设备授权弹窗&#x27;],[&#x27;shell&#x27;,&#x27;进入未授权聊天页&#x27;]],note:&#x27;旧端只认可新浏览器，不授予任何空间权限。新端默认选中旧端当前空间；不显示消息，不允许输入。&#x27;},space:{name:&#x27;空间对方授权&#x27;,steps:[[&#x27;shell&#x27;,&#x27;点击底部申请&#x27;],[&#x27;spaceauth&#x27;,&#x27;系统验证&#x27;],[&#x27;pending&#x27;,&#x27;推送请求 · 10 分钟&#x27;],[&#x27;peer&#x27;,&#x27;对方自动弹窗&#x27;],[&#x27;chat&#x27;,&#x27;批准后开放聊天&#x27;]],note:&#x27;每个空间由空间对方授权。验证成功才发送请求；正式计时以服务端确认创建时刻为准。&#x27;},reopen:{name:&#x27;关闭、重开与过期&#x27;,steps:[[&#x27;peer&#x27;,&#x27;对方收到弹窗&#x27;],[&#x27;peerhome&#x27;,&#x27;关闭但保留请求&#x27;],[&#x27;peerlist&#x27;,&#x27;列表入口重新打开&#x27;],[&#x27;reopen&#x27;,&#x27;同一请求剩余时间&#x27;],[&#x27;peerexpired&#x27;,&#x27;到期后自动消失&#x27;]],note:&#x27;关闭不等于拒绝，重新打开不会重置倒计时。到期后对方弹窗与列表入口自动消失；申请方可重新验证后申请。&#x27;}};
const room=()=&gt;rooms[selected];
const active=()=&gt;room().status===&#x27;pending&#x27;&amp;&amp;room().deadline&gt;Date.now();
const remaining=()=&gt;{let n=Math.max(0,Math.ceil((room().deadline-Date.now())/1000));return `${String(Math.floor(n/60)).padStart(2,&#x27;0&#x27;)}:${String(n%60).padStart(2,&#x27;0&#x27;)}`;};
const timer=()=&gt;`&lt;span class=&quot;q-timer&quot; data-countdown&gt;${remaining()}&lt;/span&gt;`;
const head=(peer=false)=&gt;`&lt;div class=&quot;q-chat-head&quot;&gt;&lt;button data-action=&quot;${peer?&#x27;peerlist&#x27;:&#x27;drawer&#x27;}&quot;&gt;☰ ${selected}&lt;/button&gt;${peer||room().status===&#x27;approved&#x27;?&#x27;&lt;span class=&quot;q-presence&quot;&gt;TA · 在线 · 我&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;q-tag&quot;&gt;此浏览器待授权&lt;/span&gt;&#x27;}&lt;/div&gt;`;
function shell(){
const r=room();let title=&#x27;此空间尚未授权&#x27;,copy=&#x27;请向空间对方申请授权，&lt;br&gt;通过后即可在此浏览器聊天。&#x27;,action=btn(&#x27;申请对方授权&#x27;,&#x27;spaceauth&#x27;);
if(r.status===&#x27;pending&#x27;){title=&#x27;等待对方授权&#x27;;copy=`请求已发送，剩余 ${timer()}&lt;br&gt;对方进入并解锁此空间后会看到弹窗。`;action=btn(&#x27;等待对方授权 · &#x27;+remaining(),&#x27;noop&#x27;,&#x27;text&#x27;)+btn(&#x27;取消此次申请&#x27;,&#x27;cancelspace&#x27;,&#x27;text&#x27;);}
if(r.status===&#x27;expired&#x27;){title=&#x27;授权请求已过期&#x27;;copy=&#x27;10 分钟内未完成授权。&lt;br&gt;重新申请需要再次验证通行密钥。&#x27;;action=btn(&#x27;重新申请对方授权&#x27;,&#x27;spaceauth&#x27;);}
if(r.status===&#x27;rejected&#x27;){title=&#x27;对方未同意此次申请&#x27;;copy=&#x27;此浏览器仍无法读取或发送消息。&#x27;;action=btn(&#x27;重新申请对方授权&#x27;,&#x27;spaceauth&#x27;);}
if(r.status===&#x27;approved&#x27;)return `${head()}&lt;div class=&quot;q-empty&quot;&gt;&lt;span class=&quot;q-chip&quot;&gt;此空间已授权&lt;/span&gt;&lt;p&gt;可以开始聊天了。&lt;br&gt;仅接收加入后的消息，原浏览器仍可用。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;q-composer&quot; role=&quot;textbox&quot; aria-label=&quot;消息输入区域，演示不可发送&quot;&gt;说点什么… &lt;span style=&quot;float:right&quot;&gt;＋&lt;/span&gt;&lt;/div&gt;`;
return `${head()}&lt;div class=&quot;q-empty&quot;&gt;&lt;h2&gt;${title}&lt;/h2&gt;&lt;p&gt;${copy}&lt;/p&gt;${notice?`&lt;p class=&quot;q-error&quot; role=&quot;status&quot;&gt;${notice}&lt;/p&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;q-requestbar&quot;&gt;${action}&lt;/div&gt;`;
}
const peerBackground=()=&gt;`${head(true)}&lt;div class=&quot;q-empty&quot;&gt;&lt;p&gt;空间对方 · 已解锁 ${selected}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;q-composer&quot;&gt;说点什么…&lt;/div&gt;`;
function drawer(peer=false){return `&lt;div class=&quot;q-drawer&quot;&gt;&lt;div class=&quot;q-section&quot;&gt;${peer?&#x27;空间对方的空间列表&#x27;:&#x27;我的空间列表&#x27;}&lt;/div&gt;&lt;div class=&quot;q-current&quot;&gt;${selected}&lt;/div&gt;&lt;div class=&quot;q-section&quot;&gt;空间&lt;/div&gt;${Object.entries(rooms).map(([name,r])=&gt;{const pending=r.status===&#x27;pending&#x27;&amp;&amp;r.deadline&gt;Date.now();return `&lt;div class=&quot;q-roomline&quot;&gt;&lt;button class=&quot;q-row&quot; data-space=&quot;${name}&quot; data-action=&quot;${peer?&#x27;peerselect&#x27;:&#x27;select&#x27;}&quot;&gt;&lt;span&gt;${name}&lt;small&gt;${peer?&#x27;已加入此空间&#x27;:r.status===&#x27;approved&#x27;?&#x27;此浏览器已授权&#x27;:pending?&#x27;等待对方授权&#x27;:r.status===&#x27;expired&#x27;?&#x27;授权请求已过期&#x27;:&#x27;此浏览器尚未授权&#x27;}&lt;/small&gt;&lt;/span&gt;${peer&amp;&amp;pending?&#x27;&#x27;:&#x27;&lt;em&gt;›&lt;/em&gt;&#x27;}&lt;/button&gt;${peer&amp;&amp;pending?`&lt;button class=&quot;q-review&quot; data-space=&quot;${name}&quot; data-action=&quot;review&quot;&gt;授权&lt;/button&gt;`:&#x27;&#x27;}&lt;/div&gt;`;}).join(&#x27;&#x27;)}${peer?&#x27;&#x27;:&#x27;&lt;p class=&quot;q-summary&quot;&gt;选择一个空间，按需向对方申请。未授权空间没有消息预览。&lt;/p&gt;&#x27;}&lt;div class=&quot;q-bottom&quot;&gt;&lt;button data-action=&quot;${peer?&#x27;peerhome&#x27;:&#x27;shell&#x27;}&quot;&gt;返回当前空间&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;}
const views={
welcome:()=&gt;intro(&#x27;在这里继续&#x27;,&#x27;使用通行密钥验证，再在其他在线设备完成授权。&#x27;,notice?`&lt;p class=&quot;q-error&quot; role=&quot;alert&quot;&gt;${notice}&lt;/p&gt;`:&#x27;&#x27;,btn(&#x27;使用通行密钥继续&#x27;,&#x27;auth&#x27;)),
wait:()=&gt;intro(&#x27;等待其他在线设备授权&#x27;,&#x27;请在其他已授权的在线设备上解锁并完成授权。&#x27;,`&lt;div class=&quot;q-code&quot;&gt;482 193&lt;/div&gt;${info(&#x27;此次只授权这个浏览器。&lt;br&gt;进入后，各个空间仍需由空间对方授权。&#x27;)}`,btn(&#x27;取消此次接入&#x27;,&#x27;cancelbrowser&#x27;,&#x27;text&#x27;)),
old:()=&gt;`${head(true)}&lt;div class=&quot;q-empty&quot;&gt;&lt;p&gt;自己的其他在线设备 · 当前选中 ${oldSelected}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;q-composer&quot;&gt;说点什么…&lt;/div&gt;`,
olddone:()=&gt;intro(&#x27;已认可新浏览器&#x27;,&#x27;新浏览器将自动进入聊天界面。&#x27;,info(&#x27;本次未授予任何空间的消息权限。&lt;br&gt;默认选中本浏览器当前空间：&#x27;+oldSelected),&#x27;&#x27;),
shell:shell,pending:shell,chat:shell,expired:shell,
drawer:()=&gt;drawer(false),peer:peerBackground,peerhome:peerBackground,peerexpired:peerBackground,peerlist:()=&gt;drawer(true),
peerdone:()=&gt;`${head(true)}&lt;div class=&quot;q-empty&quot;&gt;&lt;span class=&quot;q-chip&quot;&gt;已完成空间授权&lt;/span&gt;&lt;p&gt;新浏览器现在可以进入 ${selected} 聊天。&lt;br&gt;其他空间未获得授权。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;q-composer&quot;&gt;说点什么…&lt;/div&gt;`,
rejected:()=&gt;intro(&#x27;本次浏览器接入未获批准&#x27;,&#x27;新浏览器仍停留在入口，未获得空间权限。&#x27;,&#x27;&#x27;,btn(&#x27;返回入口&#x27;,&#x27;welcome&#x27;)),
limit:()=&gt;intro(&#x27;设备数量已满&#x27;,selected+&#x27; 中，对方已使用 3 个设备名额。&#x27;,info(&#x27;此次申请无法完成。应先在可信端移除不再使用的设备，再重新发起。&#x27;),btn(&#x27;关闭&#x27;,&#x27;dismiss&#x27;))
