adding:12px 26px 24px}#qr-access .q-brand{width:58px;height:58px;display:grid;place-items:center;border-radius:19px;background:var(--qas);color:var(--qa);font-size:27px;margin:26px 0 24px}#qr-access h2{font-size:28px;line-height:1.28;font-weight:600;letter-spacing:-.04em;margin:0 0 15px}#qr-access p{margin:0 0 18px;color:var(--qm);font-size:14px;line-height:1.75}#qr-access .q-actions{margin-top:auto;padding-top:28px;display:grid;gap:10px}#qr-access .q-button{border:0;border-radius:14px;background:var(--qas);color:var(--qa);padding:13px 14px;min-height:50px;width:100%;font-weight:500}#qr-access .q-button.primary{background:var(--qb);color:oklch(99.3% .004 250)}#qr-access .q-button.text{background:transparent;color:var(--qm)}#qr-access .q-button.danger{background:transparent;color:var(--qd)}#qr-access .q-row{width:100%;border:0;border-bottom:1px solid var(--ql);background:transparent;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:17px 0;min-height:64px}#qr-access .q-row span{display:block}#qr-access .q-row small{color:var(--qm);font-size:12px}#qr-access .q-row em{font-style:normal;color:var(--qa);font-size:12px;white-space:nowrap}#qr-access .q-section{font-size:12px;color:var(--qm);margin:24px 0 5px}#qr-access .q-info{padding:16px;background:var(--qs);border-radius:18px;margin:14px 0;font-size:13px;color:var(--qm)}#qr-access .q-code{font-size:34px;letter-spacing:.18em;color:var(--qi);text-align:center;padding:18px 0;font-variant-numeric:tabular-nums}#qr-access .q-chip{display:inline-block;padding:5px 10px;border-radius:20px;background:var(--qas);color:var(--qa);font-size:12px;margin-bottom:16px}#qr-access .q-sheet{margin:25px -26px -24px;padding:12px 26px 24px;border-radius:28px 28px 0 0;background:var(--qs);border:1px solid var(--ql);min-height:360px;display:flex;flex-direction:column}#qr-access .q-handle{height:4px;width:32px;border-radius:4px;background:var(--ql);margin:0 auto 23px}#qr-access .q-sheet h2{font-size:24px}#qr-access .q-drawer{background:var(--qs);border:1px solid var(--ql);border-radius:26px;padding:23px;margin:0 -13px;min-height:545px;display:flex;flex-direction:column}#qr-access .q-current{font-size:33px;letter-spacing:-.04em;margin:10px 0 32px;font-weight:600}#qr-access .q-bottom{margin-top:auto;display:flex;justify-content:space-between;gap:12px;padding-top:24px}#qr-access .q-bottom button{border:0;background:var(--qas);color:var(--qa);border-radius:24px;padding:10px 16px;min-height:44px}#qr-access .q-chat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;margin-bottom:35px}#qr-access .q-chat-head button{background:var(--qs);border:1px solid var(--ql);border-radius:24px;padding:10px;min-height:44px}#qr-access .q-presence{background:var(--qs);padding:8px 12px;border:1px solid var(--ql);border-radius:25px}#qr-access .q-empty{margin:auto;text-align:center;color:var(--qm)}#qr-access .q-composer{margin-top:auto;padding:14px 18px;border:1px solid var(--ql);border-radius:28px;background:var(--qs);color:var(--qm)}#qr-access .q-sim{margin-top:18px;padding-top:12px;border-top:1px solid var(--ql);display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--qm)}#qr-access .q-sim button{min-height:36px;border:0;background:transparent;color:var(--qa);text-decoration:underline;padding:6px}#qr-access .q-demo-field{background:var(--qp);padding:18px;border:1px solid var(--ql);border-radius:14px;overflow-wrap:anywhere;color:var(--qm)}#qr-access .q-summary{font-size:12px;color:var(--qm);margin:12px 0}#qr-access [hidden]{display:none!important}@media(max-width:560px){#qr-access .q-layout{grid-template-columns:1fr;gap:16px}#qr-access .q-rail{display:flex;flex-wrap:wrap;gap:4px}#qr-access .q-step{width:auto;font-size:12px;padding:6px;min-height:40px}#qr-access .q-arrow{display:none}#qr-access .q-note{width:100%;margin:5px 0}#qr-access .q-phone{max-width:393px;width:100%;margin:auto}#qr-access .q-head{align-items:start}#qr-access .q-tabs button{padding:8px 10px}#qr-access .q-screen{padding-left:22px;padding-right:22px}#qr-access .q-sheet{margin-left:-22px;margin-right:-22px;padding-left:22px;padding-right:22px}}
#qr-access .q-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;background:color-mix(in oklch,var(--qi) 24%,transparent);z-index:5;padding:12px;overflow:auto}#qr-access .q-pop{width:100%;border:1px solid var(--ql);border-radius:26px;background:var(--qs);padding:18px 22px 20px;box-shadow:0 10px 50px color-mix(in oklch,var(--qi) 15%,transparent)}#qr-access .q-pop h2{font-size:24px;margin-top:18px}#qr-access .q-pop .q-button{margin-top:8px}#qr-access .q-pop .q-code{padding:10px 0}#qr-access .q-error{color:var(--qd)}#qr-access .q-pop .q-info{background:var(--qp)}#qr-access .q-screen{min-height:587px}#qr-access .q-row span{min-width:0}#qr-access .q-row small{display:block}#qr-access .q-composer[aria-disabled=true]{opacity:.7}#qr-access .q-pop p{font-size:13px}#qr-access .q-pop .q-tag{display:block}#qr-access .q-phone:has(.q-overlay){min-height:690px}
#qr-access .q-requestbar{margin-top:auto;padding-top:20px}#qr-access .q-roomline{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ql)}#qr-access .q-roomline .q-row{flex:1;min-width:0;border-bottom:0}#qr-access .q-roomline .q-row span{overflow-wrap:anywhere}#qr-access .q-review{border:0;border-radius:20px;background:var(--qas);color:var(--qa);padding:10px 15px;min-height:44px;margin-top:0;flex:none;white-space:nowrap}#qr-access .q-timer{font-variant-numeric:tabular-nums;color:var(--qa);font-weight:600}#qr-access button:disabled{opacity:.45;cursor:not-allowed}#qr-access .q-pop .q-button{min-height:44px}#qr-access .q-pop{padding:16px 20px}#qr-access .q-pop h2{font-size:22px}#qr-access .q-pop .q-info{margin:10px 0}#qr-access .q-pop p{margin-bottom:10px}#qr-access .q-pop .q-handle{margin-bottom:14px}
</style>
<div id="qr-access">
 <div class="q-head"><strong>多浏览器接入 · 交互图</strong><span class="q-tag">S5 · 可点击演示</span></div>
 <nav class="q-tabs" aria-label="交互场景"></nav>
 <div class="q-layout"><nav class="q-rail" aria-label="流程节点"></nav><div><div class="q-phone"><div class="q-top"><button class="q-back" data-action="back">‹ 返回</button><span id="q-device">新浏览器</span><span>Quiet Room</span></div><div class="q-screen" aria-live="polite"></div></div><div class="q-sim" aria-label="演示条件"></div></div></div>
</div>
<script>
(()=>{
const root=document.getElementById('qr-access');
const btn=(t,a,k='primary')=>`<button class="q-button ${k} cursor-interaction" data-action="${a}">${t}</button>`;
const info=t=>`<div class="q-info">${t}</div>`;
const intro=(t,p,b,a)=>`<div class="q-brand" aria-hidden="true">↗</div><h2>${t}</h2><p>${p}</p>${b||''}<div class="q-actions">${a||''}</div>`;
let scenario='browser',screen='welcome',modal=null,authFor='browser',browserOK=false,browserRequest=false,oldSelected='晚风',selected='晚风',notice='',serial=0;
let rooms={'晚风':{status:'none',deadline:0,id:0},'周末计划':{status:'none',deadline:0,id:0}};
const scenarios={browser:{name:'浏览器授权',steps:[['welcome','点击继续'],['auth','系统验证'],['wait','等待其他在线设备'],['old','其他设备授权弹窗'],['shell','进入未授权聊天页']],note:'旧端只认可新浏览器，不授予任何空间权限。新端默认选中旧端当前空间；不显示消息，不允许输入。'},space:{name:'空间对方授权',steps:[['shell','点击底部申请'],['spaceauth','系统验证'],['pending','推送请求 · 10 分钟'],['peer','对方自动弹窗'],['chat','批准后开放聊天']],note:'每个空间由空间对方授权。验证成功才发送请求；正式计时以服务端确认创建时刻为准。'},reopen:{name:'关闭、重开与过期',steps:[['peer','对方收到弹窗'],['peerhome','关闭但保留请求'],['peerlist','列表入口重新打开'],['reopen','同一请求剩余时间'],['peerexpired','到期后自动消失']],note:'关闭不等于拒绝，重新打开不会重置倒计时。到期后对方弹窗与列表入口自动消失；申请方可重新验证后申请。'}};
const room=()=>rooms[selected];
const active=()=>room().status==='pending'&&room().deadline>Date.now();
const remaining=()=>{let n=Math.max(0,Math.ceil((room().deadline-Date.now())/1000));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;};
const timer=()=>`<span class="q-timer" data-countdown>${remaining()}</span>`;
const head=(peer=false)=>`<div class="q-chat-head"><button data-action="${peer?'peerlist':'drawer'}">☰ ${selected}</button>${peer||room().status==='approved'?'<span class="q-presence">TA · 在线 · 我</span>':'<span class="q-tag">此浏览器待授权</span>'}</div>`;
function shell(){
const r=room();let title='此空间尚未授权',copy='请向空间对方申请授权，<br>通过后即可在此浏览器聊天。',action=btn('申请对方授权','spaceauth');
if(r.status==='pending'){title='等待对方授权';copy=`请求已发送，剩余 ${timer()}<br>对方进入并解锁此空间后会看到弹窗。`;action=btn('等待对方授权 · '+remaining(),'noop','text')+btn('取消此次申请','cancelspace','text');}
if(r.status==='expired'){title='授权请求已过期';copy='10 分钟内未完成授权。<br>重新申请需要再次验证通行密钥。';action=btn('重新申请对方授权','spaceauth');}
if(r.status==='rejected'){title='对方未同意此次申请';copy='此浏览器仍无法读取或发送消息。';action=btn('重新申请对方授权','spaceauth');}
if(r.status==='approved')return `${head()}<div class="q-empty"><span class="q-chip">此空间已授权</span><p>可以开始聊天了。<br>仅接收加入后的消息，原浏览器仍可用。</p></div><div class="q-composer" role="textbox" aria-label="消息输入区域，演示不可发送">说点什么… <span style="float:right">＋</span></div>`;
return `${head()}<div class="q-empty"><h2>${title}</h2><p>${copy}</p>${notice?`<p class="q-error" role="status">${notice}</p>`:''}</div><div class="q-requestbar">${action}</div>`;
}
const peerBackground=()=>`${head(true)}<div class="q-empty"><p>空间对方 · 已解锁 ${selected}</p></div><div class="q-composer">说点什么…</div>`;
function drawer(peer=false){return `<div class="q-drawer"><div class="q-section">${peer?'空间对方的空间列表':'我的空间列表'}</div><div class="q-current">${selected}</div><div class="q-section">空间</div>${Object.entries(rooms).map(([name,r])=>{const pending=r.status==='pending'&&r.deadline>Date.now();return `<div class="q-roomline"><button class="q-row" data-space="${name}" data-action="${peer?'peerselect':'select'}"><span>${name}<small>${peer?'已加入此空间':r.status==='approved'?'此浏览器已授权':pending?'等待对方授权':r.status==='expired'?'授权请求已过期':'此浏览器尚未授权'}</small></span>${peer&&pending?'':'<em>›</em>'}</button>${peer&&pending?`<button class="q-review" data-space="${name}" data-action="review">授权</button>`:''}</div>`;}).join('')}${peer?'':'<p class="q-summary">选择一个空间，按需向对方申请。未授权空间没有消息预览。</p>'}<div class="q-bottom"><button data-action="${peer?'peerhome':'shell'}">返回当前空间</button></div></div>`;}
const views={
welcome:()=>intro('在这里继续','使用通行密钥验证，再在其他在线设备完成授权。',notice?`<p class="q-error" role="alert">${notice}</p>`:'',btn('使用通行密钥继续','auth')),
wait:()=>intro('等待其他在线设备授权','请在其他已授权的在线设备上解锁并完成授权。',`<div class="q-code">482 193</div>${info('此次只授权这个浏览器。<br>进入后，各个空间仍需由空间对方授权。')}`,btn('取消此次接入','cancelbrowser','text')),
old:()=>`${head(true)}<div class="q-empty"><p>自己的其他在线设备 · 当前选中 ${oldSelected}</p></div><div class="q-composer">说点什么…</div>`,
olddone:()=>intro('已认可新浏览器','新浏览器将自动进入聊天界面。',info('本次未授予任何空间的消息权限。<br>默认选中本浏览器当前空间：'+oldSelected),''),
shell:shell,pending:shell,chat:shell,expired:shell,
drawer:()=>drawer(false),peer:peerBackground,peerhome:peerBackground,peerexpired:peerBackground,peerlist:()=>drawer(true),
peerdone:()=>`${head(true)}<div class="q-empty"><span class="q-chip">已完成空间授权</span><p>新浏览器现在可以进入 ${selected} 聊天。<br>其他空间未获得授权。</p></div><div class="q-composer">说点什么…</div>`,
rejected:()=>intro('本次浏览器接入未获批准','新浏览器仍停留在入口，未获得空间权限。','',btn('返回入口','welcome')),
limit:()=>intro('设备数量已满',selected+' 中，对方已使用 3 个设备名额。',info('此次申请无法完成。应先在可信端移除不再使用的设备，再重新发起。'),btn('关闭','dismiss'))
};
function dialog(){
if(modal==='auth')return `<span class="q-tag">系统通行密钥 · 演示</span><h2 id="q-dialog-title">${authFor==='space'?'验证并发送申请':'验证访问密钥'}</h2><p>${authFor==='space'?'验证成功后，向 '+selected+' 的空间对方发送授权请求。':'系统弹窗直接覆盖原页。'}</p>${btn('模拟系统验证成功','verified')}${btn('取消','cancelverify','text')}`;
if(modal==='old')return `<span class="q-tag">自己的其他在线设备 · 自动弹窗</span><h2 id="q-dialog-title">允许这个浏览器继续？</h2><p>请确认是你发起的请求，并核对两端短码一致。</p><div class="q-code">482 193</div>${info('仅认可新浏览器身份。<br>不会授权任何空间，也不会同步聊天历史。')}${btn('核对一致，允许继续','approvebrowser')}${btn('拒绝','rejectbrowser','danger')}`;
if(modal==='peer')return `<span class="q-tag">空间对方 · 自动收到的请求</span><h2 id="q-dialog-title">允许对方的新浏览器加入？</h2><p>目标空间：${selected}<br>申请方：空间中的另一位参与者<br>新浏览器 · 本次请求 #${room().id}</p>${active()?info('剩余 '+timer()+'<br>只授权此空间，新浏览器仅接收加入后的消息。<br>原有设备继续可用。'):info('此请求已失效，不能继续授权。<br>请让申请方重新发起。')}<button class="q-button primary" data-action="approvespace" ${active()?'':'disabled'}>允许加入此空间</button>${active()?btn('拒绝此次申请','rejectspace','danger'):''}${btn('关闭，稍后处理','dismiss','text')}`;
return '';
}
function extras(){if(modal==='auth')return [['模拟验证失败','verifyfail']];if(screen==='wait')return [['模拟其他已授权设备打开并解锁','old']];if(screen==='olddone')return [['查看新浏览器自动进入界面','newbrowser']];if(['shell','pending','expired'].includes(screen)&&room().status==='pending')return [['模拟空间对方进入并解锁','peer'],['模拟 10 分钟到期','expire']];if(['peer','peerhome','peerlist'].includes(screen)&&room().status==='pending')return [['模拟 10 分钟到期','expire'],['设备名额已满','limit']];if(['peerhome','peerlist','peerexpired'].includes(screen)&&room().status==='expired')return [['查看申请方的重新申请入口','expired']];if(screen==='peerdone')return [['查看新浏览器自动开放聊天','newchat']];return [];}
function cleanExpiredPeer(){if(modal==='peer'&&!active()){modal=null;if(screen==='peer')screen='peerhome';}}
function render(){cleanExpiredPeer();
const cfg=scenarios[scenario];root.querySelector('.q-tag').textContent='S5 · 可点击演示';
root.querySelector('.q-tabs').innerHTML=Object.entries(scenarios).map(([k,v])=>`<button data-scenario="${k}" aria-pressed="${scenario===k}">${v.name}</button>`).join('');
const chosen=modal==='auth'?(authFor==='space'?'spaceauth':'auth'):screen;
root.querySelector('.q-rail').innerHTML=cfg.steps.map(([id,label],i)=>`${i?'<div class="q-arrow">↓</div>':''}<button class="q-step" data-preview="${id}" aria-current="${chosen===id?'step':'false'}"><span class="q-number">${i+1}</span>${label}</button>`).join('')+`<div class="q-note">${cfg.note}</div>`;
root.querySelector('.q-screen').innerHTML=(views[screen]||views.shell)();root.querySelector('#q-device').textContent=screen.startsWith('peer')?'空间对方':screen.startsWith('old')?'自己的其他在线设备':'自己的新浏览器';
root.querySelector('.q-overlay')?.remove();root.querySelector('.q-screen').inert=!!modal;root.querySelector('.q-top').inert=!!modal;
if(modal){const o=document.createElement('div');o.className='q-overlay';o.innerHTML=`<section class="q-pop" role="dialog" aria-modal="true" aria-labelledby="q-dialog-title"><div class="q-handle"></div>${dialog()}</section>`;root.querySelector('.q-phone').append(o);o.querySelector('button:not(:disabled)')?.focus({preventScroll:true});}
root.querySelector('.q-sim').innerHTML='<span>演示控制：</span>'+extras().map(([t,a])=>`<button data-action="${a}">${t}</button>`).join('')+(extras().length?'':'<span>可点击流程节点查看画面</span>');
}
function save(){window.openai?.setWidgetState?.({modelContent:{version:'S5',scenario,screen,modal,authFor,browserOK,browserRequest,oldSelected,selected,rooms,serial},privateContent:null}).catch(()=>{});}
function createRequest(){rooms[selected]={status:'pending',deadline:Date.now()+600000,id:++serial};}
function preview(id){notice='';modal=null;if(id==='auth'){screen='welcome';modal='auth';authFor='browser';}else if(id==='spaceauth'){screen='shell';browserOK=true;rooms[selected].status='none';modal='auth';authFor='space';}else if(id==='old'){browserRequest=true;screen='old';modal='old';}else if(id==='peer'||id==='reopen'){browserOK=true;if(!active())createRequest();screen='peer';modal='peer';}else{screen=id;if(id==='shell'){browserOK=true;rooms[selected].status='none';}if(['pending','peerhome','peerlist'].includes(id)&&!active())createRequest();if(id==='chat')room().status='approved';if(id==='expired'||id==='peerexpired'){room().status='expired';room().deadline=Date.now()-1;}}render();save();}
function act(a){
notice='';
if(a==='auth'||a==='spaceauth'){authFor=a==='auth'?'browser':'space';modal='auth';}
else if(a==='verified'){modal=null;if(authFor==='browser'){browserRequest=true;screen='wait';}else{createRequest();scenario='space';screen='pending';}}
else if(a==='cancelverify'||a==='verifyfail'){modal=null;notice=a==='cancelverify'?'已取消验证，未发送请求。':'验证失败，未发送请求。';screen=authFor==='browser'?'welcome':'shell';}
else if(a==='old'){if(browserRequest){screen='old';modal='old';}}
else if(a==='approvebrowser'){if(browserRequest){browserRequest=false;browserOK=true;selected=oldSelected;screen='olddone';}modal=null;}
else if(a==='rejectbrowser'||a==='cancelbrowser'){browserRequest=false;modal=null;screen=a==='rejectbrowser'?'rejected':'welcome';}
else if(a==='newbrowser'){screen='shell';scenario='space';}
else if(a==='peer'){screen='peer';modal=active()?'peer':null;}
else if(a==='dismiss'){modal=null;screen='peerhome';}
else if(a==='approvespace'){if(active()){room().status='approved';modal=null;screen='peerdone';}else{room().status='expired';modal=null;screen='peerhome';}}
else if(a==='rejectspace'){room().status='rejected';modal=null;screen='peerhome';}
else if(a==='cancelspace'){room().status='none';screen='shell';}
else if(a==='review'){screen=active()?'peer':'peerhome';modal=active()?'peer':null;}
else if(a==='select'){screen='shell';scenario='space';}
else if(a==='peerselect'){screen='peerhome';}
else if(a==='newchat'){screen='chat';scenario='space';}
else if(a==='expire'){room().deadline=Date.now()-1;room().status='expired';if(!screen.startsWith('peer'))screen='expired';else if(screen==='peer'){screen='peerhome';modal=null;}}
else if(a==='limit'){modal=null;room().status='rejected';screen='limit';}
else if(a==='back'){if(modal==='auth'){act('cancelverify');return;}if(modal==='peer'){modal=null;screen='peerhome';}else{modal=null;screen=browserOK?'drawer':'welcome';}}
else if(a==='noop')return;
else if(views[a])screen=a;
render();save();
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.space)selected=b.dataset.space;if(b.dataset.scenario){scenario=b.dataset.scenario;modal=null;notice='';selected=oldSelected;rooms={'晚风':{status:'none',deadline:0,id:0},'周末计划':{status:'none',deadline:0,id:0}};browserOK=scenario!=='browser';browserRequest=false;if(scenario==='browser')screen='welcome';else if(scenario==='space')screen='shell';else{createRequest();screen='peer';modal='peer';}render();save();}else if(b.dataset.preview)preview(b.dataset.preview);else if(b.dataset.action)act(b.dataset.action);});
root.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape'){e.preventDefault();act(modal==='auth'?'cancelverify':modal==='peer'?'dismiss':'back');}if(e.key==='Tab'){const b=[...root.querySelectorAll('.q-pop button:not(:disabled)')];if(e.shiftKey&&document.activeElement===b[0]){b.at(-1).focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===b.at(-1)){b[0].focus();e.preventDefault();}}});
function tick(){let expired=false;Object.values(rooms).forEach(r=>{if(r.status==='pending'&&r.deadline<=Date.now()){r.status='expired';expired=true;}});if(expired){render();save();}else {root.querySelectorAll('[data-countdown]').forEach(x=>x.textContent=remaining());const wait=root.querySelector('[data-action="noop"]');if(wait)wait.textContent='等待对方授权 · '+remaining();}}
function restore(state){const s=state?.modelContent;if(s?.version==='S5'&&scenarios[s.scenario]&&views[s.screen]){scenario=s.scenario;screen=s.screen;modal=['auth','old','peer'].includes(s.modal)?s.modal:null;authFor=s.authFor==='space'?'space':'browser';browserOK=!!s.browserOK;browserRequest=!!s.browserRequest;oldSelected=s.oldSelected==='周末计划'?'周末计划':'晚风';selected=s.selected==='周末计划'?'周末计划':'晚风';serial=Number.isFinite(s.serial)?s.serial:0;for(const name of Object.keys(rooms)){const r=s.rooms?.[name];if(r&&['none','pending','approved','rejected','expired'].includes(r.status))rooms[name]={status:r.status,deadline:Number(r.deadline)||0,id:Number(r.id)||0};}}render();tick();}
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));const interval=setInterval(()=>{if(!root.isConnected){clearInterval(interval);return;}tick();},1000);
})();
</script>
