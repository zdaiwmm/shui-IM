;border-radius:18px 18px 0 0;padding:0 20px max(16px,env(safe-area-inset-bottom));animation:up .24s ease-out}.handle{height:44px;min-height:44px;width:100%;touch-action:none}.handle:after{content:"";display:block;width:32px;height:4px;background:var(--muted);opacity:.5;border-radius:4px;margin:auto}.heading,.foot,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.heading h2,.pagehead h2{margin:0;font-size:20px;letter-spacing:-.035em}.textbtn{color:var(--muted);font-size:13px;min-height:44px;display:inline-flex;align-items:center;gap:4px}.scroll{overflow:auto;flex:1;min-height:0;padding:4px 1px}.field{display:flex;gap:6px;background:var(--surface);padding:4px 6px 4px 10px;border-radius:10px;align-items:center}.field input{min-width:0;width:100%;background:none;border:0;font-size:14px;height:36px}.field button{font-size:13px;font-weight:600;color:var(--act);min-height:44px;min-width:44px}.sub,.feedback{color:var(--muted);font-size:12px;margin:8px 0}.feedback{font-size:14px}.choice{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);border-radius:12px;margin:5px 0}.chosen{border-color:var(--act);background:var(--soft)}.scene{display:inline-block;position:relative;overflow:hidden;background:linear-gradient(160deg,#c5cdb3,#9da988 53%,#516f68);width:75px;height:43px;border-radius:7px;flex:none;isolation:isolate}.scene:before,.scene:after{position:absolute;content:"";inset:20% -5% -20%;background:#799184;clip-path:polygon(0 78%,28% 14%,52% 65%,70% 25%,100% 72%,100% 100%,0 100%)}.scene:after{background:#3b5c53;inset:47% -5% -10%;transform:scaleX(-1)}.scene.b{filter:hue-rotate(38deg)}.choice b{font-size:14px}.choice small{display:block;color:var(--muted);font-size:11px}.mark{margin-left:auto;margin-right:4px;color:var(--act)}.foot{padding-top:7px}.btn{min-height:44px;border-radius:12px;background:var(--surface);padding:8px 13px;font-weight:600;font-size:14px}.foot .btn{flex:1}.primary{backgroun <body><main class="wide"><header class="mast"><span class="word">Chamber</span><span class="tag">PRODUCT STUDY / 01</span><a href="flow.html">查看业务流程图 ↗</a></header><div class="layout"><aside class="editor"><span class="kicker">CHAMBER &nbsp; / &nbsp; 交互评审 V1</span><h1>链接视频</h1><p class="lead">从 X 保存一段视频到本机，或在保存后分享给对方。</p><div class="settings"><label>当前身份<select data-role aria-label="评审身份"></select></label><label>演示情形<select data-case aria-label="演示情形"></select></label><div class="testBtns"><button data-act="entry">从工具栏开始</button><button data-act="theme">切换明暗</button><button data-act="reset">重置演示</button></div></div><p class="guide">当前为离线演示。切换身份，相当于切换到另一位参与者的设备。所有样例仅保留在本次页面内。</p></aside><div><nav class="mobileCtl"><span>演示</span><select data-role aria-label="身份"></select><select data-case aria-label="情形"></select><button data-act="entry" aria-label="从工具栏开始">入口</button><a href="flow.html">流程 ↗</a></nav><section class="device" aria-label="Chamber 体验区" id="device"></section></div></div></main>
<script>
const glyph={link:'<path d="m10 13 4-4m-6 6-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 3 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 -1)"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>',plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8m-4-4h8"/>',back:'<path d="m15 5-7 7 7 7"/>',album:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m4 17 5-6 4 4 3-3 4 5"/><circle cx="8" cy="8" r="1"/>',check:'<path d="m4 12 5 5L20 6"/>',video:'<rect x="2" y="6" width="13" height="12" rx="2"/><path d="m15 10 6-4v12l-6-4"/>',folder:'<path d="M3 6h6l2 2h10v11H3z"/>',star:'<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6-4.4-4.3 6.1-.9z"/>',phone:'<path d="M5 3h4l1 5-3 2c2 4 3 5 7 7l2-3 5 1v4c-1 5-9 0-13-4S1 4 5 3z"/>',camera:'<path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/>',circle:'<circle cx="12" cy="12" r="8"/>',send:'<path d="m3 10 18-7-7 18-3-8zM11 13 21 3"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>'};
const icon=k=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+glyph[k]+'</svg>';
const cases={normal:'正常 · 两段视频',large:'设备不支持大视频',empty:'帖子无视频',blocked:'直连失败',sendfail:'发送失败'};
const roles={creator:'创建者',guest:'受邀方'};
const sample='https://x.com/demo/status/10001';
let role='creator',scenario='normal',page='chat',sheet=true,tools=false,phase='ready',url=sample,post='10001',pick=0,notice='',tick,seq=0,detail=null,revealed=new Set(),gallery='',retryOk=false;
let libraries={creator:[],guest:[]},messages=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clips=()=>scenario==='large'?[{name:'山间长镜头',mb:617.2,dur:'25:10'}]:[{name:'山脊的晨光',mb:18.4,dur:'0:42'},{name:'湖面与雾',mb:32.8,dur:'1:16'}];
const current=()=>({...clips()[pick],key:post+'/'+pick+'/'+(scenario==='large'?'large':'regular'),n:pick});
const btn=(a,t,primary=false)=>'<button class="btn '+(primary?'primary':'')+'" data-act="'+a+'">'+t+'</button>';
const priv=c=>!messages.some(m=>m.from===role&&m.key===c.key);
const scene=c=>'<span aria-hidden="true" class="scene '+(c.n?'b':'')+'"></span>';
const busy=()=>['reading','downloading','packing','sending'].includes(phase);
function stop(){clearTimeout(tick);seq++}
function later(fn,ms=850){const id=seq;tick=setTimeout(()=>{if(id===seq)fn()},ms)}
function sync(){document.querySelectorAll('[data-role]').forEach(e=>{e.innerHTML=Object.entries(roles).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');e.value=role});document.querySelectorAll('[data-case]').forEach(e=>{e.innerHTML=Object.entries(cases).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');e.value=scenario})}
function toolsPanel(){return '<div class="tools">'+[['album','图片'],['camera','拍摄'],['video','视频通话'],['phone','实时语音'],['folder','文件'],['star','收藏'],['link','链接视频']].map(([i,t])=>'<button class="tool" '+(t==='链接视频'?'data-act="open"':t==='收藏'?'data-act="favorites"':'disabled')+'>'+icon(i)+t+'</button>').join('')+'</div>'}
function draw(){
const chat='<header class="chathead"><span class="ib">'+icon('menu')+'</span>'+(role==='creator'?'<button class="presence" data-act="safe" aria-label="打开保险箱">':'<span class="presence">')+'<i class="dot"></i>双方在线'+(role==='creator'?'</button>':'</span>')+'<span class="ib"></span></header><div class="chatlog"><small>今天 09:41</small><div class="bubble">上次徒步的视频还在吗？</div><div class="bubble mine">找到了，我来挑一段。</div>'+messages.map(m=>'<div class="bubble media blur '+(m.from===role?'mine':'')+'" aria-label="聊天视频 '+esc(m.name)+'">'+scene(m)+'<span class="runtime">▷ '+m.dur+'</span></div>').join('')+'</div><div class="bar"><button class="ib" data-act="tools" aria-label="更多功能">'+icon('plus')+'</button><div class="fakeInput">输入消息</div><span class="ib">'+icon('send')+'</span></div>'+(tools?toolsPanel():'');
const d=document.querySelector('#device');d.innerHTML='<div style="display:contents" '+(sheet||page!=='chat'?'inert':'')+'>'+chat+'</div>'+(page==='gallery'?galleryHTML():'')+(sheet?sheetHTML():'');
}
function sheetHTML(){
let body='',foot='',heading='链接视频',access='<button class="textbtn" data-act="downloads">我的下载 ›</button>';
if(['input','ready','bad','empty'].includes(phase)){
body='<div class="field">'+icon('link')+'<input aria-label="X 帖子链接" type="url" placeholder="粘贴 X 帖子链接" value="'+esc(url)+'"><button data-act="parse">识别</button></div>';
if(phase==='ready')body+='<div class="sub">已识别 '+clips().length+' 段视频 · 选择一段</div>'+clips().map((c,i)=>'<button class="choice '+(pick===i?'chosen':'')+'" data-act="pick" data-n="'+i+'" aria-pressed="'+(pick===i)+'">'+scene({n:i})+'<span><b>'+c.name+'</b><small>'+c.dur+' · '+c.mb+' MB</small></span><span class="mark">'+icon(pick===i?'check':'circle')+'</span></button>').join('');
else body+='<p class="sub '+(notice?'err':'')+'">'+esc(notice||'支持公开 X 帖子。')+'</p><button class="textbtn" data-act="example">试用示例链接 ↗</button>';
if(phase==='ready')foot=btn('local','仅下载')+btn('share','下载并发送',true);
}else if(busy()){access='';const labels={reading:'正在识别帖子',downloading:'正在直下本机',packing:'正在本地无损压缩',sending:'正在加密发送'};body='<div class="result" role="status"><b>'+labels[phase]+'</b><p class="feedback">'+({reading:'读取帖子中的视频信息。',downloading:'视频数据从 X 直接传到当前设备。',packing:'保留原始音视频数据；体积未缩小时使用原件。',sending:'仅加密附件进入聊天发送通道。'}[phase])+'</p><div class="track"><i></i></div></div>';foot=btn('close','取消')}
else {const states={local:['已存到我的下载',priv(current())?'仅当前设备可见，未发送到聊天。':'这段视频已分享过，本次未重复发送。'],shared:['已发送到聊天','对方可以在这条聊天消息中查看视频。'],oversize:['已保存，设备需更新','视频超过 256 MiB，需要所有设备支持大视频才能分享。已保留在本机，更新后可重试。'],senderror:['发送失败','视频已存本机，可以直接重试发送。'],neterror:['无法直连视频','请检查网络后重试。视频不会由 Chamber 服务器中转。']};
const [title,desc]=states[phase];body='<div class="result" role="status"><b>'+title+'</b><p class="feedback">'+desc+'</p></div>';foot=phase==='shared'?btn('close','回到聊天',true):phase==='local'||phase==='oversize'?btn('downloads','查看我的下载',true):phase==='senderror'?btn('downloads','仅保留在本机')+btn('retrySend','重试发送',true):btn('again','重新识别')+btn('retryNet','重试下载',true)}
return '<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+heading+'"><button class="handle" data-act="close" aria-label="收起半屏"></button><div class="heading"><h2>'+heading+'</h2>'+access+'</div><div class="scroll">'+body+'</div><div class="foot">'+foot+'</div></section></div>'}
function list(){if(gallery==='favorites')return [];const mine=libraries[role];if(gallery!=='safe')return mine;return [...mine,...messages.filter(m=>!mine.some(c=>c.key===m.key&&m.from===role))]}
function galleryHTML(){const title=gallery==='safe'?'保险箱 · 相册':gallery==='favorites'?'收藏 · 相册':'我的下载';const arr=list();return '<section class="gallery"><header class="pagehead"><button class="ib" data-act="back" aria-label="返回">'+icon('back')+'</button><h2>'+title+'</h2><span class="ib"></span></header>'+(detail?'<div class="pagebody">'+scene(detail)+'<h2>'+esc(detail.name)+'</h2><p>'+detail.dur+' · '+detail.mb+' MB</p><p class="note">'+(detail.private?icon('lock')+' 仅自己可见 · 本设备':'聊天已共享')+'</p>'+btn('detailBack','返回相册')+'</div>':arr.length?'<div class="grid">'+arr.map((c,i)=>{const locked=libraries[role].includes(c)&&priv(c);return '<button class="tile '+(revealed.has(i)?'':'blur')+'" data-act="tile" data-n="'+i+'" aria-label="'+esc(c.name)+(locked?'，仅自己可见 · 本设备':'，已共享')+'">'+scene(c)+(locked?'<span class="badge" title="仅自己可见 · 本设备">'+icon('lock')+'</span>':'')+'<span class="runtime">▷ '+c.dur+'</span></button>'}).join('')+'</div><p class="sub" style="margin:0 16px">轻点显露，再次轻点查看详情。</p>':'<div class="empty">'+icon(gallery==='favorites'?'star':'folder')+'<p>'+ (gallery==='favorites'?'尚未收藏媒体':'这里还没有视频')+'</p></div>')+'</section>'}
let intent='local',fromSheet=false;
function openGallery(g,from){gallery=g;fromSheet=from;revealed.clear();detail=null;page='gallery';sheet=false;tools=false;draw()}
function recognize(){stop();retryOk=false;let u;try{u=new URL(url)}catch{}const m=u&&/^\/(?:[a-z0-9_]+|i\/web)\/status\/(\d+)(?:\/(?:video|photo)\/\d+)?\/?$/i.exec(u.pathname);if(!m||!['x.com','www.x.com','twitter.com','mobile.twitter.com'].includes(u.hostname)||!['https:','http:'].includes(u.protocol)){phase='bad';notice='请输入有效的 X 帖子链接。';draw();return}post=m[1];pick=0;phase='reading';draw();later(()=>{phase=scenario==='empty'?'empty':'ready';notice=phase==='empty'?'这个帖子没有可下载的视频。':'';draw()},440)}
function persistClip(){const c=current();if(!libraries[role].some(x=>x.key===c.key))libraries[role].unshift(c)}
function send(){phase='packing';draw();later(()=>{if(scenario==='large'){phase='oversize';draw();return}phase='sending';draw();later(()=>{if(scenario==='sendfail'&&!retryOk){phase='senderror'}else{const c=current();if(!messages.some(x=>x.key===c.key&&x.from===role))messages.push({...c,from:role});phase='shared'}draw()})})}
function download(which){intent=which;stop();if(libraries[role].some(c=>c.key===current().key)){if(which==='share')send();else{phase='local';draw()}return}phase='downloading';draw();later(()=>{if(scenario==='blocked'&&!retryOk){phase='neterror';draw();return}persistClip();if(intent==='share')send();else{phase='local';draw()}})}
function fresh(open=false){stop();sheet=open;phase='input';url='';notice='';tools=false;page='chat';pick=0;retryOk=false;detail=null;draw()}
function act(a,n){switch(a){
case 'entry':fresh();tools=true;break;case 'tools':tools=!tools;break;case 'open':fresh(true);break;case 'theme':document.body.classList.toggle('dark');return;
case 'reset':libraries={creator:[],guest:[]};messages=[];scenario='normal';role='creator';sync();fresh(true);break;
case 'close':fresh();break;case 'example':url=sample.replace('10001',String(10001+Object.keys(cases).indexOf(scenario)));recognize();return;case 'parse':recognize();return;case 'again':fresh(true);return;case 'pick':pick=n;break;
case 'local':case 'share':download(a);return;case 'retryNet':retryOk=true;download(intent);return;case 'retrySend':retryOk=true;send();return;
case 'downloads':openGallery('downloads',true);return;case 'safe':if(role==='creator')openGallery('safe',false);return;case 'favorites':openGallery('favorites',false);return;
case 'back':page='chat';if(fromSheet){sheet=true;phase='input';url='';notice=''}else sheet=false;break;case 'tile':if(!revealed.has(n)){revealed.add(n)}else{const c=list()[n];detail={...c,private:libraries[role].includes(c)&&priv(c)}}break;
case 'detailBack':detail=null;break}draw()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,Number(t.dataset.n));else if(e.target.classList.contains('overlay'))act('close')});
document.addEventListener('change',e=>{if(e.target.matches('[data-role]')){role=e.target.value;sync();fresh(true)}if(e.target.matches('[data-case]')){scenario=e.target.value;sync();fresh(true);url=sample.replace('10001',String(10001+Object.keys(cases).indexOf(scenario)));recognize()}});
document.addEventListener('input',e=>{if(e.target.matches('input')){url=e.target.value;if(phase!=='input'){phase='input';notice='';draw();document.querySelector('.field input')?.focus()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sheet)act('close');else if(page==='gallery')act('back')}if(e.key==='Enter'&&e.target.matches('.field input'))recognize();if(e.key==='Tab'&&sheet){const f=[...document.querySelectorAll('.sheet button:not([disabled]),.sheet input')];if(!f.length)return;if(e.shiftKey&&e.target===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&e.target===f.at(-1)){e.preventDefault();f[0].focus()}}});
let dragY;document.addEventListener('pointerdown',e=>{if(e.target.closest('.handle')){dragY=e.clientY;e.target.setPointerCapture(e.pointerId)}});document.addEventListener('pointerup',e=>{if(dragY!=null&&e.clientY-dragY>40)act('close');dragY=null});
if(matchMedia('(prefers-color-scheme: dark)').matches)document.body.classList.add('dark');sync();draw();
</script></body></html>
