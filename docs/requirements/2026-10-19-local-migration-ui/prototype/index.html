 if(p.phase===4&&both)actions=`<div class="safety"><h2>${t('ready')}</h2><p>${t('safetyDesc')}</p><strong aria-label="6 8 3 2 4 1">683 241</strong></div><label class="confirm-match"><input id="safety-match" type="checkbox" ${p.matched?'checked':''} ${p.approved?'disabled':''}>${t('match')}</label><button id="migration-confirm" class="primary" ${!p.matched||p.approved?'disabled':''}>${t(p.approved?'confirmPending':'confirm')}</button>`;
 const historyRequest=other.phase===3&&!other.authorized&&!other.paused?`<div class="preserved"><h3>${t('historyPending')}</h3><p>${t('authHistoryDesc')}</p>${button('history-authorize','giveHistory','link')}</div>`:'';
 $('#phone').innerHTML=`<header class="app-header"><strong>Chamber</strong><button class="icon" id="migration-lock" aria-label="${t('lock')}">${icon('lock')}</button></header><main class="app-body migration-body"><div><h1>${t('mTitle')}</h1><p>${t('mDesc')}</p></div><span class="room-name">${t('mRoom')}</span><ol class="phase-list">${['identity','backup','restore','joint'].map((key,i)=>{const done=i===3?p.approved:progressDone(p,i+1);return `<li data-done="${done}"><b>${done?'✓':i+1}</b><span><strong>${t(key)}</strong><small>${t(key+'Hint')}</small></span><span class="phase-state">${t(done?'checked':p.phase===i+1?'running':'pending')}</span></li>`}).join('')}</ol>${preserved()}${historyRequest}<div class="migration-actions">${extra&&p.phase<4?`<p class="muted">${t('newPending')}</p>`:''}${actions}</div></main><footer class="app-footer">${button('migration-back','back')}</footer>`;
}
function preserved(){const count=lang==='zh'?`${128+extra} 条消息 · 6 个附件`:`${128+extra} messages · 6 attachments`;return `<section class="preserved"><h3>${t('preserveTitle')}</h3><p>${count}</p>${role==='a'?`<p>${t('safeCounts')}</p>`:''}<p>${t('preserveDesc')}</p></section>`}
function startMigration(){modal='auth';render()}
function advance(which){const p=participants[which];if(p.paused||p.phase===4||complete)return;clearTimeout(animation);p.phase=Math.max(1,p.phase);render();animation=setTimeout(()=>{if(p.paused||complete)return;if(fault!=='none'){p.paused=true;p.fault=fault;render();return}if(p.phase<3){p.phase++;advance(which)}else if(p.authorized){p.phase=4;render()}else render()},750)}
function switchRole(next){role=next;modal=null;render()}
function reset(){clearTimeout(animation);clearTimeout(transient);for(const p of Object.values(participants))Object.assign(p,{phase:0,paused:false,fault:'none',authorized:false,approved:false,matched:false});code='';busy=false;error='';editor=false;expired=false;complete=false;unclaimed=false;extra=0;modal=null;toastText='';render()}
function cover(){$('#phone').innerHTML=`<header class="app-header"><strong>Chamber</strong></header><main class="app-body migration-body"><h1>${t('practice')}</h1><p>${t('practiceDesc')}</p>${button('show-cover','showPrompt','primary')}</main><footer class="app-footer">${button('cover-back','back')}</footer>`;if(!modal)modal='cover'}
function drawModal(){const kind=modal,overlay=document.createElement('section');overlay.className='modal-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label',t(kind==='cover'?'congrats':kind==='auth'?'authTitle':kind==='history'?'authHistory':kind==='restart'?'restartTitle':'confirmTitle'));
 const title=kind==='cover'?'congrats':kind==='auth'?'authTitle':kind==='history'?'authHistory':kind==='restart'?'restartTitle':'confirmTitle',desc=kind==='cover'?'coverCopy':kind==='auth'?'authDesc':kind==='history'?'authHistoryDesc':kind==='restart'?'restartDesc':'confirmDesc',ok=kind==='cover'?'enable':kind==='auth'?'mockAuth':kind==='history'?'allowHistory':kind==='restart'?'restart':'confirmAction';
 overlay.innerHTML=`<div class="modal"><h2>${t(title)}</h2><p>${t(desc)}</p><div class="modal-actions">${button('modal-cancel',kind==='cover'?'later':'cancel','')}${button('modal-ok',ok,'')}</div></div>`;$('#phone').append(overlay);$('#modal-cancel').onclick=()=>{modal=null;if(kind==='cover'){view='chat';toastText=t('coverSkipped')}render()};$('#modal-ok').onclick=()=>{modal=null;if(kind==='cover'){view='chat';render();toast(t('coverEnabled'))}else if(kind==='auth'){participants[role].phase=1;advance(role)}else if(kind==='history'){const target=peer();participants[target].authorized=true;if(participants[target].phase===3)advance(target);else render();toast(t('historyGranted'))}else if(kind==='restart'){unclaimed=true;render()}else{participants[role].approved=true;if(Object.values(participants).every(p=>p.approved&&p.phase===4)){complete=true;render()}else render()}};
}
function aside(){let body=`<span class="review-tag">${t('reviewOnly')}</span><h2>${t(view==='chat'?'chat':view==='code'?'code':view==='migration'?'migration':'cover')}</h2><p>${t(view==='chat'?'guide':view==='code'?'guideCode':view==='migration'?'guideMigration':'guideCover')}</p>`;
 if(view==='chat')body+=`<div class="scenarios">${button('toggle-rails',rails?'hideRails':'showRails')}</div>`;
 if(view==='code')body+=`<label class="scenario-label" for="code-result">${t('states')}</label><select id="code-result"><option value="success" ${codeResult==='success'?'selected':''}>${t('success')}</option><option value="wrong" ${codeResult==='wrong'?'selected':''}>${t('badCode')}</option><option value="network" ${codeResult==='network'?'selected':''}>${t('networkFail')}</option><option value="expired" ${expired?'selected':''}>${t('expired')}</option></select>`;
 if(view==='migration')body+=`<label class="scenario-label" for="role">${t('role')}</label><select id="role"><option value="a" ${role==='a'?'selected':''}>${t('creator')}</option><option value="b" ${role==='b'?'selected':''}>${t('joiner')}</option></select><label class="scenario-label" for="fault">${t('fault')}</label><select id="fault">${['none','missing','capacity','interrupted'].map(k=>`<option value="${k}" ${fault===k?'selected':''}>${t(k==='none'?'noFault':k)}</option>`).join('')}</select><div class="scenarios">${button('new-message','newMessage')}${button('reset','reset')}</div>`;
 body+=`<h2 style="margin-top:24px">${t('checklist')}</h2><ol>${[1,2,3,4,5,6].map(n=>`<li>${t('check'+n)}</li>`).join('')}</ol><p>${t('reviewOnlyDesc')}</p><p>${t('limits')}</p>`;$('#review-aside').innerHTML=body;
}
function toast(value){clearTimeout(toastTimer);toastText=value;drawToast();toastTimer=setTimeout(()=>{toastText='';$('.toast')?.remove()},2400)}function drawToast(){$('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=toastText;$('#phone').append(el)}
function bind(){
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{clearTimeout(transient);busy=false;editor=false;modal=null;toastText='';view=b.dataset.page;render()});
 const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};
 on('toggle-rails',()=>{rails=!rails;render()});on('copy-link',()=>toast(t('mockCopied')));on('copy-code',()=>toast(t('mockCopied')));on('restart',()=>{modal='restart';render()});on('show-cover',()=>{modal='cover';render()});
 on('code-lock',()=>{clearTimeout(transient);code='';editor=false;busy=false;error=t('unlockStop');render()});on('code-back',()=>{clearTimeout(transient);view='chat';code='';busy=false;render()});on('renew',()=>{expired=false;codeResult='success';code='';error='';render()});
 document.querySelectorAll('[data-digit]').forEach(input=>input.onclick=()=>{if(!busy&&!expired){editor=true;render()}});const result=$('#code-result');if(result)result.onchange=()=>{clearTimeout(transient);busy=false;error='';code='';expired=result.value==='expired';codeResult=result.value;render()};
 on('migration-start',startMigration);on('migration-resume',()=>{const p=participants[role];p.paused=false;p.fault='none';advance(role)});on('history-authorize',()=>{modal='history';render()});on('migration-confirm',()=>{if(participants[role].matched){modal='confirm';render()}});const match=$('#safety-match');if(match)match.onchange=()=>{participants[role].matched=match.checked;$('#migration-confirm').disabled=!match.checked};
 const currentRole=$('#role');if(currentRole)currentRole.onchange=()=>switchRole(currentRole.value);const faultSelect=$('#fault');if(faultSelect)faultSelect.onchange=()=>{fault=faultSelect.value};on('reset',reset);on('new-message',()=>{if(complete)return;clearTimeout(animation);extra++;for(const p of Object.values(participants)){if(p.phase)p.phase=2;p.approved=false;p.matched=false;p.authorized=false;p.paused=!!p.phase;p.fault='changed'}render()});
 on('migration-back',()=>{const p=participants[role];if(p.phase&&p.phase<4){clearTimeout(animation);p.paused=true;p.fault='interrupted'}view='chat';render()});on('migration-lock',()=>{clearTimeout(animation);const p=participants[role];if(p.phase<4){p.paused=true;p.fault='interrupted'}toast(t('unlockStop'));render()});on('return-chat',()=>{view='chat';render()});on('cover-back',()=>{modal=null;view='chat';render()});document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{if(b.dataset.guide==='2'){view='cover';render()}else toast(t('reviewOnly'))});document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(t(b.dataset.toast)));
}
$('#language').onclick=()=>{lang=lang==='zh'?'en':'zh';error='';toastText='';render()};$('#theme').onclick=()=>{theme=theme==='light'?'dark':'light';render()};$('#text-size').onclick=()=>{large=!large;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(editor){editor=false;code=''}else if(modal){modal=null;if(view==='cover')view='chat'}render()}});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(animation);clearTimeout(transient);busy=false;editor=false;code='';modal=null;for(const p of Object.values(participants))if(p.phase>0&&p.phase<4){p.paused=true;p.fault='interrupted'}render()}});render();
</script>
</body>
</html>
