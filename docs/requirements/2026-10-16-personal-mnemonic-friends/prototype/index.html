var(--accent-soft);border-radius:12px}.stage{min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--paper-pure)}.head{min-height:48px;padding:2px 10px;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;border-bottom:1px solid var(--line-subtle);flex:none;background:var(--paper-pure)}.head h2{text-align:center}.icon{width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--ink);border-radius:12px}.body{flex:1;overflow:auto;min-height:0;padding:24px}.body.list{padding:8px 16px}.body.chat{padding:18px 16px 12px;background:var(--chat-wallpaper)}.body.center{display:flex;flex-direction:column;justify-content:center;text-align:center;gap:8px}.body.center .mark{margin:0 auto 24px}.mark{width:116px;height:116px;display:flex;align-items:center;justify-content:center;border-radius:32px;background:var(--accent-soft);color:var(--accent)}.mark svg{width:56px;height:56px;stroke-width:1.3}.body.center h1{margin-bottom:12px}.body.center p{max-width:30em;margin-inline:auto;font-size:.875rem;color:var(--ink-muted)}.actions{flex:none;padding:12px 24px max(24px,env(safe-area-inset-bottom));display:grid;gap:8px;background:var(--paper-pure)}.btn{min-height:44px;border-radius:12px;border:0;padding:11px 16px;line-height:1.5;font-size:.875rem;font-weight:500;display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--surface);color:var(--ink);text-decoration:none}.btn.primary{background:var(--action-surface);color:var(--action-ink)}.btn.text{color:var(--accent);background:transparent}.btn.danger{color:var(--danger);background:var(--danger-soft)}.full{width:100%}.inline{display:flex;gap:8px;flex-wrap:wrap}.inline>*{flex:1}.spacer{height:24px}.label{display:block;font-size:.875rem;margin:24px 0 12px}input,textarea{width:100%;padding:13px 14px;min-height:48px;border:1px solid transparent;border-radius:12px;background:var(--surf :.75rem;line-height:1.65;overflow-wrap:anywhere;word-break:break-word;padding:12px;background:var(--surface);border-radius:12px;user-select:all}.word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.25rem,1fr));gap:8px;margin:20px 0}.word{font-family:var(--font-mono);font-size:.8125rem;padding:10px 8px;border-radius:8px;background:var(--surface);display:flex;gap:8px}.word i{font-style:normal;color:var(--ink-muted);font-size:.6875rem}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(5rem,1fr));gap:8px}.checks label{font-size:.75rem;color:var(--ink-muted)}.checks input{margin-top:8px;padding:10px 6px;text-align:center}.steps{list-style:none;padding:0;margin:20px 0}.steps li{display:flex;gap:12px;padding:10px 0;font-size:.875rem;line-height:1.6}.step{width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;font-size:.75rem;flex:none}.done .step{background:var(--accent-soft);color:var(--accent)}.meta{display:grid;grid-template-columns:auto 1fr;gap:12px 20px;font-size:.8125rem;margin:24px 0}.meta dt{color:var(--ink-muted)}.meta dd{margin:0;text-align:right;overflow-wrap:anywhere}.message{max-width:85%;padding:10px 12px;border-radius:16px;background:var(--incoming);font-size:1rem;line-height:1.4;margin:8px 0}.message.mine{margin-left:auto;background:var(--outgoing);color:var(--on-accent);border-bottom-right-radius:6px}.message time{display:block;text-align:right;color:var(--message-time);font-size:.6875rem;margin-top:4px}.date{text-align:center;font-size:.6875rem;color:var(--ink-muted);margin:6px 0 20px}.composer{padding:8px 10px max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--composer-surface)}.composer input{background:var(--composer-field-surface);min-width:0}.composer .btn{flex:none;min-width:44px;padding:8px}.summary{padding:16px;border-bottom:1px solid var(--line-subtle);display:flex;gap:12px;align-items:center}.summary p{margin:2px 0 0;font-size:.75rem;color:var(--ink-muted)}.reviewer{font-size:.8125rem;align-self:start}.reviewer h2{margin:0 0 12px}.reviewer p{color:var(--ink-muted)}.reviewer .btn{width:100%;margin-bottom:8px;font-size:.8125rem}.reviewer .rule{padding:16px 0;border-top:1px solid var(--line-subtle)}.reviewer ul{padding-left:20px;line-height:1.8}.feedback{position:absolute;bottom:80px;left:20px;right:20px;background:var(--ink);color:var(--paper-pure);padding:12px 16px;border-radius:12px;font-size:.8125rem;z-index:4;box-shadow:none}.feedback:empty{display:none}.busy{height:3px;background:var(--surface);overflow:hidden}.busy:after{content:'';display:block;width:40%;height:100%;background:var(--accent);animation:loading .8s ease-out infinite}@keyframes loading{from{transform:translateX(-100%)}to{transform:translateX(350%)}}.stage.changed{animation:enter 280ms cubic-bezier(.16,1,.3,1)}@keyframes enter{from{opacity:.5;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}.empty{padding:44px 12px;text-align:center;color:var(--ink-muted)}.empty svg{width:40px;height:40px;color:var(--accent);margin-bottom:16px}.empty h2{color:var(--ink);margin-bottom:12px}.counter{font-variant-numeric:tabular-nums;font-family:var(--font-mono);letter-spacing:4px;font-size:1.5rem;text-align:center;margin:20px 0}.divider{border:0;border-top:1px solid var(--line-subtle);margin:24px 0}
@media(max-width:1150px){.layout{grid-template-columns:minmax(0,1fr) 240px;gap:20px}.shell{grid-template-columns:230px minmax(0,1fr)}}@media(max-width:1023px){.sidebar{display:none}.layout{max-width:800px;grid-template-columns:minmax(0,440px) 240px}.shell{grid-template-columns:1fr}.review{gap:8px}.review-controls{margin:0}}@media(max-width:700px){.review{padding:8px 12px;display:block}.review-controls{margin-top:6px;display:flex;gap:4px}.review select,.review button{min-height:44px;font-size:12px;padding:6px}.layout{display:block;padding:0}.shell{height:calc(100dvh - var(--review-height,120px));max-height:none;min-height:260px;border:0;border-radius:0}.reviewer{padding:20px 24px;border-top:1px solid var(--line)}.body{padding:24px}.body.list{padding:8px 16px}.actions{padding-bottom:max(16px,env(safe-area-inset-bottom))}.stage .head{padding-top:env(safe-area-inset-top)}}@media(max-height:650px){.body.center{justify-content:flex-start;padding-top:24px}.body.center .mark{width:72px;height:72px;border-radius:20px;margin-bottom:8px}.mark svg{width:40px;height:40px}.body.center h1{font-size:1.375rem}.shell{min-height:260px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(forced-colors:active){button,input,textarea,.key,.notice{border:1px solid ButtonText}.tag{border:1px solid CanvasText}}

<body>
<header class="review" id="review">
 <div><strong>Quiet Room · 个人身份与好友 V1</strong><p>交互原型，只有演示数据。请勿输入真实助记词。</p></div>
 <div class="review-controls">
  <select id="scenario" aria-label="选择演示场景"><option value="existing">已有身份</option><option value="new">创建新身份</option><option value="restore">新设备恢复</option><option value="migration">旧空间迁移</option></select>
  <select id="palette" aria-label="原型配色"><option value="blue">经典</option><option value="green">松绿</option><option value="purple">雾紫</option><option value="apricot">暖杏</option></select>
  <select id="text-size" aria-label="原型文字大小"><option value="16">正常文字</option><option value="32">200%文字</option></select>
  <button type="button" id="scheme">切换深色</button><button type="button" id="reset">重置演示</button>
 </div>
</header>
<div class="layout">
 <div class="shell"><aside class="sidebar" id="sidebar" aria-label="会话导航"></aside><main class="stage" id="stage" tabindex="-1" aria-label="产品原型"></main></div>
 <aside class="reviewer" aria-label="原型演示控制">
  <h2>审阅这次变化</h2><p id="context">以个人身份管理好友和会话，双方接受后才开始聊天。</p>
  <div class="rule"><h3>模拟另一端</h3><p>以下操作属于原型演示工具，不属于正式产品。</p>
   <button class="btn" data-review="peerAccept">对方接受好友申请</button>
   <button class="btn" data-review="peerReject">对方拒绝好友申请</button>
   <button class="btn" data-review="approve">好友批准当前设备</button>
   <button class="btn" data-review="deny">好友拒绝当前设备</button>
   <button class="btn" data-review="expire">恢复申请过期</button>
   <button class="btn" data-review="bind">旧空间对方完成绑定</button>
   <button class="btn" data-review="offline" id="offline">模拟断网：关</button>
  </div>
  <div class="rule"><h3>本版已确认</h3><ul><li>双方接受，每对好友一条会话</li><li>新设备进入旧会话需好友批准</li><li>支持旧空间迁移</li><li>不包含钱包和支付</li></ul></div>
  <div class="rule"><h3>本版待审建议</h3><p>重复旧空间分别保留历史档案，新消息进入唯一好友会话。保险箱保留原权限已确认。</p><a href="../flow.html" target="_blank" rel="noopener">查看业务流程图 ↗</a></div>
  <p class="muted">本原型不生成密钥、不执行加密或认证、不连接生产。审批、网络与迁移均为内存模拟，刷新即重置。</p>
 </aside>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const icons={back:'<path d="m14 6-6 6 6 6M8 12h12"/>',plus:'<path d="M12 5v14M5 12h14"/>',chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/>',people:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M15 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>',arrow:'<path d="m9 6 6 6-6 6"/>',send:'<path d="m22 2-7 20-4-9L2 9 22 2Zm0 0L11 13"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const svg=(name,cls='')=>'<svg class="'+cls+'" viewBox="0 0 24 24" aria-hidden="true">'+(icons[name]||icons.user)+'</svg>';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demoKeys={me:'QR-DEMO-ME-8F3A-21C9',yu:'QR-DEMO-YUZHOU-7A2C-93F1',lin:'QR-DEMO-LIN-5B6D-04E8',new:'QR-DEMO-QINGHE-9E1B-67A4'};
const people={yu:{name:'予舟',symbol:'舟',key:demoKeys.yu},lin:{name:'林间',symbol:'林',key:demoKeys.lin},new:{name:'清禾',symbol:'禾',key:demoKeys.new}};
let state,ticket=0,toastTimer;
function initial(){return{page:'home',name:'知雨',tab:'home',friends:{yu:{status:'ready',restored:false},lin:{status:'ready',restored:false}},incoming:['new'],outgoing:{},messages:{yu:[{text:'周末一起去看海吧。',mine:false},{text:'好，等一个晴天。',mine:true}],lin:[],new:[]},old:[{id:'old1',name:'晚风',person:'yu',status:'locked'},{id:'old2',name:'旅行计划',person:'yu',status:'locked'},{id:'old3',name:'旧空间 03',person:'lin',status:'locked'}],archive:[],active:'yu',offline:false,locked:false,origin:'create',error:'',busy:false,restoreRequested:{},query:'',found:null,historyDone:{}}}
function reset(mode='existing'){ticket++;state=initial();if(mode==='new'){state.page='welcome';state.friends={};state.incoming=[]}if(mode==='restore'){state.page='restore';state.origin='restore'}if(mode==='migration')state.page='migration';render()}
function go(page,extra={}){ticket++;Object.assign(state,{page,error:'',busy:false},extra);render();$('#stage').focus({preventScroll:true})}
function btn(text,action,kind='',data=''){return'<button type="button" class="btn '+kind+'" data-act="'+action+'" '+data+'>'+text+'</button>'}
function header(title,back='home',right=''){return'<header class="head">'+(back?'<button type="button" class="icon" data-act="go" data-page="'+back+'" aria-label="返回">'+svg('back')+'</button>':'<span></span>')+'<h2>'+title+'</h2>'+(right||'<span></span>')+'</header>'}
function error(){return'<div class="error" role="alert">'+esc(state.error)+'</div>'}
function nav(){return'<nav class="nav" aria-label="主要页面">'+[['home','chat','会话'],['friends','people','好友'],['me','user','我的']].map(a=>'<button type="button" data-act="go" data-page="'+a[0]+'" '+(state.page===a[0]?'aria-current="page"':'')+'>'+svg(a[1])+a[2]+'</button>').join('')+'</nav>'}
function personRow(id,desc,action='chat',tag=''){const p=people[id];return'<button type="button" class="row" data-act="'+action+'" data-person="'+id+'"><span class="avatar">'+p.symbol+'</span><span class="grow"><strong>'+p.name+'</strong><small>'+esc(desc)+'</small></span>'+(tag?'<span class="tag pending">'+tag+'</span>':svg('arrow','arrow'))+'</button>'}
function toast(text){let el=$('#feedback');if(!el)return;el.textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if($('#feedback'))$('#feedback').textContent=''},3000)}
async function task(fn){if(state.busy)return;state.error='';state.busy=true;const mine=++ticket;render();await new Promise(r=>setTimeout(r,450));if(mine!==ticket)return;state.busy=false;if(state.offline){state.error='网络连接中断，请连接网络后重试。';render();return}fn();render()}
function home(){const ids=Object.keys(state.friends);return header('会话','', '<button class="icon" type="button" data-act="go" data-page="add" aria-label="添加好友">'+svg('plus')+'</button>')+'<div class="body list">'+(state.origin==='restore'?'<div class="notice">个人身份和会话目录已恢复。进入旧会话前，仍需逐位好友批准这台设备。</div>':'')+(state.incoming.length?'<button type="button" class="row" data-act="go" data-page="requests"><span class="avatar">'+svg('people')+'</span><span class="grow"><strong>好友申请</strong><small>'+state.incoming.length+' 条待处理</small></span>'+svg('arrow','arrow')+'</button>':'')+(ids.length?ids.map(id=>{const f=state.friends[id];return personRow(id,f.status==='ready'?(state.messages[id].at(-1)?.text||'现在可以开始聊天'):f.status==='waiting'?'等待好友批准此设备':'此设备尚未获准进入', 'chat',f.status==='ready'?'':'待批准')}).join(''):'<div class="empty">'+svg('chat')+'<h2>从一个好友开始</h2><p>交换公钥，彼此接受后开始私密聊天。</p>'+btn('添加好友','go','primary','data-page="add"')+'</div>')+Object.keys(state.outgoing).map(id=>personRow(id,state.outgoing[id]==='waiting'?'好友申请已发送':'好友申请已被拒绝','outgoing',state.outgoing[id]==='waiting'?'待接受':'已拒绝')).join('')+'</div>'+nav()}
function friends(){return header('好友','', '<button class="icon" type="button" data-act="go" data-page="add" aria-label="添加好友">'+svg('plus')+'</button>')+'<div class="body list"><button type="button" class="row" data-act="go" data-page="requests"><span class="avatar">'+svg('people')+'</span><span class="grow"><strong>好友申请</strong><small>'+state.incoming.length+' 条待处理</small></span>'+svg('arrow','arrow')+'</button><p class="section">'+Object.keys(state.friends).length+' 位好友</p>'+Object.keys(state.friends).map(id=>personRow(id,people[id].key)).join('')+(Object.keys(state.friends).length?'':'<div class="empty"><p>还没有好友</p></div>')+'</div>'+nav()}
function me(){return header('我的','')+'<div class="body list"><div class="summary"><span class="avatar">'+esc(state.name[0])+'</span><div><h2>'+esc(state.name)+'</h2><p>个人身份</p></div></div>'+[['public','我的公钥','分享给想添加的好友'],['seed','助记词','恢复身份和已备份的个人目录'],['devices','我的设备','独立授权与撤销'],['migration','迁移旧空间','绑定本人身份，保留旧历史']].map(a=>'<button class="row" type="button" data-act="go" data-page="'+a[0]+'"><span class="grow"><strong>'+a[1]+'</strong><small>'+a[2]+'</small></span>'+svg('arrow','arrow')+'</button>').join('')+btn('锁定','lock','text full')+'</div>'+nav()}
function seed(){return header('个人助记词','me')+'<div class="body"><div class="notice warn">助记词控制整个个人身份。请独立保存，勿交给好友。这里展示的是无效演示词。</div><div class="word-grid">'+Array.from({length:24},(_,i)=>'<span class="word"><i>'+(i+1)+'</i>演示'+String(i+1).padStart(2,'0')+'</span>').join('')+'</div><p class="muted">正式产品查看助记词前需要重新验证本机解锁方式。</p></div>'}
function publicPage(){return header('我的公钥','me')+'<div class="body center"><span class="avatar large">'+esc(state.name[0])+'</span><h1>'+esc(state.name)+'</h1><p>将完整公钥分享给对方，对方即可发送好友申请。</p><div class="key">'+demoKeys.me+'</div><p class="muted">个人公钥是公开标识。昵称改变后，公钥保持不变。</p></div><div class="actions">'+btn('复制公钥','copy','primary')+'</div>'}
function add(){let result='';if(state.found){const id=state.found,p=people[id];result='<div class="spacer"></div><div class="summary"><span class="avatar">'+p.symbol+'</span><div><h2>'+p.name+'</h2><p>公钥完整匹配</p></div></div><div class="spacer"></div><div class="key">'+p.key+'</div><div class="spacer"></div>'+(state.friends[id]?btn('打开已有会话','chat','primary full','data-person="'+id+'"'):state.outgoing[id]==='waiting'?'<div class="notice">好友申请已发送，等待对方接受。</div>':btn('发送好友申请','sendRequest','primary full','data-person="'+id+'"'))}return header('添加好友','friends')+'<div class="body"><p class="muted">通过完整公钥找到对方，接受申请后才能聊天。</p><form id="searchForm"><label class="label" for="keyInput">对方公钥</label><textarea id="keyInput" name="key" autocomplete="off" spellcheck="false" placeholder="粘贴完整公钥">'+esc(state.query)+'</textarea>'+error()+'<div class="spacer"></div><button class="btn primary full" type="submit" '+(state.busy?'disabled':'')+'>'+(state.busy?'正在查找…':'查找')+'</button></form><p class="section">可用于本原型的演示公钥</p><button class="key full" type="button" data-act="fillKey">'+demoKeys.new+'</button>'+result+'</div>'}
function requests(){return header('好友申请','friends')+'<div class="body list">'+(state.incoming.length?state.incoming.map(id=>'<div class="summary"><span class="avatar">'+people[id].symbol+'</span><div class="grow"><h2>'+people[id].name+'</h2><p>'+people[id].key+'</p></div></div><div class="notice">对方希望与你成为好友。接受后，双方会建立唯一的加密会话。</div><div class="inline">'+btn('拒绝','reject','', 'data-person="'+id+'"')+btn('接受','accept','primary','data-person="'+id+'"')+'</div>').join(''):'<div class="empty">'+svg('people')+'<h2>暂无好友申请</h2><p>新的申请会显示在这里。</p></div>')+error()+'</div>'}
function outgoing(){const id=state.active,p=people[id],pending=state.outgoing[id]==='waiting';return header('好友申请','home')+'<div class="body center"><span class="avatar large">'+p.symbol+'</span><h1>'+(pending?'等待 '+p.name+' 接受':'对方暂未接受')+'</h1><p>'+(pending?'对方接受申请后，会话会出现在你的会话列表。':'当前没有建立会话。你可以之后再试。')+'</p><div class="key">'+p.key+'</div>'+error()+'</div><div class="actions">'+(pending?btn('撤回申请','cancelRequest','', 'data-person="'+id+'"'):btn('重新发送申请','sendRequest','primary','data-person="'+id+'"'))+'</div>'}
function chat(){const id=state.active,p=people[id],f=state.friends[id];if(!f)return home();let content='';if(f.status!=='ready'){const requested=f.status==='waiting';content='<div class="body center"><div class="mark">'+svg('clock')+'</div><h1>'+(requested?'等待 '+p.name+' 批准':'需要好友批准')+'</h1><p>你已恢复原来的个人身份。'+p.name+' 需要批准这台新设备进入旧会话。</p><div class="notice">批准前，这台设备不能收发新消息，也不能进行通话。</div>'+error()+'</div><div class="actions">'+btn(requested?'查看恢复申请':'申请进入会话','go', 'primary','data-page="approval"')+btn('恢复本人历史备份','go','text','data-page="history"')+'</div>'}else{content='<div class="body chat"><div class="date">今天</div>'+(state.origin==='restore'?'<div class="notice">此设备已获批准。旧聊天需从本人有效备份恢复。</div>':'')+state.messages[id].map(m=>'<div class="message '+(m.mine?'mine':'')+'">'+esc(m.text)+'<time>10:24'+(m.mine?' · 已保存到本机':'')+'</time></div>').join('')+(state.messages[id].length?'':'<div class="empty"><h2>现在可以开始聊天</h2><p>你和 '+p.name+' 已互相接受好友申请。</p></div>')+'</div><form class="composer" id="messageForm"><input name="message" aria-label="消息" placeholder="消息" maxlength="2000" autocomplete="off"><button class="btn primary" type="submit" aria-label="发送消息">'+svg('send')+'</button></form>'}return header(p.name,'home','<button type="button" class="icon" data-act="go" data-page="friendInfo" aria-label="好友详情">'+svg('user')+'</button>')+content}
function approval(){const id=state.active,p=people[id],f=state.friends[id],requested=f.status==='waiting',status=state.restoreRequested[id]||'';return header('进入旧会话','chat')+'<div class="body"><h1>请 '+p.name+' 批准</h1><p class="muted" style="margin-top:12px">好友确认的只是这台设备进入你们的会话，不会看到你的助记词。</p><dl class="meta"><dt>个人公钥</dt><dd>'+demoKeys.me+'</dd><dt>申请设备</dt><dd>这台新浏览器</dd><dt>会话</dt><dd>与 '+p.name+' 的会话</dd></dl><p class="muted">通过熟悉的渠道核对以下安全码。安全码本身不是身份凭证。</p><div class="counter">428 193</div>'+(requested?'<div class="notice">申请已发送，等待好友确认。取消或锁定不会批准此设备。</div>':status?'<div class="notice warn">'+esc(status)+'</div>':'')+error()+'</div><div class="actions">'+(requested?btn('取消本次申请','cancelApproval'):btn('发送批准请求','requestApproval','primary'))+'</div>'}
function history(){const id=state.active;return header('恢复本人历史','chat')+'<div class="body"><h1>'+(state.historyDone[id]?'历史已恢复':'恢复已备份的聊天')+'</h1><p class="muted" style="margin-top:12px">只读取这个身份已授权的有效备份。未备份的内容无法恢复。</p><dl class="meta"><dt>会话</dt><dd>'+people[id].name+'</dd><dt>可用范围</dt><dd>10月12日 至 10月15日</dd><dt>已验证的记录</dt><dd>24 条（演示）</dd></dl>'+(state.historyDone[id]?'<div class="notice success">演示历史已导入并回读核验。</div>':'<div class="notice">恢复历史不会批准新设备。进入旧会话并收发新消息，仍需好友确认。</div>')+error()+'</div><div class="actions">'+(state.historyDone[id]?btn('返回会话','go','primary','data-page="chat"'):btn(state.busy?'正在核验…':'核验并恢复历史','restoreHistory','primary',state.busy?'disabled':''))+'</div>'}
function migration(){return header('迁移旧空间','me')+'<div class="body list"><div class="notice">在原设备解锁旧空间，再绑定个人身份。双方完成绑定后，才能转换为好友会话。</div>'+state.old.map(o=>'<button type="button" class="row" data-act="oldDetail" data-old="'+o.id+'"><span class="avatar">'+o.name[0]+'</span><span class="grow"><strong>'+o.name+'</strong><small>'+({locked:'需要解锁原空间',waiting:'本人已绑定，等待对方',done:'已迁移，旧历史独立保留'}[o.status])+'</small></span>'+svg('arrow','arrow')+'</button>').join('')+'<p class="section">迁移原则</p><p class="muted">同一好友的多个旧空间分别保留历史档案，新消息进入唯一好友会话。旧空间原有历史和保险箱权限不扩大。</p></div>'}
function oldDetail(){const o=state.old.find(x=>x.id===state.oldId),step=o.status==='locked'?0:o.status==='waiting'?2:4;return header(o.name,'migration')+'<div class="body"><h1>绑定到个人身份</h1><ol class="steps">'+['在原设备解锁旧空间','绑定本人个人公钥','等待对方绑定个人公钥','验证双方绑定并转换'].map((t,i)=>'<li class="'+(i<step?'done':'')+'"><span class="step">'+(i<step?'✓':i+1)+'</span><span>'+t+'</span></li>').join('')+'<div class="key">'+demoKeys.me+'</div>'+(o.status==='done'?'<div class="notice success">已与 '+people[o.person].name+' 建立好友关系。此空间历史作为独立档案保留。</div>':o.status==='waiting'?'<div class="notice">本人已绑定。对方仍可按原方式使用空间，等待对方完成绑定。</div>':'<div class="notice">这里只能绑定你在旧空间中原有的一侧，不能替对方绑定或扩大权限。</div>')+error()+'</div><div class="actions">'+(o.status==='locked'?btn('解锁并绑定本人身份','bindOwn','primary'):o.status==='waiting'?btn('返回迁移列表','go','','data-page="migration"'):btn('查看独立历史档案','go','primary','data-page="archives"'))+'</div>'}
function archives(){return header('旧空间历史','friendInfo')+'<div class="body list"><div class="notice">历史按原空间分别保留，未拼接进新的好友会话。</div>'+state.archive.filter(a=>a.person===state.active).map(a=>'<div class="row"><span class="avatar">'+a.name[0]+'</span><span class="grow"><strong>'+a.name+'</strong><small>原空间历史 · 保留原权限</small></span><span class="tag">只读档案</span></div>').join('')+(state.archive.some(a=>a.person===state.active)?'':'<div class="empty"><p>还没有迁移的历史档案。</p></div>')+'</div>'}
function friendInfo(){const p=people[state.active];return header('好友详情','chat')+'<div class="body"><div class="avatar large">'+p.symbol+'</div><h1 style="text-align:center">'+p.name+'</h1><div class="spacer"></div><div class="key">'+p.key+'</div><p class="section">固定个人公钥</p>'+btn('旧空间历史档案','go','full','data-page="archives"')+btn('恢复本人历史备份','go','text full','data-page="history"')+'<div class="notice">此好友只有一条当前会话。原空间档案独立保留。</div></div>'}
function welcome(){return header('Quiet Room','')+'<div class="body center"><div class="mark">'+svg('lock')+'</div><h1>一个身份，<br>与你信任的人聊天</h1><p>用个人助记词保管身份，通过公钥找到彼此。</p></div><div class="actions">'+btn('创建个人身份','go','primary','data-page="profile"')+btn('已有助记词，恢复身份','go','text','data-page="restore"')+'</div>'}
function profile(){return header('创建个人身份','welcome')+'<form id="profileForm" style="display:contents"><div class="body"><div class="avatar large">雨</div><label class="label" for="name">昵称</label><input id="name" name="name" value="'+esc(state.name)+'" maxlength="40" autocomplete="off"><p class="muted" style="margin-top:12px">昵称可以修改，个人公钥保持不变。</p>'+error()+'</div><div class="actions"><button class="btn primary" type="submit">继续</button></div></form>'}
function backup(){return header('保存个人助记词','profile')+'<div class="body"><p class="muted">它用于恢复个人身份、好友和已备份的会话目录。请单独保管。</p><div class="word-grid">'+Array.from({length:24},(_,i)=>'<span class="word"><i>'+(i+1)+'</i>演示'+String(i+1).padStart(2,'0')+'</span>').join('')+'</div><div class="notice warn">本原型使用无效演示词，不可用于真实身份。</div></div><div class="actions">'+btn('我已保存，开始核对','go','primary','data-page="verify"')+'</div>'}
function verify(){return header('核对助记词','backup')+'<form id="verifyForm" style="display:contents"><div class="body"><h1>确认已正确保存</h1><p class="muted" style="margin-top:12px">输入对应位置的演示词，避免保存不完整。</p><div class="checks">'+[3,12,20].map(n=>'<label>第 '+n+' 个词<input name="w'+n+'" aria-label="第'+n+'个词" autocomplete="off" placeholder="演示'+String(n).padStart(2,'0')+'"></label>').join('')+'</div>'+error()+'</div><div class="actions"><button class="btn primary" type="submit">核对并继续</button></div></form>'}
function restore(){return header('恢复个人身份','welcome')+'<form id="restoreForm" style="display:contents"><div class="body"><h1>找回同一个身份</h1><p class="muted" style="margin-top:12px">恢复好友和会话目录后，进入旧会话仍需对应好友批准此设备。</p><label class="label" for="mnemonic">个人助记词</label><textarea id="mnemonic" name="mnemonic" autocomplete="off" spellcheck="false" placeholder="本原型只接受：演示恢复"></textarea><p class="muted" style="margin-top:12px">请勿输入真实助记词。本原型输入“演示恢复”即可体验。</p>'+error()+'</div><div class="actions"><button class="btn primary" type="submit" '+(state.busy?'disabled':'')+'>'+(state.busy?'正在读取加密目录…':'恢复身份')+'</button></div></form>'}
function protect(){return header('设置本机解锁',state.origin==='restore'?'restore':'verify')+'<div class="body center"><div class="mark">'+svg('lock')+'</div><h1>方便下次回来</h1><p>通行密钥或本机密码用于日常解锁。助记词用于恢复个人身份。</p><p>等待好友批准的任务会加密保存在这台设备。</p></div><div class="actions">'+btn('使用通行密钥','protection','primary')+btn('使用本机密码','protection','text')+'</div>'}
function devices(){return header('我的设备','me')+'<div class="body list"><div class="row"><span class="avatar">'+svg('lock')+'</span><span class="grow"><strong>当前浏览器</strong><small>此设备 · '+(state.origin==='restore'?'部分会话待好友批准':'已授权')+'</small></span></div><div class="notice">设备拥有独立密钥。撤销一台设备不改变个人公钥。正式实现需逐会话核验授权状态。</div></div>'}
function locked(){return header('Quiet Room','')+'<div class="body center"><div class="mark">'+svg('lock')+'</div><h1>已锁定</h1><p>等待批准的任务仍保留。解锁不会自动批准设备。</p></div><div class="actions">'+btn('解锁','unlock','primary')+'</div>'}
const screens={home,friends,me,seed,public:publicPage,add,requests,outgoing,chat,approval,history,migration,oldDetail,archives,friendInfo,welcome,profile,backup,verify,restore,protect,devices,locked};
function render(){const stage=$('#stage');stage.innerHTML=(state.busy?'<div class="busy" role="status" aria-label="处理中"></div>':'')+(screens[state.page]||home)()+'<div class="feedback" id="feedback" role="status" aria-live="polite"></div>';stage.classList.remove('changed');void stage.offsetWidth;stage.classList.add('changed');$('#sidebar').innerHTML=state.locked?'<div class="brand">Quiet Room</div><p class="muted">已锁定</p>':'<div class="brand">Quiet Room</div>'+btn('添加好友','go','primary full','data-page="add"')+'<p class="section">我的会话</p>'+Object.keys(state.friends).map(id=>personRow(id,state.friends[id].status==='ready'?'好友会话':'此设备待批准')).join('')+'<div class="spacer"></div>'+btn('好友申请','go','text full','data-page="requests"')+btn('我的身份','go','text full','data-page="me"');$('#context').textContent=({chat:'批准前无消息输入框；批准后才开放此设备的新消息收发。',migration:'仅迁移本人原有一侧。双方绑定后验证身份，再转换为好友关系。',oldDetail:'对方尚未绑定时，旧空间继续可用，不宣称迁移成功。',restore:'导入助记词先恢复身份和加密目录，再逐会话申请好友批准。',approval:'申请只授权当前设备和当前好友会话，不批量批准其他会话。',backup:'24个演示词展示备份流程，不生成有效密钥。',archives:'重复旧空间分别保留档案，不自动合并历史、角色或保险箱权限。'}[state.page]||'个人身份管理好友与会话，双方接受后才建立唯一会话。');$('#offline').textContent='模拟断网：'+(state.offline?'开':'关');measure()}
function measure(){document.documentElement.style.setProperty('--review-height',$('#review').getBoundingClientRect().height+'px')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.person||state.active;if(state.locked&&a!=='unlock'){toast('请先解锁');return}if(a==='go'){go(b.dataset.page);return}if(a==='chat'){go('chat',{active:id});return}if(a==='outgoing'){go('outgoing',{active:id});return}if(a==='fillKey'){$('#keyInput').value=demoKeys.new;$('#keyInput').focus();return}if(a==='copy'){try{await navigator.clipboard.writeText(demoKeys.me);toast('公钥已复制')}catch{toast('复制不可用，请选中公钥复制')}return}if(a==='sendRequest'){await task(()=>{state.active=id;if(state.friends[id]){state.page='chat';return}state.outgoing[id]='waiting';state.page='outgoing'});return}if(a==='cancelRequest'){delete state.outgoing[id];go('home');return}if(a==='accept'){await task(()=>{if(!state.incoming.includes(id))return;state.incoming=state.incoming.filter(x=>x!==id);delete state.outgoing[id];state.friends[id]??={status:'ready',restored:false};state.active=id;state.page='chat'});return}if(a==='reject'){state.incoming=state.incoming.filter(x=>x!==id);render();return}if(a==='requestApproval'){await task(()=>{state.friends[id].status='waiting';state.restoreRequested[id]=''});return}if(a==='cancelApproval'){state.friends[id].status='needsApproval';state.restoreRequested[id]='申请已取消，设备尚未获准进入。';render();return}if(a==='restoreHistory'){await task(()=>{state.historyDone[id]=true});return}if(a==='oldDetail'){go('oldDetail',{oldId:b.dataset.old});return}if(a==='bindOwn'){await task(()=>{state.old.find(x=>x.id===state.oldId).status='waiting'});return}if(a==='protection'){if(state.origin==='restore'){for(const f of Object.values(state.friends))f.status='needsApproval';state.messages={yu:[],lin:[],new:[]}}go('home');toast('本机解锁已设置（模拟）');return}if(a==='lock'){state.locked=true;go('locked');return}if(a==='unlock'){state.locked=false;go('home');return}});
document.addEventListener('submit',async e=>{e.preventDefault();const data=new FormData(e.target);if(e.target.id==='profileForm'){const name=String(data.get('name')).trim();if(!name){state.error='请输入昵称。';render();return}state.name=name;state.origin='create';go('backup')}if(e.target.id==='verifyForm'){if([3,12,20].some(n=>data.get('w'+n)!=='演示'+String(n).padStart(2,'0'))){state.error='演示词不匹配，请返回检查保存的内容。';render();return}go('protect')}if(e.target.id==='restoreForm'){const text=String(data.get('mnemonic')).trim();$('#mnemonic').value='';if(text!=='演示恢复'){state.error='本原型只接受“演示恢复”，请勿输入真实助记词。';render();return}state.origin='restore';await task(()=>{state.friends=initial().friends;state.incoming=[];state.page='protect'})}if(e.target.id==='searchForm'){state.query=String(data.get('key')).trim();state.found=null;if(state.query===demoKeys.me){state.error='这是你自己的公钥。';render();return}if(!/^QR-DEMO-[A-Z0-9-]+$/.test(state.query)){state.error='公钥格式不完整，请粘贴完整公钥。';render();return}await task(()=>{state.found=Object.keys(people).find(id=>people[id].key===state.query)||null;if(!state.found)state.error='未找到这个公钥对应的身份，请核对后重试。'})}if(e.target.id==='messageForm'){const text=String(data.get('message')).trim();if(!text)return;if(state.friends[state.active]?.status!=='ready'){toast('此设备尚未获好友批准');return}if(state.offline){toast('网络不可用，演示消息未发送');return}state.messages[state.active].push({text,mine:true});render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-review]');if(!b)return;queueMicrotask(()=>$('#review').scrollIntoView({block:'start'}));const a=b.dataset.review,id=state.active;if(state.locked&&a!=='offline'){toast('请先解锁');return}if(a==='offline'){state.offline=!state.offline;render();return}if(a==='peerAccept'||a==='peerReject'){const target=Object.keys(state.outgoing).find(k=>state.outgoing[k]==='waiting');if(!target){toast('请先发送好友申请');return}if(a==='peerAccept'){state.friends[target]??={status:'ready',restored:false};delete state.outgoing[target];state.active=target;go('chat')}else{state.outgoing[target]='rejected';state.active=target;go('outgoing')}return}if(['approve','deny','expire'].includes(a)){if(state.locked){toast('先解锁，再演示处理结果');return}if(state.friends[id]?.status!=='waiting'){toast('请先在当前会话发送批准请求');return}if(a==='approve'){state.friends[id].status='ready';state.restoreRequested[id]='';go('chat')}else{state.friends[id].status='needsApproval';state.restoreRequested[id]=a==='deny'?'好友拒绝了这次申请。设备仍未获准进入。':'申请已过期，设备仍未获准进入。';go('approval')}return}if(a==='bind'){const o=state.old.find(x=>x.id===state.oldId&&x.status==='waiting');if(!o){toast('先打开一个旧空间，并完成本人绑定');return}o.status='done';if(!state.archive.some(x=>x.id===o.id))state.archive.push({...o});state.friends[o.person]??={status:'ready',restored:false};state.active=o.person;render();toast('双方绑定已验证（模拟），原历史保留为独立档案')}});
$('#scenario').addEventListener('change',e=>reset(e.target.value));$('#reset').addEventListener('click',()=>reset($('#scenario').value));$('#palette').addEventListener('change',e=>document.documentElement.dataset.theme=e.target.value);$('#scheme').addEventListener('click',()=>{const dark=document.documentElement.dataset.colorScheme!=='dark';document.documentElement.dataset.colorScheme=dark?'dark':'light';document.documentElement.style.colorScheme=dark?'dark':'light';$('#scheme').textContent=dark?'切换浅色':'切换深色'});$('#text-size').addEventListener('change',e=>{document.documentElement.style.fontSize=e.target.value+'px';measure()});window.addEventListener('resize',measure);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!['home','welcome','locked'].includes(state.page))go('home')});reset();
</script>
</body>
</html>
