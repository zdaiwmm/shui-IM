function pageNav(){const groups=[[['创建主线','CREATE'],['welcome','invite','joinInvite','chat','cover','entry','tutorials']], [['恢复支线','RECOVER'],['recover','waiting','peer','history','result']], [['按需了解','ON DEMAND'],['hub','save','backup']]];return groups.map(([title,ids])=>`<div class="nav-group"><h2>${L(...title)}</h2>${ids.map(id=>{const p=PAGES.find(p=>p[0]===id);return `<button class="nav-item ${page===id?'active':''}" data-a="jump:${id}">${L(p[2],p[3])}</button>`}).join('')}</div>`).join('');}

function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function scopeLabel(role=S.activeRole){return S.scope==='both'?L('你们两个人','Both of you'):S.scope==='none'?L('双方均无需恢复','Neither person needs recovery'):(S.scope===(role==='a'?'me':'peer')?L('我','Me'):L('对方','The other person'));}

function completeRecovery(){if(!S.approved||S.scope==='none')return;S.recoveryComplete=true;S.joined=true;S.newMine=false;S.newPeer=false;S.resetContext=false;S.materialsPending=true;S.historyRestored={a:false,b:false};showRecoveryOutcome();}
async function shareInvite(){
 if(S.shareBusy)return;S.shareBusy=true;S.shareCopied=false;
 const url=currentInvite().url;
 let copyTask;
 try{copyTask=Promise.resolve(navigator.clipboard.writeText(url)).then(()=>true,()=>false);}catch{copyTask=Promise.resolve(false);}
 let shareTask;
 try{shareTask=typeof navigator.share==='function'?Promise.resolve(navigator.share({title:'Quiet Room',url})).then(()=>({ok:true}),error=>({error:error?.name||'Error'})):Promise.resolve({error:'Unsupported'});}catch(error){shareTask=Promise.resolve({error:error?.name||'Error'});}
 const [copied,shared]=await Promise.all([copyTask,shareTask]);S.shareBusy=false;S.shareCopied=copied;
 if(copied){toast('已复制链接','Link copied');}
 else sheet('shareFallback');
}
function simulateInvite(){clearTimeout(inviteTimer);S.inviteError='';S.inviteStatus=0;const next=()=>{if(S.inviteError||page!=='invite')return;S.inviteStatus++;if(S.inviteStatus>=4){S.joined=true;go('chat');sheet('created');}else{render();inviteTimer=setTimeout(next,1100);}};next();}

function stopHold(){clearTimeout(holdTimer);holdTarget?.classList.remove('holding');holdTarget=null;}

document.addEventListener('pointerdown',e=>{const el=e.target.closest('#coverHold');if(el&&e.button===0){e.preventDefault();startHold(el);}});
document.addEventListener('pointerup',stopHold);document.addEventListener('pointercancel',stopHold);
document.addEventListener('pointerout',e=>{if(e.target.closest?.('#coverHold')&&!e.relatedTarget?.closest?.('#coverHold'))stopHold();});

function act(a){
 const [k,v]=a.split(':');
 switch(k){
 case 'go':if(v==='peer'){S.activeRole='b';if(S.peerDevice==='pending')S.peerDevice='known';}if(v==='waiting')S.activeRole='a';go(v);break;case 'jump':jump(v);break;case 'back':go(parents[page]||'hub');break;
 case 'view':view=v;render();break;case 'lang':lang=lang==='zh'?'en':'zh';render();break;
 case 'reset':location.reload();break;case 'sheet':sheet(v);break;case 'close':close();break;
 case 'covertry':S.coverPractice=true;S.locked=false;go('cover');break;case 'coachskip':go('chat');break;
 case 'auth':pendingAuth=v;S.accessMethod=S.deviceProfile==='unknown'?'pin':S.deviceProfile;sheet('auth');break;
 case 'method':if(v==='pin'||v===S.deviceProfile||S.deviceProfile==='unknown'){S.accessMethod=v;drawModal();}break;
 case 'profile':S.deviceProfile=v;S.accessMethod=v==='unknown'?'pin':v;render();break;
 case 'authok':close();if(pendingAuth==='joincreate'){S.joined=true;go('chat');sheet('created');}else if(pendingAuth==='create'){S.joined=false;S.inviteStatus=0;go('invite');}else if(pendingAuth==='coverreturn'){S.locked=false;go('chat');}else if(pendingAuth==='homeok'){S.home=true;S.entry=true;go('home');}else if(pendingAuth==='revoked'){S.revoked=true;go('devices');}else if(pendingAuth==='deleted'){S.deleted=true;S.backup='empty';go('data');toast('演示归档已删除','Demo archive deleted');}else if(pendingAuth==='resetwait'){sheet('resetwait');}else if(pendingAuth==='chat'){S.joined=true;go('chat');}else go(pendingAuth||'chat');break;
 case 'inviteReset':S.inviteVersion++;S.inviteError='';S.inviteStatus=0;go('invite');break;
 case 'inviteFail':clearTimeout(inviteTimer);S.inviteError='expired';render();break;
 case 'dismissCard':S.saveCard=false;render();break;
 case 'coverEnable':S.coverEnabled=true;close();toast('自动遮蔽已开启，可在菜单中关闭','Automatic cover enabled; turn it off in the menu');break;
 case 'toggleCover':if(S.coverEnabled){S.coverEnabled=false;drawModal();}else if(S.coverLearned){S.coverEnabled=true;drawModal();}else{act('covertry');}break;
 case 'coverback':if(S.locked){pendingAuth='coverreturn';sheet('auth');}else go('chat');break;
 case 'reopen':S.locked=true;S.coverPractice=false;if(S.coverEnabled)go('cover');else{pendingAuth='coverreturn';sheet('auth');}break;
 case 'copy':copy(v);break;
 case 'download':download('quiet-room-DEMO-'+v+'.txt',v==='material'?'PROTOTYPE ONLY. NOT A VALID RECOVERY SECRET.\nA7KD-M2PX-4826':L('原型说明文件，不是真实归档，不执行加密。\n选择的导出方式：','Prototype description, not a real archive. No encryption performed.\nSelected export mode: ')+v);close();toast('文件已下载，请妥善保存','File downloaded; keep it safe');break;
 case 'shareInvite':shareInvite();break;
 case 'deviceInfo':S.peerDevice=v;render();break;
 case 'peerMode':S.peerAccess=v==='valid';S.activeRole='b';go('peer');break;
 case 'includePeer':S.scope=S.scope==='me'?'both':'peer';render();break;
 case 'assistOnly':S.scope=S.scope==='both'?'me':S.scope==='peer'?'none':S.scope;render();break;
 case 'outcome':if(S.recoveryComplete){S.activeRole=v;showRecoveryOutcome();}else toast('请先完成双方确认','Complete both confirmations first');break;
 case 'endNoRecovery':S.recoveryComplete=false;go('chat');toast('无需恢复，会话保持不变','No recovery needed; conversations unchanged');break;
 case 'materialsDone':if(S.newMine&&S.newPeer){S.materialsPending=false;S.ready=true;go('chat');}break;
 case 'peerjoined':simulateInvite();break;
 case 'verify':S.digits=$('#digits').value;if(S.digits==='4826'){S.mine=true;S.error='';}else S.error='mismatch';render();break;
 case 'peersaved':S.peer=true;S.ready=true;S.joined=true;go('ready');break;
 case 'fill':{const id=v==='wrong'?'digits':v;const val={digits:'4826',wrong:'0000',inputA:'A7KD-M2PX-4826',inputB:'B9RF-N6QW-7314'}[v];S[id]=val;$('#'+id).value=val;break;}
 case 'chat':S.joined=true;S.ready=v==='ready';S.mine=S.ready;S.peer=S.ready;render();break;
 case 'send':{const text=$('#message').value.trim();if(text){(S.recoveryComplete&&targeted(S.activeRole)?S.freshMessages[S.activeRole]:S.messages).push(text);render();$('.scroll').scrollTop=$('.scroll').scrollHeight;}break;}
 case 'entrysaved':S.entry=true;close();toast('入口已标记为保存','Entry marked as saved');break;
 case 'home':S.home=v==='return';render();break;
 case 'startrecovery':S.inputA=$('#inputA').value.trim();if(S.inputA==='A7KD-M2PX-4826'){S.approved=false;S.scopeChanged=false;S.requestedScope=S.scope;S.peerDevice='pending';S.peerAccess=S.scope==='me';S.recoveryComplete=false;S.activeRole='a';go('waiting');}else{S.error='invalid';render();}break;
 case 'approve':if(!S.peerAccess&&!targeted('b')){toast('请先选择同时恢复你的会话','Include your conversation before continuing');break;}S.inputB=$('#inputB').value.trim();if(S.inputB==='B9RF-N6QW-7314'){S.approved=true;S.scopeChanged=S.scope!==S.requestedScope;if(S.scopeChanged){S.activeRole='a';go('waiting');}else{load('restore','chat');}}else{S.error='invalid';render();}break;
 case 'cancelrecovery':S.approved=false;S.scopeChanged=false;S.scope=S.requestedScope;go('recover');break;
 case 'restore':if(S.approved&&S.scope!=='none'){S.scopeChanged=false;S.requestedScope=S.scope;load('restore','chat');}break;
 case 'finishrestore':if(S.approved)completeRecovery();break;
 case 'verifynew':if($('#newdigits').value===ownNewCode().slice(-4)){if(S.activeRole==='a')S.newMine=true;else S.newPeer=true;modal='';render();}else $('#newerror').textContent=L('不一致，请检查刚保存的恢复码。','No match. Check the recovery code you saved.');break;
 case 'newpeer':if(S.activeRole==='a')S.newPeer=true;else S.newMine=true;render();break;
 case 'history':if(S.archiveValid)load('history','result');break;
 case 'archiveDemo':S.archiveName='Quiet-Room-2026-09-16.qrb';S.archiveValid=v==='valid';S.archiveError=v!=='valid';render();break;
 case 'pickArchive':$('#archiveFile').click();break;
 case 'saveArchive':toast('原型未生成真实备份，请勿用于保存数据','Prototype only; no real backup generated');break;
 case 'retryattachment':S.retried=true;render();toast('网络附件已验证，缺失原件仍不可用','Retried attachment verified; missing original remains unavailable');break;
 case 'backupnow':load('backup','backup');break;
 case 'backup':S.deleted=false;S.backup=v;S.ready=true;go('backup');break;
 case 'block':S.reason=v;go('blocked');break;
 case 'resume':if(S.loadKind==='history'||S.approved)load(S.loadKind==='history'?'history':'restore',S.loadKind==='history'?'result':'chat');break;
 case 'delete':if(v==='collection')S.removed=true;if(v==='local')S.hidden=true;go('data');toast('演示操作已完成','Demo action complete');break;
 case 'deleteconfirm':if($('#deletecheck').checked){pendingAuth='deleted';sheet('auth');}else toast('请先确认删除后果','Confirm the deletion consequences first');break;
 case 'resetapproved':S.resetContext=true;S.newMine=false;S.newPeer=false;go('newkeys');break;
 case 'resetdone':S.ready=true;S.materialsPending=false;go('hub');break;
 case 'node':{
 const n=FLOWS.find(f=>f.id===flowId).n.find(n=>n.id===v);
 const reason={missing:'missing',reject:'rejected',network:'network',failure:'network',stop:'missing'}[v];
 if(n.target==='blocked')S.reason=reason||'missing';
 jump(n.target);if(flowId==='recovery'&&['target','helper'].includes(v)){S.recoveryComplete=true;S.scope='me';S.activeRole=v==='target'?'a':'b';S.materialsPending=true;showRecoveryOutcome();}if(flowId==='start'&&v==='created')sheet('created');if(flowId==='start'&&v==='cover'){S.coverPractice=true;render();}if(flowId==='start'&&v==='learned'){S.coverLearned=true;sheet('learned');}
 if(v==='network'||v==='failure'){S.loadKind='restore';S.approved=true;}
 if(flowId==='materials'&&v==='replace'){S.resetContext=true;render();}
 break;}
 case 'flow':flowId=v;view='flows';render();break;
 case 'related':flowId=related(page);view='flows';render();break;
 case 'svg':{const svg=$('.flow-svg').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');download('quiet-room-'+flowId+'-'+lang+'.svg',new XMLSerializer().serializeToString(svg),'image/svg+xml');break;}
 case 'print':window.print();break;
 }
}

 else if(e[0]==='data'&&e[1]==='export'){x1=a.x+w;y1=a.y+h/2;x2=b.x+w;y2=b.y+h/2;d=`M${x1} ${y1}H875V${y2}H${x2}`;}
