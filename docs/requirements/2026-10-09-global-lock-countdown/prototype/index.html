}else{

 const keyboard=document.createElement('div');keyboard.className='keyboard';keyboard.setAttribute('role','img');keyboard.setAttribute('aria-label','模拟键盘，仅用于布局演示');keyboard.hidden=!params.has('keyboard');keyboard.innerHTML='<div class="key-suggestions"><span>我</span><span>马上</span><span>出门</span></div>'+['qwertyuiop','asdfghjkl','zxcvbnm'].map((row,i)=>'<div class="key-row" style="padding:0 '+(i===1?16:i===2?30:0)+'px">'+row.split('').map(k=>'<span class="key">'+k+'</span>').join('')+'</div>').join('')+'<div class="key-row"><span class="key wide">123</span><span class="key wide">中 / 英</span><span class="key space">空格</span><span class="key wide">换行</span></div><div class="keyboard-note">布局模拟，非真实 iOS 键盘</div>';app.append(keyboard);if(params.has('baseline'))app.classList.add('baseline');if(params.has('embed')){document.querySelector('.controls').remove();document.querySelector('.preview').style.cssText='display:block;margin:0;padding:0;max-width:none';app.classList.add('embed')}
 let page=params.get('page')||'chat',locked=false,seconds=Number(params.get('seconds')||60),deadline=Date.now()+seconds*1000,frozen=params.has('freeze'),ongoing=false,modalOpen=false,draft='',messages=[],generation=0;

 function header(title,subtitle='',back=false){if(page==='chat')return '<header class="header chat-header"><button class="spaces-entry" id="nav" aria-label="打开私密空间菜单">'+icon('menu')+'<span>Quiet Room</span></button><button class="heart" aria-label="对方在线状态">'+icon('heart')+'</button></header>';return '<header class="header"><button id="nav" aria-label="返回聊天">'+icon('back')+'</button><div class="header-title">'+title+(subtitle?'<span class="header-sub">'+subtitle+'</span>':'')+'</div><span style="width:44px"></span></header>'}

 function render(){if(locked){content.innerHTML='<div class="lock-screen"><div class="lock-symbol">'+icon('lock')+'</div><h2>Quiet Room 已锁定</h2><p>验证通行密钥后继续使用<br>验证成功将获得新的 60 秒有效期</p><button class="primary" id="unlock">验证通行密钥</button><span class="note">原型仅模拟验证流程</span></div>';content.querySelector('#unlock').onclick=auth;return}
 if(page==='chat'){content.innerHTML=header('Quiet Room','两个人的安静空间')+'<div class="scroll" id="chat-scroll"><div class="date">今天 · 14:32</div><div class="message in"><div class="bubble">今天想去河边走走，<br>你有空吗？</div></div><div class="time">14:32</div><div class="message out"><div class="bubble">有啊，忙完就过去。</div></div><div class="time" style="text-align:right">14:33 · 已送达</div><div class="message in"><div class="bubble">那就老地方见。<br>我带上相机 📷</div></div><div class="message out"><div class="bubble">好，晚点见。</div></div><div id="new-messages">'+messages.map(m=>'<div class="message '+m.direction+'"><div class="bubble">'+esc(m.text)+'</div></div>').join('')+'</div></div><form class="composer"><button type="button" id="attach" aria-label="添加附件">'+icon('plus')+'</button><textarea id="draft" aria-label="输入消息" placeholder="写点什么…">'+esc(draft)+'</textarea><button class="send" type="submit" aria-label="发送消息">'+icon('send')+'</button></form>';content.querySelector('#attach').onclick=()=>sheet('添加附件','选择照片、文件或录音。这里只演示弹窗中的全局倒计时。');content.querySelector('#draft').oninput=e=>{draft=e.target.value};content.querySelector('form').onsubmit=e=>{e.preventDefault();if(!draft.trim())return;messages.push({text:draft,direction:'out'});draft='';renew('发送示例消息');render()}}
 if(page==='settings'){content.innerHTML=header('设置','Quiet Room',true)+'<div class="scroll"><div class="section-label" style="margin-top:2px">外观与体验</div><div class="settings-group">'+setting('settings','界面主题','跟随系统','自动')+setting('heart','在线状态样式','独立于全局倒计时','爱心')+setting('shield','自动锁定','所有页面共用同一有效期','60 秒')+'</div><div class="section-label">设备与安全</div><div class="settings-group">'+setting('device','已授权设备','本机与其他独立密钥设备','2 台')+setting('lock','安全与隐私','解锁、清理与恢复','')+'</div><p class="note" style="margin:17px 3px">点击、输入、滚动等真实操作都会续期。查看设置时也能随时看见剩余时间。</p></div>';content.querySelectorAll('.setting').forEach(b=>b.onclick=()=>sheet(b.querySelector('.label').firstChild.textContent,'此处只演示设置面板。全局倒计时保持可见，打开与关闭面板属于本机用户操作。'))}
 if(page==='reader'){content.innerHTML=header('午后的散步.txt','本机阅读',true)+'<article class="scroll reader"><div class="meta">示例文档 · 第 1 页</div><h2>午后的散步</h2><p>沿着河边慢慢走，树影落在水面上。风不大，云也走得很慢。</p><p>我们在桥边停下来，看一只小船从远处经过。没有急着说话，只是一起看着水面。</p><p>走到老街，找一家安静的小店，坐在窗边。相机留在桌上，今天的光线刚刚好。</p><p>傍晚再沿原路回来。路灯亮起，河水换了颜色，熟悉的地方也有新的样子。</p></article><div class="reader-footer"><span>第 1 页 / 共 3 页</span><span>滚动阅读会续期</span></div>'}
 if(page==='gallery'){content.innerHTML=header('附件','仅本机查看',true)+'<div class="scroll"><div class="section-label" style="margin-top:0">最近的附件 · 示例</div><div class="gallery-grid">'+[['image','河边的照片'],['image','窗边的光'],['file','散步笔记.txt'],['book','午后阅读.epub']].map(([type,name])=>'<button class="tile">'+icon(type)+'<span>'+name+'</span></button>').join('')+'</div><p class="note" style="margin-top:22px">查看图片、切换附件与打开阅读器，均使用同一条全局倒计时。</p></div>';content.querySelectorAll('.tile').forEach(b=>b.onclick=()=>sheet('附件预览','示例附件面板。锁定会关闭预览并释放临时资源。'))}
 if(page==='call'){content.innerHTML=header('语音通话','媒体边界待确认',true)+'<div class="call-body"><div class="avatar">TA</div><h2>'+(ongoing?'通话进行中':'模拟通话')+'</h2><p>'+(ongoing?'前台持续使用 · 离开仍立即锁定':'不使用真实麦克风')+'</p><button class="'+(ongoing?'danger':'primary')+'" id="call-toggle">'+(ongoing?'结束通话':'开始模拟通话')+'</button><p class="note">“持续使用”是待确认的建议规则</p></div>';content.querySelector('#call-toggle').onclick=()=>{ongoing=!ongoing;seconds=60;deadline=Date.now()+60000;render();paint();log(ongoing?'模拟通话使用中，离开页面仍立即锁定。':'通话结束，开始新的 60 秒倒计时。')}}
 content.querySelector('#nav').onclick=()=>page==='chat'?menu():navigate('chat');paint()}
 function setting(type,title,desc,value){return '<button class="setting">'+icon(type)+'<span class="label">'+title+'<small>'+desc+'</small></span><span class="tag">'+value+'</span><span class="chevron">›</span></button>'}
 function navigate(next,fromControl=false){closeDetails();keyboard.hidden=true;page=next;modalOpen=false;render();if(!fromControl)renew('切换应用页面');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
 function closeSheet(){content.querySelector('.overlay')?.remove();modalOpen=false}
 function sheet(title,text,inner=''){closeSheet();modalOpen=true;const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML='<section class="sheet" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="handle"></div><button class="close" aria-label="关闭">'+icon('close')+'</button><h2>'+title+'</h2><p>'+text+'</p>'+inner+'</section>';content.append(overlay);overlay.querySelector('.close').onclick=closeSheet;overlay.onclick=e=>{if(e.target===overlay)closeSheet()};overlay.querySelector('.close').focus()}
 function menu(){sheet('Quiet Room','选择一个页面，查看全局倒计时。','<div class="menu">'+Object.entries(pages).map(([key,label])=>'<button data-go="'+key+'">'+icon({chat:'heart',settings:'settings',reader:'book',gallery:'image',call:'phone'}[key])+label+'</button>').join('')+'</div>');content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go))}
 function auth(){sheet('验证通行密钥','模拟浏览器验证。取消或失败后保持锁定。','<div class="actions"><button class="primary" id="auth-ok">模拟验证通过</button><button class="secondary" id="auth-fail">模拟失败</button><button class="secondary" id="auth-cancel">取消</button></div>');content.querySelector('#auth-ok').onclick=()=>{locked=false;ongoing=false;seconds=60;deadline=Date.now()+60000;frozen=false;generation++;render();paint();log('模拟验证通过，开始新的 60 秒有效期。')};content.querySelector('#auth-fail').onclick=()=>{content.querySelector('.sheet p').textContent='验证失败，请重试。应用仍保持锁定。';log('模拟验证失败；保持锁定。')};content.querySelector('#auth-cancel').onclick=()=>{render();log('取消验证；保持锁定。')}}
 document.querySelector('#lease-trigger').onclick=()=>{const open=document.querySelector('#lease-details').hidden;document.querySelector('#lease-details').hidden=!open;document.querySelector('#lease-trigger').setAttribute('aria-expanded',String(open))};document.querySelector('#details-close').onclick=closeDetails;document.querySelector('#lock-now').onclick=()=>lock('用户主动锁定');
 app.addEventListener('pointerdown',e=>{if(!e.target.closest('#lease'))closeDetails()},{capture:true});
 ['pointerdown','keydown','input','compositionupdate','wheel','touchmove'].forEach(type=>app.addEventListener(type,e=>{if(!e.isTrusted||locked)return;if(type==='keydown'&&['Shift','Control','Alt','Meta','Escape'].includes(e.key))return;renew('本机用户操作')},{capture:true,passive:type!=='keydown'}));
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&!frozen)lock('页面进入后台')});window.addEventListener('pagehide',()=>{if(!frozen)lock('页面退出')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetails();if(modalOpen)closeSheet()}});
 if(document.querySelector('.controls')){document.querySelector('#page-controls').innerHTML=Object.entries(pages).map(([key,label])=>'<button data-page="'+key+'" class="'+(key===page?'active':'')+'">'+label+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page,true));document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{seconds=Number(b.dataset.time);frozen=true;ongoing=false;if(seconds===0){locked=false;lock('演示到期锁定')}else{locked=false;deadline=Date.now()+seconds*1000;render();paint();log('展示 '+seconds+' 秒状态；计时已暂停。')}});document.querySelector('#run').onclick=()=>{if(locked){auth();return}frozen=false;deadline=Date.now()+seconds*1000;log('倒计时正在运行。')};document.querySelector('#leave').onclick=()=>lock('模拟离开应用或标签页');document.querySelector('#receive').onclick=()=>{if(locked){log('已锁定：新消息不会自动解锁或展示。');return}messages.push({text:'收到一条新的示例消息。',direction:'in'});render();log('模拟收到消息，暂按建议规则不单独续期；此边界待确认。')};document.querySelector('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.querySelector('#keyboard-toggle').onclick=()=>{if(locked)return;if(page!=='chat')navigate('chat',true);keyboard.hidden=!keyboard.hidden;if(!keyboard.hidden){draft='我马上出门，晚点见。';content.querySelector('#draft').value=draft;const scroll=content.querySelector('#chat-scroll');scroll.scrollTop=scroll.scrollHeight}};document.querySelector('#modal').onclick=()=>locked?auth():sheet('附件详情','顶边细线仍在同一位置，不增加面板或页面的布局高度。')}
 window.prototype={state:()=>({page,locked,seconds,frozen,ongoing,generation}),setSeconds(n){locked=false;ongoing=false;seconds=n;deadline=Date.now()+n*1000;frozen=true;n===0?lock('演示到期锁定'):render();paint()},run(){frozen=false;deadline=Date.now()+seconds*1000},navigate,lock};
 if(seconds===0){locked=false;lock('演示到期锁定')}else{render();paint()}if(params.has('keyboard')&&!locked){draft='我马上出门，晚点见。';content.querySelector('#draft').value=draft;content.querySelector('#chat-scroll').scrollTop=content.querySelector('#chat-scroll').scrollHeight}
 setInterval(()=>{if(locked||frozen||ongoing)return;seconds=Math.max(0,(deadline-Date.now())/1000);if(seconds<=0)lock('60 秒内无续期，已自动锁定');else paint()},100);
}
</script>
</body>
</html>
