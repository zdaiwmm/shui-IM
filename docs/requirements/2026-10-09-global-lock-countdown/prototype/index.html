 function paint(){document.querySelector('#meter-fill').style.transform='scaleX('+Math.max(0,Math.min(1,seconds/10))+')';document.querySelector('#continue-use').disabled=nonExtendable;document.querySelector('.extend-button').hidden=nonExtendable;document.querySelector('#continue-use').setAttribute('aria-label',nonExtendable?'敏感信息显示期限即将结束，不可延期，需重新验证':'即将自动锁定，延期并重新计时 '+durationText());const visible=!locked&&!ongoing&&seconds>0&&seconds<=10;prompt.hidden=!visible;positionPrompt();document.querySelector('#lock-now')?.toggleAttribute('disabled',locked);if(locked)keyboard.hidden=true}
 function positionPrompt(){const sheet=content.querySelector('.sheet'),dialog=content.querySelector('.overlay[role=dialog]');const owner=dialog||app;if(prompt.parentElement!==owner)owner.append(prompt);if(prompt.hidden)return;const r=app.getBoundingClientRect();const h=prompt.getBoundingClientRect().height||44;let bottom=r.bottom-16;const composer=content.querySelector('.composer'),footer=content.querySelector('.reader-footer');if(composer)bottom=Math.min(bottom,composer.getBoundingClientRect().top-8);if(footer)bottom=Math.min(bottom,footer.getBoundingClientRect().top-10);if(sheet)bottom=Math.min(bottom,sheet.getBoundingClientRect().top-10);const kb=keyboard.hidden?null:keyboard.getBoundingClientRect();if(kb)bottom=Math.min(bottom,kb.top-8);let top=bottom-h;const w=prompt.getBoundingClientRect().width||220;const left=r.left+(r.width-w)/2;const controls=Array.from((sheet||content).querySelectorAll('button,input,textarea,select,[role=button]')).filter(e=>e.id!=='continue-use'&&e.getClientRects().length).map(e=>e.getBoundingClientRect());for(let i=0;i<12;i++){const hits=controls.filter(c=>left<c.right&&left+w>c.left&&top<c.bottom&&top+h>c.top);if(!hits.length)break;top=Math.min(...hits.map(c=>c.top))-h-8}if(top<r.top+8)top=r.top+10;prompt.style.top=top+'px';prompt.style.left=(r.left+r.width/2)+'px';prompt.dataset.owner=sheet?'dialog':page}

 function renew(reason){if(locked)return; if(!frozen&&!ongoing&&Date.now()>=deadline){lock('有效期已结束');return} if(nonExtendable){paint();log('敏感信息固定显示期限不可延期；当前操作不延长它。');return}seconds=duration;deadline=Date.now()+duration*1000;paint();log(reason+'，按设置续期 '+durationText()+'。')}
 function lock(reason){if(locked)return;locked=true;seconds=0;ongoing=false;modalOpen=false;generation++;messages=[];render();paint();log(reason+'；示例正文与媒体已关闭。已输入的文字草稿保留在原型内存中。')}
 function header(title,subtitle='',back=false){if(page==='chat')return '<header class="header chat-header"><button class="spaces-entry" id="nav" aria-label="打开私密空间菜单">'+icon('menu')+'<span>Quiet Room</span></button><button class="heart" aria-label="对方在线状态">'+icon('heart')+'</button></header>';return '<header class="header"><button id="nav" aria-label="返回聊天">'+icon('back')+'</button><div class="header-title">'+title+(subtitle?'<span class="header-sub">'+subtitle+'</span>':'')+'</div><span style="width:44px"></span></header>'}

 function render(){if(prompt.parentElement!==app)app.append(prompt);if(locked){content.innerHTML='<div class="lock-screen"><div class="lock-symbol">'+icon('lock')+'</div><h2>Quiet Room 已锁定</h2><p>验证通行密钥后继续使用<br>验证成功后按设置的时长重新计时</p><button class="primary" id="unlock">验证通行密钥</button><span class="note">原型仅模拟验证流程</span></div>';content.querySelector('#unlock').onclick=auth;return}
 if(page==='chat'){content.innerHTML=header('Quiet Room','两个人的安静空间')+'<div class="scroll" id="chat-scroll"><div class="date">今天 · 14:32</div><div class="message in"><div class="bubble">今天想去河边走走，<br>你有空吗？</div></div><div class="time">14:32</div><div class="message out"><div class="bubble">有啊，忙完就过去。</div></div><div class="time" style="text-align:right">14:33 · 已送达</div><div class="message in"><div class="bubble">那就老地方见。<br>我带上相机 📷</div></div><div class="message out"><div class="bubble">好，晚点见。</div></div><div id="new-messages">'+messages.map(m=>'<div class="message '+m.direction+'"><div class="bubble">'+esc(m.text)+'</div></div>').join('')+'</div></div><form class="composer"><button type="button" id="attach" aria-label="添加附件">'+icon('plus')+'</button><textarea id="draft" aria-label="输入消息" placeholder="写点什么…">'+esc(draft)+'</textarea><button class="send" type="submit" aria-label="发送消息">'+icon('send')+'</button></form>';content.querySelector('#attach').onclick=()=>sheet('添加附件','选择照片、文件或录音。这里只演示弹窗中的全局到期提示。');content.querySelector('#draft').oninput=e=>{draft=e.target.value};content.querySelector('form').onsubmit=e=>{e.preventDefault();if(!draft.trim())return;messages.push({text:draft,direction:'out'});draft='';renew('发送示例消息');render()}}
 if(page==='settings'){content.innerHTML=header('设置','Quiet Room',true)+'<div class="scroll"><div class="section-label" style="margin-top:2px">外观与体验</div><div class="settings-group">'+setting('settings','界面主题','跟随系统','自动')+setting('heart','在线状态样式','独立于全局倒计时','爱心')+setting('shield','自动锁定','到期前 10 秒提醒（固定）',durationText())+'</div><div class="section-label">设备与安全</div><div class="settings-group">'+setting('device','已授权设备','本机与其他独立密钥设备','2 台')+setting('lock','安全与隐私','解锁、清理与恢复','')+'</div><p class="note" style="margin:17px 3px">点击、输入、滚动等真实操作都会续期。长时间没有操作时，会出现统一的到期提示。</p></div>';content.querySelectorAll('.setting').forEach(b=>b.onclick=()=>{const title=b.querySelector('.label').firstChild.textContent;if(title==='自动锁定')idleSettings();else sheet(title,'此处只演示设置面板。最后 10 秒才显示全局提示；打开与关闭面板属于本机用户操作。')})}
 if(page==='reader'){content.innerHTML=header(nonExtendable?'敏感信息（示意）':'午后的散步.txt',nonExtendable?'固定显露期限，不可延期':'本机阅读',true)+'<article class="scroll reader"><div class="meta">示例文档 · 第 1 页</div><h2>午后的散步</h2><p>沿着河边慢慢走，树影落在水面上。风不大，云也走得很慢。</p><p>我们在桥边停下来，看一只小船从远处经过。没有急着说话，只是一起看着水面。</p><p>走到老街，找一家安静的小店，坐在窗边。相机留在桌上，今天的光线刚刚好。</p><p>傍晚再沿原路回来。路灯亮起，河水换了颜色，熟悉的地方也有新的样子。</p></article><div class="reader-footer"><span>第 1 页 / 共 3 页</span><span>滚动阅读会续期</span></div>'}
 if(page==='reader'&&nonExtendable){content.querySelector('.reader').innerHTML='<div class="meta">通过专用验证后的界面示意</div><h2>敏感信息</h2><p>•••• &nbsp; •••• &nbsp; ••••</p><p>这里不展示真实恢复码。固定显示上限不会因操作延长；到期需重新验证。</p>';content.querySelector('.reader-footer').innerHTML='<span>独立安全上限</span><span>全局时长设置不延长它</span>'}
 if(page==='gallery'){content.innerHTML=header('附件','仅本机查看',true)+'<div class="scroll"><div class="section-label" style="margin-top:0">最近的附件 · 示例</div><div class="gallery-grid">'+[['image','河边的照片'],['image','窗边的光'],['file','散步笔记.txt'],['book','午后阅读.epub']].map(([type,name])=>'<button class="tile">'+icon(type)+'<span>'+name+'</span></button>').join('')+'</div><p class="note" style="margin-top:22px">查看图片、切换附件与打开阅读器，均使用同一条全局到期规则。</p></div>';content.querySelectorAll('.tile').forEach(b=>b.onclick=()=>sheet('附件预览','示例附件面板。锁定会关闭预览并释放临时资源。'))}
 if(page==='call'){content.innerHTML=header('语音通话','媒体边界待确认',true)+'<div class="call-body"><div class="avatar">TA</div><h2>'+(ongoing?'通话进行中':'模拟通话')+'</h2><p>'+(ongoing?'前台持续使用 · 离开仍立即锁定':'不使用真实麦克风')+'</p><button class="'+(ongoing?'danger':'primary')+'" id="call-toggle">'+(ongoing?'结束通话':'开始模拟通话')+'</button><p class="note">“持续使用”是待确认的建议规则</p></div>';content.querySelector('#call-toggle').onclick=()=>{if(nonExtendable){log('敏感显露模式不提供媒体豁免。');return}ongoing=!ongoing;seconds=duration;deadline=Date.now()+duration*1000;render();paint();log(ongoing?'模拟通话使用中，离开页面仍立即锁定。':'通话结束，按设置重新计时 '+durationText()+'。')}}
 content.querySelector('#nav').onclick=()=>page==='chat'?menu():navigate('chat');paint()}
 function idleSettings(){let selected=duration;sheet('自动锁定','无操作多久后锁定','<div class="duration-options">'+[30,60,120,300].map(n=>'<button class="duration-choice" data-duration="'+n+'" aria-pressed="'+(n===selected)+'">'+durationText(n)+(n===60?'（默认）':'')+'</button>').join('')+'</div><p class="fixed-reminder">到期前 10 秒提醒（固定）</p><div class="actions"><button class="primary" id="save-duration">保存</button><button class="secondary" id="cancel-duration">取消</button></div>');content.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.duration);content.querySelectorAll('[data-duration]').forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.duration)===selected)))});content.querySelector('#save-duration').onclick=()=>{if(locked)return;if(!frozen&&!ongoing&&Date.now()>=deadline){lock('有效期已结束');return}duration=selected;if(!nonExtendable){seconds=duration;deadline=Date.now()+duration*1000}closeSheet();render();paint();log('本次模拟已保存自动锁定 '+durationText()+'；提醒固定 10 秒。')};content.querySelector('#cancel-duration').onclick=closeSheet}
 function setting(type,title,desc,value){return '<button class="setting">'+icon(type)+'<span class="label">'+title+'<small>'+desc+'</small></span><span class="tag">'+value+'</span><span class="chevron">›</span></button>'}
 function navigate(next,fromControl=false){keyboard.hidden=true;page=next;modalOpen=false;render();if(!fromControl)renew('切换应用页面');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
 function closeSheet(){if(prompt.parentElement!==app)app.append(prompt);content.querySelector('.overlay')?.remove();modalOpen=false;paint()}
 function sheet(title,text,inner=''){closeSheet();modalOpen=true;const overlay=document.createElement('div');overlay.className='overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label',title);overlay.innerHTML='<section class="sheet" aria-label="'+title+'"><div class="handle"></div><button class="close" aria-label="关闭">'+icon('close')+'</button><h2>'+title+'</h2><p>'+text+'</p>'+inner+'</section>';content.append(overlay);overlay.querySelector('.close').onclick=closeSheet;overlay.onclick=e=>{if(e.target===overlay)closeSheet()};overlay.querySelector('.close').focus();paint()}
 function menu(){sheet('Quiet Room','选择一个页面，体验同一条全局到期规则。','<div class="menu">'+Object.entries(pages).map(([key,label])=>'<button data-go="'+key+'">'+icon({chat:'heart',settings:'settings',reader:'book',gallery:'image',call:'phone'}[key])+label+'</button>').join('')+'</div><button class="manual-menu-lock" id="lock-now">'+icon('lock')+'立即锁定</button>');content.querySelector('#lock-now').onclick=()=>lock('用户主动锁定');content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go))}
 function auth(){sheet('验证通行密钥','模拟浏览器验证。取消或失败后保持锁定。','<div class="actions"><button class="primary" id="auth-ok">模拟验证通过</button><button class="secondary" id="auth-fail">模拟失败</button><button class="secondary" id="auth-cancel">取消</button></div>');content.querySelector('#auth-ok').onclick=()=>{locked=false;ongoing=false;seconds=nonExtendable?60:duration;deadline=Date.now()+seconds*1000;frozen=false;generation++;render();paint();log(nonExtendable?'模拟专用验证通过，开始固定 1 分钟显露期。':'模拟验证通过，按设置开始 '+durationText()+' 有效期。')};content.querySelector('#auth-fail').onclick=()=>{content.querySelector('.sheet p').textContent='验证失败，请重试。应用仍保持锁定。';log('模拟验证失败；保持锁定。')};content.querySelector('#auth-cancel').onclick=()=>{render();log('取消验证；保持锁定。')}}
 document.querySelector('#continue-use').addEventListener('pointerdown',e=>{e.preventDefault()});document.querySelector('#continue-use').onclick=e=>{e.preventDefault();e.stopPropagation();renew('点击延期')};window.addEventListener('resize',positionPrompt);window.addEventListener('scroll',positionPrompt,{passive:true});window.visualViewport?.addEventListener('resize',positionPrompt);window.visualViewport?.addEventListener('scroll',positionPrompt);
 ['pointerdown','keydown','input','compositionupdate','wheel','touchmove'].forEach(type=>app.addEventListener(type,e=>{if(!e.isTrusted||locked||e.target.closest('#expiry-prompt'))return;if(type==='keydown'&&['Shift','Control','Alt','Meta','Escape'].includes(e.key))return;renew('本机用户操作')},{capture:true,passive:type!=='keydown'}));
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&!frozen)lock('页面进入后台')});window.addEventListener('pagehide',()=>{if(!frozen)lock('页面退出')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalOpen)closeSheet()}});
 if(document.querySelector('.controls')){document.querySelector('#page-controls').innerHTML=Object.entries(pages).map(([key,label])=>'<button data-page="'+key+'" class="'+(key===page?'active':'')+'">'+label+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page,true));document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{seconds=Number(b.dataset.time);frozen=true;ongoing=false;if(seconds===0){locked=false;lock('演示到期锁定')}else{locked=false;deadline=Date.now()+seconds*1000;render();paint();log('展示 '+seconds+' 秒状态；计时已暂停。')}});document.querySelector('#run').onclick=()=>{if(locked){auth();return}frozen=false;deadline=Date.now()+seconds*1000;log('倒计时正在运行。')};document.querySelector('#leave').onclick=()=>lock('模拟离开应用或标签页');document.querySelector('#receive').onclick=()=>{if(locked){log('已锁定：新消息不会自动解锁或展示。');return}messages.push({text:'收到一条新的示例消息。',direction:'in'});render();log('模拟收到消息，暂按建议规则不单独续期；此边界待确认。')};document.querySelector('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.querySelector('#keyboard-toggle').onclick=()=>{if(locked)return;if(page!=='chat')navigate('chat',true);keyboard.hidden=!keyboard.hidden;paint();if(!keyboard.hidden){draft='我马上出门，晚点见。';content.querySelector('#draft').value=draft;const scroll=content.querySelector('#chat-scroll');scroll.scrollTop=scroll.scrollHeight}};document.querySelector('#modal').onclick=()=>locked?auth():sheet('附件详情','最后 10 秒的提示显示在弹窗操作区之外；点击提示不会关闭弹窗或触发下面的按钮。')}
 window.prototype={state:()=>({page,locked,seconds,frozen,ongoing,generation,duration,nonExtendable}),setSeconds(n){locked=false;ongoing=false;seconds=n;deadline=Date.now()+n*1000;frozen=true;n===0?lock('演示到期锁定'):render();paint()},run(){frozen=false;deadline=Date.now()+seconds*1000},navigate,lock};
 if(seconds===0){locked=false;lock('演示到期锁定')}else{render();paint()}if(params.has('config')&&!locked)idleSettings();if(params.has('keyboard')&&!locked){draft='我马上出门，晚点见。';content.querySelector('#draft').value=draft;content.querySelector('#chat-scroll').scrollTop=content.querySelector('#chat-scroll').scrollHeight}
 setInterval(()=>{if(locked||frozen||ongoing)return;seconds=Math.max(0,(deadline-Date.now())/1000);if(seconds<=0)lock('有效期内无续期，已自动锁定');else paint()},100);
}
</script>
