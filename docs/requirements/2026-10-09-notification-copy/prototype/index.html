<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>通知文案 · H5 原型 v4</title>
  <link rel="stylesheet" href="../../../../src/design-system.css">
  <link rel="stylesheet" href="../../../../src/notifications.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <button id="back" class="icon-button" aria-label="返回通知管理"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 6-6 6 6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h1 id="header-title">通知文案</h1>
      <button type="submit" form="copy-form" id="save" class="nav-save" disabled>保存</button>
    </header>
    <section id="preview-dock" class="preview-dock" aria-label="通知预览">
      <div class="preview-heading"><span id="preview-state">通知预览</span><div class="preview-tabs" role="group" aria-label="通知预览对照"><button id="show-preview" type="button" aria-pressed="true">编辑效果</button><button id="show-reference" type="button" aria-pressed="false">原截图</button></div></div>
      <figure class="notification-crop" aria-label="用户提供的完整通知卡片">
        <img id="reference-image" src=".local-reference/notification-full.png" width="722" height="184" alt="原通知卡片：Quiet Room，ai.shui.click，有一条新消息，解锁后查看。">
        <div id="dynamic-preview" class="notification-text" hidden><strong id="preview-title">Quiet Room</strong><strong class="preview-source">ai.shui.click</strong><strong id="preview-body">有一条新消息，解锁后查看。</strong></div>
      </figure>
      <p id="calibration-note" class="calibration-note">自填文案排版待真机核对</p>
    </section>
    <main id="page-scroll" class="page-scroll">
      <section id="copy-page">
        <form id="copy-form" novalidate>
          <div class="field-group">
            <div class="field-heading"><label for="title">标题 · 第1行</label><span id="title-count"></span></div>
            <input id="title" name="title" value="Quiet Room" placeholder="Quiet Room" autocomplete="off" enterkeyhint="next" aria-describedby="usage-copy title-error">
            <p id="title-error" class="field-error" hidden></p>
          </div>
          <p class="source-note">第2行来源由系统显示，无法修改。</p>
          <div class="field-group">
            <div class="field-heading"><label for="body">正文 · 第3行</label><span id="body-count"></span></div>
            <textarea id="body" name="body" rows="2" placeholder="有一条新消息，解锁后查看。" autocomplete="off" enterkeyhint="done" aria-describedby="usage-copy body-error">有一条新消息，解锁后查看。</textarea>
            <p id="body-error" class="field-error" hidden></p>
          </div>
          <p class="scope-note">保存后，用于本机所有空间的新通知。</p>
          <div class="form-actions">
            <details class="impact-details"><summary>使用说明</summary><p id="usage-copy">留空使用默认文案。仅影响本机，不改变聊天内容、主屏幕名称或旧通知。自填文字可能显示在锁屏上，请勿填写隐私信息。</p></details>
            <button type="button" id="reset" class="reset-button">恢复默认</button>
          </div>
          <p id="enabled-note" class="enabled-note" hidden></p>
          <p id="save-status" role="status" aria-live="polite" hidden></p>
        </form>
      </section>
      <section id="notifications-page" class="notification-content" hidden>


        <div class="notification-controls"><div class="notification-row"><div><strong id="master-label">允许本机通知</strong><p>关闭后暂停本机提醒。</p></div><button class="notification-switch" id="master" type="button" role="switch" aria-labelledby="master-label" aria-checked="true"><span></span></button></div></div>
        <button id="open-copy" class="setting-entry"><div><strong>通知文案</strong><p id="saved-summary">Quiet Room · 有一条新消息，解锁后查看。</p></div><span aria-hidden="true">›</span></button>
        <h3 class="settings-subtitle">各空间通知</h3><div id="spaces"></div><p class="scope-note notification-filter-note">仅提醒新消息，对方上线和自动同步不提醒。</p>
      </section>
      <section id="settings-page" hidden><h2 class="settings-title">本机</h2><button id="open-notifications" class="setting-entry"><div><strong>通知管理</strong><p>提醒开关、各空间与通知文案</p></div><span aria-hidden="true">›</span></button></section>
      <details class="review-tools"><summary>原型工具</summary><p>v4 · 保存仅在本次预览有效，不发送通知。通知使用用户原图，外围背景已裁切；自填文案排版待真机核对。</p><label for="theme">界面主题</label><select id="theme"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select><button id="failure" type="button" aria-pressed="false">模拟保存失败</button><a href="flow.html">查看业务流程</a></details>
    </main>
  </div>
  <dialog id="leave-dialog" class="action-sheet" aria-labelledby="leave-heading"><div class="sheet-content"><h2 id="leave-heading">放弃未保存的修改？</h2><button type="button" id="discard" class="discard-button">放弃修改并返回</button></div><button type="button" id="continue" class="cancel-button">继续编辑</button></dialog>
  <script src="app.js"></script>
</body>
</html>
