<!doctype html><html lang="zh-CN" class="flow-document"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知文案 · 业务流程 v3</title><link rel="stylesheet" href="../../../../src/design-system.css"><link rel="stylesheet" href="style.css"><style>main{max-width:1100px;margin:auto;padding:28px 24px}nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}a{color:var(--accent);min-height:44px;display:inline-flex;align-items:center}h1{font-size:27px;font-weight:550;margin-bottom:12px}p{color:var(--ink-muted);font-size:13px;line-height:1.8}figure{margin:26px 0;overflow:auto;border:1px solid var(--line);border-radius:22px;background:var(--surface-raised)}img{display:block;width:100%;min-width:740px;height:auto}.caption{font-size:11px}code{font:inherit;color:var(--ink)}</style></head><body class="flow-view"><main><nav><a href="index.html">‹ 返回通知文案原型</a><span class="eyebrow">方案 v3 · 仅设计</span></nav><h1>从编辑文案，到收到提醒</h1><p>左侧说明设置如何保存，右侧说明哪些事件会提醒。网站来源始终由系统显示，用户设置只替换标题与正文。</p><figure><img src="flow.svg" alt="通知文案业务流程。左侧：设置进入通知文案，编辑并预览，校验后保存；失败保留输入，返回时确认未保存内容。右侧：上线及同步事件不推送；真正的新聊天消息在符合订阅和总开关时，用本机保存文案显示通知，点击仍需解锁。"></figure><p class="caption">窄屏可横向查看完整流程。此图与 <a href="../flow.md">Mermaid 源码</a>对应。浏览器接入授权请求保留原有独立流程；系统展示与真实送达需正式实现后验证。</p></main></body></html>
