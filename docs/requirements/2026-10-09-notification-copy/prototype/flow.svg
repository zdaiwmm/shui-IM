<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="930" viewBox="0 0 1040 930" role="img" aria-labelledby="title desc"><title id="title">通知文案业务流程 v1</title><desc id="desc">编辑预览与本机保存，以及过滤同步事件后显示通知的两条流程。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#61758e" stroke-width="1.2"/></marker></defs><rect width="1040" height="930" fill="#f7f9fc"/><style>text{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:#26374a}.caption{font-size:12px;fill:#596a7d}.heading{font-size:21px;font-weight:600}.node{font-size:14px}.hint{font-size:11px;fill:#596a7d}</style><text x="70" y="48" text-anchor="start" class="heading">编辑与保存</text><text x="580" y="48" text-anchor="start" class="heading">事件与通知</text><text x="70" y="75" text-anchor="start" class="caption">入口、草稿和失败均有明确去向</text><text x="580" y="75" text-anchor="start" class="caption">上线与自动同步不产生新消息提醒</text><path d="M520 35V870" stroke="#d9e1eb"/><rect x="70" y="110" width="360" height="60" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="250.0" y="145.0" text-anchor="middle" class="node">设置 → 本机 → 通知管理</text><rect x="70" y="210" width="360" height="60" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="250.0" y="236.0" text-anchor="middle" class="node">通知文案</text><text x="250.0" y="254.0" text-anchor="middle" class="node">读取本机已保存设置</text><rect x="70" y="310" width="360" height="60" rx="14" fill="#eaf2ff" stroke="#8caee2"/><text x="250.0" y="336.0" text-anchor="middle" class="node">编辑标题与正文，实时预览</text><text x="250.0" y="354.0" text-anchor="middle" class="node">第2行网站来源只读</text><rect x="70" y="420" width="360" height="60" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="250.0" y="446.0" text-anchor="middle" class="node">检查填写内容</text><text x="250.0" y="464.0" text-anchor="middle" class="node">空白回退默认；超长时禁止保存</text><rect x="70" y="540" width="360" height="60" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="250.0" y="566.0" text-anchor="middle" class="node">点击保存</text><text x="250.0" y="584.0" text-anchor="middle" class="node">失败保留输入，可重新保存</text><rect x="70" y="650" width="360" height="60" rx="14" fill="#eaf2ff" stroke="#8caee2"/><text x="250.0" y="676.0" text-anchor="middle" class="node">本机保存成功</text><text x="250.0" y="694.0" text-anchor="middle" class="node">之后的新通知使用新文案</text><rect x="70" y="760" width="360" height="60" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="250.0" y="786.0" text-anchor="middle" class="node">通知关闭时也可保存</text><text x="250.0" y="804.0" text-anchor="middle" class="node">开启后再用于提醒</text><path d="M250 170 L250 210" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M250 270 L250 310" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M250 370 L250 420" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M250 480 L250 540" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M250 600 L250 650" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M250 710 L250 760" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="70" y="850" width="360" height="44" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="250.0" y="877.0" text-anchor="middle" class="node">返回遇未保存修改：继续编辑 / 放弃并返回</text><text x="250" y="833" text-anchor="middle" class="hint">任意编辑阶段返回时检查</text><rect x="580" y="110" width="360" height="60" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="760.0" y="145.0" text-anchor="middle" class="node">服务端接收经过鉴权的事件</text><rect x="580" y="210" width="360" height="60" rx="14" fill="#eaf2ff" stroke="#8caee2"/><text x="760.0" y="236.0" text-anchor="middle" class="node">分类事件</text><text x="760.0" y="254.0" text-anchor="middle" class="node">上线与已读等同步 → 不推送</text><rect x="580" y="310" width="360" height="60" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="760.0" y="336.0" text-anchor="middle" class="node">真正的新聊天消息</text><text x="760.0" y="354.0" text-anchor="middle" class="node">重复或未订阅 → 不推送</text><rect x="580" y="420" width="360" height="60" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="760.0" y="446.0" text-anchor="middle" class="node">无内容唤醒</text><text x="760.0" y="464.0" text-anchor="middle" class="node">不向推送服务加入自定义文字</text><rect x="580" y="540" width="360" height="60" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="760.0" y="566.0" text-anchor="middle" class="node">本机通知总开关</text><text x="760.0" y="584.0" text-anchor="middle" class="node">关闭 → 抑制排队提醒</text><rect x="580" y="650" width="360" height="60" rx="14" fill="#eaf2ff" stroke="#8caee2"/><text x="760.0" y="676.0" text-anchor="middle" class="node">读取本机已保存的标题与正文</text><text x="760.0" y="694.0" text-anchor="middle" class="node">缺失 → 使用默认；网站来源由系统显示</text><rect x="580" y="760" width="360" height="60" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="760.0" y="786.0" text-anchor="middle" class="node">系统展示通知</text><text x="760.0" y="804.0" text-anchor="middle" class="node">点击仍按原入口验证并解锁</text><path d="M760 170 L760 210" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M760 270 L760 310" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M760 370 L760 420" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M760 480 L760 540" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M760 600 L760 650" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M760 710 L760 760" fill="none" stroke="#61758e" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="580" y="850" width="360" height="44" rx="14" fill="#fdfdfe" stroke="#c6d0dd"/><text x="760.0" y="877.0" text-anchor="middle" class="node">浏览器接入授权请求：保留独立原有流程</text></svg>
