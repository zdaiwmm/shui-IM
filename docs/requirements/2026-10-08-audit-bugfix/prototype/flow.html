<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V1 邀请流程</title><link rel="stylesheet" href="../../../../src/design-system.css"><link rel="stylesheet" href="prototype.css"><main class="demo-flow"><a href="index.html">返回交互原型</a><h1>邀请关闭与异常优先级 · V1</h1><svg viewBox="0 0 680 430" role="img" aria-label="空间列表创建或再次邀请，邀请关闭返回列表；对方加入进入聊天；锁定切换销毁阻止旧回调；首次入口关闭保留聊天。"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="200" y="20" width="260" height="55" rx="12"/><rect x="200" y="125" width="260" height="55" rx="12"/><rect x="200" y="240" width="260" height="55" rx="12"/><path d="M330 75v49M330 180v59M200 267H110V48h89M460 267h130v87" marker-end="url(#arrow)"/><path d="M330 295v59" marker-end="url(#arrow)"/></g><g fill="currentColor" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle"><text x="330" y="53">空间列表</text><text x="330" y="158">创建或再次邀请</text><text x="330" y="273">邀请弹窗</text><text x="73" y="205">关闭</text><text x="330" y="380">对方加入 → 聊天</text><text x="573" y="380">锁定／切换／销毁</text><text x="573" y="405">取消旧回调</text></g></svg><p>创建取消或失败保留列表，可重试。按钮、遮罩、Escape 和有效下拉共用关闭路径。待加入空间保留，可重新邀请。首次创建没有列表上下文时，关闭保留现有聊天底层。</p><p>完整草稿与邀请流程以 <a href="../flow.md">Mermaid 源码</a> 为准。原型只演示界面路径，不执行真实存储、认证和通信。</p></main></html>
