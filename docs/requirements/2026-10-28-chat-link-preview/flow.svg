<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1350" viewBox="0 0 1360 1350" role="img" aria-labelledby="title desc"><title id="title">Quiet Room 链接预览业务流程 V1</title><desc id="desc">输入网址后获取预览，支持关闭、失败和草稿更新。发送时有卡片则加密发送完整卡片，否则仅发送文字；点击卡片或链接在新标签页打开。完整分支见 flow.md。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#84978b"/></marker></defs><rect width="1360" height="1350" fill="#f6f8f5"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="48" y="46" fill="#52635b" font-size="12" font-weight="650" text-anchor="start">QUIET ROOM · 业务流程 V1</text><text x="48" y="94" fill="#18231c" font-size="32" font-weight="650" text-anchor="start">从输入网址，到新标签页打开</text><text x="48" y="125" fill="#536159" font-size="15" font-weight="400" text-anchor="start">发送前自动获取预览；发送时固定当前内容，接收时不自动回源。</text>
<text x="48" y="186" fill="#52635b" font-size="15" font-weight="650" text-anchor="start">01  输入与获取</text>
<g><rect x="48" y="210" width="260" height="76" rx="12" fill="#ffffff" stroke="#d5ded6"/><text x="178" y="239" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">输入或粘贴文字</text><text x="178" y="263" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">识别第一个有效网页链接</text></g>
<g><path d="M360 248 L470 205 L580 248 L470 291 Z" fill="#edf3eb" stroke="#94b79d"/><text x="470" y="253" fill="#284c33" font-size="16" font-weight="600" text-anchor="middle">有可预览网址？</text></g>
<g><rect x="646" y="210" width="270" height="76" rx="12" fill="#e0efdf" stroke="#94b79d"/><text x="781" y="239" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">显示获取中</text><text x="781" y="263" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">短暂停顿后自动请求预览</text></g>
<g><rect x="1010" y="210" width="302" height="76" rx="12" fill="#ffffff" stroke="#d5ded6"/><text x="1161" y="239" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">预览服务获取网页信息</text><text x="1161" y="263" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">会读取网址；不接收其余正文</text></g>
<path d="M308 248H360" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M580 248H646" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="571" y="223" width="84" height="21" rx="5" fill="#f6f8f5"/><text x="613" y="237" fill="#536159" font-size="12" font-weight="500" text-anchor="middle">是</text><path d="M916 248H1010" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/>
<g><rect x="332" y="344" width="276" height="70" rx="12" fill="#ffffff" stroke="#d5ded6"/><text x="470" y="373" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">普通文字输入</text><text x="470" y="397" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">没有网址，不发起抓取</text></g><path d="M470 291V344" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="453" y="309" width="84" height="21" rx="5" fill="#f6f8f5"/><text x="495" y="323" fill="#536159" font-size="12" font-weight="500" text-anchor="middle">否</text>
<text x="48" y="471" fill="#52635b" font-size="15" font-weight="650" text-anchor="start">02  预览跟随当前草稿</text>
<g><rect x="48" y="502" width="284" height="84" rx="12" fill="#ffffff" stroke="#d5ded6"/><text x="190" y="531" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">关闭预览</text><text x="190" y="555" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">点击 ×，保留链接文字</text></g>
<g><rect x="374" y="502" width="284" height="84" rx="12" fill="#e0efdf" stroke="#94b79d"/><text x="516" y="531" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">获取成功</text><text x="516" y="555" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">网站名＋标题＋关闭按钮</text></g>
<g><rect x="700" y="502" width="284" height="84" rx="12" fill="#ffffff" stroke="#d5ded6"/><text x="842" y="531" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">失败或超时</text><text x="842" y="555" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">可重试，也可直接发送</text></g>
<g><rect x="1026" y="502" width="286" height="84" rx="12" fill="#ffffff" stroke="#d5ded6"/><text x="1169" y="531" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">网址更换／删除／离开</text><text x="1169" y="555" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">取消旧任务，丢弃迟到结果</text></g>
<path d="M1161 286V432H516V502" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="474" y="454" width="84" height="21" rx="5" fill="#f6f8f5"/><text x="516" y="468" fill="#536159" font-size="12" font-weight="500" text-anchor="middle">成功</text><path d="M1161 432H842V502" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="800" y="454" width="84" height="21" rx="5" fill="#f6f8f5"/><text x="842" y="468" fill="#536159" font-size="12" font-weight="500" text-anchor="middle">失败</text><path d="M1169 432V502" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/>
<path d="M374 544H332" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="311" y="512" width="84" height="21" rx="5" fill="#f6f8f5"/><text x="353" y="526" fill="#536159" font-size="12" font-weight="500" text-anchor="middle">点击 ×</text>
<path d="M842 502V383H781V286" fill="none" stroke="#84978b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="800" y="396" width="84" height="21" rx="5" fill="#f6f8f5"/><text x="842" y="410" fill="#536159" font-size="12" font-weight="500" text-anchor="middle">重试</text>
<path d="M1169 586V616H1288V324H1178V286" fill="none" stroke="#84978b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="1223" y="336" width="84" height="21" rx="5" fill="#f6f8f5"/><text x="1265" y="350" fill="#536159" font-size="12" font-weight="500" text-anchor="middle">新网址重识别</text>
<text x="48" y="676" fill="#52635b" font-size="15" font-weight="650" text-anchor="start">03  点击发送时，固定当前状态</text>
<g><path d="M505 769 L680 718 L855 769 L680 820 Z" fill="#edf3eb" stroke="#94b79d"/><text x="680" y="774" fill="#284c33" font-size="16" font-weight="600" text-anchor="middle">预览成功且未关闭？</text></g>
<path d="M190 586V646H680V718" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M516 586V646" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M842 586V646H680V718" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/>
<path d="M470 414V646" fill="none" stroke="#84978b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M646 248H627V671H680V718" fill="none" stroke="#84978b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="585" y="627" width="84" height="21" rx="5" fill="#f6f8f5"/><text x="627" y="641" fill="#536159" font-size="12" font-weight="500" text-anchor="middle">获取中也可发</text>
<g><rect x="182" y="912" width="384" height="76" rx="12" fill="#ffffff" stroke="#d5ded6"/><text x="374" y="941" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">仅加密发送文字</text><text x="374" y="965" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">不等抓取；迟到结果不补改已发消息</text></g>
<g><rect x="794" y="912" width="384" height="76" rx="12" fill="#e0efdf" stroke="#94b79d"/><text x="986" y="941" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">加密发送正文与卡片</text><text x="986" y="965" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">卡片文字和已验证图片一起发送</text></g>
<path d="M505 769H374V912" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="332" y="847" width="84" height="21" rx="5" fill="#f6f8f5"/><text x="374" y="861" fill="#536159" font-size="12" font-weight="500" text-anchor="middle">否</text><path d="M855 769H986V912" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="944" y="847" width="84" height="21" rx="5" fill="#f6f8f5"/><text x="986" y="861" fill="#536159" font-size="12" font-weight="500" text-anchor="middle">是</text>
<g><rect x="182" y="1030" width="384" height="70" rx="12" fill="#ffffff" stroke="#d5ded6"/><text x="374" y="1068" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">聊天显示普通文字和可点击链接</text></g>
<g><rect x="794" y="1030" width="384" height="70" rx="12" fill="#ffffff" stroke="#d5ded6"/><text x="986" y="1059" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">双方显示同一份完整卡片</text><text x="986" y="1083" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">大图／小图／纯文字按内容降级</text></g>
<path d="M374 988V1030" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M986 988V1030" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/>
<g><rect x="464" y="1172" width="432" height="84" rx="12" fill="#e0efdf" stroke="#94b79d"/><text x="680" y="1201" fill="#18231c" font-size="17" font-weight="600" text-anchor="middle">点击卡片或网页链接</text><text x="680" y="1225" fill="#536159" font-size="13" font-weight="400" text-anchor="middle">新标签页打开，原聊天页保留</text></g>
<path d="M374 1100V1136H680V1172" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M986 1100V1136H680" fill="none" stroke="#84978b" stroke-width="1.5"  marker-end="url(#arrow)"/>
<text x="48" y="1310" fill="#647168" font-size="12" font-weight="400" text-anchor="start">静态流程摘要，与 flow.md 中的完整 Mermaid 分支配套；未接入真实网页或聊天服务。</text>
</g></svg>