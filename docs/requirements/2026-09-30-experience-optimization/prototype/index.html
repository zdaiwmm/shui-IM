function backupSummary(importing=false){return `${importing?restoreData():backup()}<div class="demo-sheet"><div class="demo-dialog" role="dialog" aria-modal="true" aria-label="${t(importing?'importSummaryTitle':'backupSummaryTitle')}"><h2>${t(importing?'importSummaryTitle':'backupSummaryTitle')}</h2><p>${t(importing?'importSummaryLead':'backupSummaryLead')}</p><p class="fieldhint">${t(importing?'importSummaryNote':'backupSummaryNote')}</p>${alert()}${btn(importing?'importConfirm':'backupConfirm',importing?'confirmImport':'confirmExport','primary',state.env==='unsafe')}${btn('cancel',importing?'showRestoreData':'showBackup','textbtn')}</div></div>`}
function legacyRecovery(){return `<section class="gateway intro"><div class="intro-content">${mark(lockIcon)}<h2>${t('legacyTitle')}</h2><p>${t('legacyLead')}</p>${alert()}</div><div class="actions">${btn('legacyVerify','verifyLegacy','primary',state.env==='unsafe')}${btn('authCancelLock','showUnlock','textbtn')}</div></section>`}
function authBackground(){return state.authPurpose==='export'?backup():state.authPurpose==='import'?restoreData():state.authPurpose==='legacy'?legacyRecovery():state.authPurpose==='pending'?spaces():centerBase()}
function reauth(){const use=authUses[state.authPurpose],blocked=state.env==='unsafe'||state.authCondition!=='normal'||state.authBusy;const message=state.env==='unsafe'?'unsafeMessage':state.authCondition==='limited'?'authLimitedError':state.authCondition==='expired'?'authExpiredError':'';return `<div class="auth-backdrop" aria-hidden="true" inert>${authBackground()}</div><div class="demo-sheet"><div class="demo-dialog auth-dialog" role="dialog" aria-modal="true" aria-label="${t('authTitle')}"><div class="handle"></div><h2>${t('authTitle')}</h2>${annotate('C06',`<div class="auth-body"><p>${t('authLead')}</p><div class="auth-context"><span>${t('authTarget')}</span><strong>${t(state.authPurpose==='pending'?'authPendingRoom':'chatTitle')}</strong><span>${t(use.label)}</span></div><label class="field">${t('unlockInput')}<input id="auth-password" name="space-password" type="${state.authShow?'text':'password'}" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="${state.authPurpose==='pending'?'DEMO-TARGET-123':'DEMO-ONLY-123'}" ${blocked?'disabled':''}></label><label class="checkbox"><input id="auth-show" type="checkbox" ${state.authShow?'checked':''} ${state.authBusy?'disabled':''}>${t('showPassword')}</label>${message?`<p class="warning" role="alert">${t(message)}</p>`:alert()}</div><div class="auth-footer">${btn(state.authBusy?'authVerifying':use.button,'verifyExistingPassword','primary',blocked)}${btn(state.authCondition==='expired'?'authRetry':state.authPurpose==='legacy'?'authCancelLock':'authCancel','cancelAuth','textbtn')}</div>`)}</div></div>`}

function authResult(){const purpose=state.page==='backupResult'?'export':state.page==='importResult'?'import':'pending';const prefix=purpose==='export'?'backup':purpose==='import'?'import':'pending';return `${header(t(authUses[purpose].label),'returnAuthEntry')}<section class="page">${mark(lockIcon)}<h2>${t(prefix+'ResultTitle')}</h2><p>${t(prefix+'ResultLead')}</p><div class="grow"></div>${btn('resultBack','returnAuthEntry')}</section>`}
function beginReauth(purpose){const use=authUses[purpose];state.authPurpose=purpose;state.authCondition='normal';state.authBusy=false;state.authShow=false;state.authToken++;if(state.env==='unsafe'){fail('unsafeMessage',use.parent);return}if(purpose==='recovery'&&state.env==='offline'){fail('centerBackup',use.parent);return}if(state.method==='system')startSystem('reauth',use.parent);else go('reauth')}
function finishAuth(){const purpose=state.authPurpose;go(authUses[purpose].result)}
function cancelAuth(){const use=authUses[state.authPurpose];go(state.authPurpose==='legacy'||state.authCondition==='expired'?'unlock':use.parent)}
function previewRoute(page){if(page==='reauth'){state.method='password';state.created=true;state.authCondition='normal';state.authPurpose=authUses[state.authPurpose]?state.authPurpose:'recovery';}if(page==='password'){state.origin=state.flowTab==='recovery'?'recover':'create';state.fallbackReason='precheck';}go(page)}
function browserWaiting(){return `${header(t('continueBrowser'),'showWelcome')}<section class="page"><h2>${t('browserWaitingTitle')}</h2><p>${t('browserWaitingLead')}</p><div class="code">482 719</div><div class="grow"></div>${btn('browserApprove','browserApprove')}${btn('cancel','showWelcome','textbtn')}</section>`}
function codeView(){return `${header(t('centerPageTitle'),'showCenter')}<section class="page">${mark(lockIcon)}<h2>${t('centerView')}</h2><div class="code">${t('centerCode')}</div><p>${t('centerCodeNote')}</p><div class="grow"></div>${btn('centerBack','showCenter')}</section>`}

function graphNode(x,y,w,h,title,sub,kind='reused',route=''){
 const text=`<g class="${kind}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/><text class="node-id" x="${x+w/2}" y="${y+24}" text-anchor="middle">${t(sub)}</text><text x="${x+w/2}" y="${y+49}" text-anchor="middle">${t(title)}</text></g>`;
 return route?`<a href="#${route}" data-route="${route}" aria-label="${t(title)}">${text}</a>`:text;
}
function edge(path,label='',x=0,y=0,dash=false){return `<path class="edge" d="${path}" ${dash?'stroke-dasharray="5 4"':''}/>${label?`<text class="edge-label" x="${x}" y="${y}" text-anchor="middle">${t(label)}</text>`:''}`}
function flowGraph(){
 const start=`<svg class="flow-svg" role="img" aria-label="${t(state.flowTab==='create'?'flowCreate':state.flowTab==='unlock'?'flowUnlock':'flowRecovery')}" viewBox="0 0 720 ${state.flowTab==='unlock'?950:870}"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs>`;
 if(state.flowTab==='create')return start+
 edge('M360 86V122')+edge('M290 198V226H165V266','nAvailable',162,245)+edge('M430 198V226H555V266','nUsePassword',538,245)+edge('M165 342V388','nPrfFailure',165,372)+edge('M290 432H395V306H420','nAutoFallback',355,420)+edge('M290 306H340V522','nPrfValid',333,486)+edge('M555 342V486H395V522','nValid',539,414)+edge('M360 598V652')+edge('M360 728V782')+edge('M40 300H15V160H230','nCancel',114,147,true)+
 graphNode(230,10,260,76,'nEntry','nEntrySub','reused','welcome')+graphNode(230,122,260,76,'nChoices','nChoicesSub','changed','join')+graphNode(40,266,250,76,'nSystem','nSystemSub')+graphNode(420,266,250,76,'nPassword','nPasswordSub','new','password')+graphNode(40,388,250,88,'nFailure','nFailureSub','changed','welcome')+graphNode(210,522,300,76,'nProtection','nProtectionSub')+graphNode(210,652,300,76,'nBusiness','nBusinessSub')+graphNode(210,782,300,76,'nSuccess','nSuccessSub','reused','invite')+'</svg>';
 if(state.flowTab==='unlock')return start+
 edge('M290 86V122H165V170','nSystemMethod',165,145)+edge('M430 86V122H555V170','nPasswordMethod',555,145)+edge('M290 208H360V334','nSuccessEdge',341,294)+edge('M555 246V292H400V334','nSuccessEdge',538,281)+edge('M165 246V280H125V430','nUnavailableEdge',109,343)+edge('M360 410V522')+edge('M360 598V662')+edge('M360 750V838','nSuccessEdge',416,803)+
 graphNode(210,10,300,76,'nExisting','nExistingSub')+graphNode(40,170,250,76,'nUnlockSystem','nUnlockSystemSub','changed','unlock')+graphNode(420,170,250,76,'nUnlockPassword','nUnlockPasswordSub','changed','unlock')+graphNode(230,334,260,76,'nOpen','nOpenSub','reused','spaces')+graphNode(10,430,270,76,'nCannot','nCannotSub','reused','restore')+graphNode(210,522,300,76,'nSensitive','nSensitiveSub','reused','center')+graphNode(180,662,360,88,'nReauth','nReauthSub','changed','reauth')+graphNode(180,838,360,76,'nReveal','nRevealSub')+'</svg>';
 return start+
 edge('M360 86V128')+edge('M360 204V248','nYes',382,230)+edge('M510 166H694V654H510','nNo',612,217)+edge('M290 324V358H165V402','nChooseSystem',158,381)+edge('M430 324V358H555V402','nChoosePassword',544,381)+edge('M290 440H420','nPrfFailure',355,425)+edge('M165 478V552H320V616')+edge('M555 478V552H400V616')+edge('M360 692V780')+
 graphNode(190,10,340,76,'nRestore','nRestoreSub','changed','restore')+graphNode(160,128,400,76,'nNeedsProtection','nNeedsProtectionSub','changed')+graphNode(210,248,300,76,'nRecoveryChoice','nRecoveryChoiceSub','changed','restore')+graphNode(40,402,250,76,'nOriginalSystem','nOriginalSystemSub','reused','newSpaceGateway')+graphNode(420,402,250,76,'nRecoveryPassword','nRecoveryPasswordSub','new','password')+graphNode(180,616,360,76,'nJoint','nJointSub','changed','recoveryWaiting')+graphNode(190,780,340,76,'nRecovered','nRecoveredSub','changed','recovered')+'</svg>';
}
function flow(){return `<section class="page"><h2>${t('flowTitle')}</h2><p>${t('flowLead')}</p><div class="legend"><span><i></i>${t('reused')}</span><span class="changed"><i></i>${t('changed')}</span><span class="new"><i></i>${t('new')}</span></div><div class="flow-tabs">${[['create','flowCreate'],['unlock','flowUnlock'],['recovery','flowRecovery']].map(([id,key])=>`<button type="button" data-flow="${id}" class="${state.flowTab===id?'active':''}" ${state.flowTab===id?'aria-pressed="true"':'aria-pressed="false"'}>${t(key)}</button>`).join('')}</div><p class="fieldhint">${t('flowScroll')}</p><div class="graph-scroll">${flowGraph()}</div><p class="flow-note">${t(state.flowTab==='create'?'flowCreateNote':state.flowTab==='unlock'?'flowUnlockNote':'flowRecoveryNote')}</p><p class="flow-note">${t('flowOverview')}</p></section>`}
function renderAuthParent(){const parent=authUses[state.authPurpose].parent;return parent==='backupSummary'?backupSummary():parent==='importSummary'?backupSummary(true):parent==='legacyRecovery'?legacyRecovery():parent==='spaces'?spaces():centerBase()}
function system(){return `${state.returnPage==='welcome'?welcome():['join','joinDevice','repair'].includes(state.returnPage)?join():state.returnPage==='unlock'?unlock():state.returnPage==='recoverCode'?recoverCode():state.origin==='reauth'?renderAuthParent():state.returnPage==='center'?center():newSpaceGateway()}<div class="demo-sheet"><div class="demo-dialog" role="dialog" aria-modal="true" aria-label="${t('systemSheet')}"><div class="handle"></div>${mark(lockIcon)}<h2>${t('systemSheet')}</h2><p>${t('systemSheetLead')}</p>${btn('systemSuccess','systemSuccess')}${btn('systemNoSupport','systemUnsupported','secondary')}${btn('systemRetry','systemRetry','secondary')}${btn('cancel','systemCancel','textbtn')}</div></div>`}
function busy(){return `<section class="gateway center"><div class="spinner" role="status" aria-label="${t('busyHelp')}"></div><h2>${t(state.origin==='join'?'busyJoin':state.origin==='recover'?'busyRecover':state.origin==='unlock'?'busyUnlock':'busyCreate')}</h2><p>${t('busyHelp')}</p></section>`}
function renderPage(){switch(state.page){case 'welcome':return welcome();case 'join':case 'joinDevice':case 'repair':return join();case 'password':return password();case 'unlock':return unlock();case 'spaces':return spaces();case 'newSpaceGateway':return newSpaceGateway();case 'chat':return chat();case 'invite':return invite();case 'waiting':return waiting();case 'browserWaiting':return browserWaiting();case 'restore':return restore();case 'recoverCode':return recoverCode();case 'recoveryWaiting':return recoveryWaiting();case 'recovered':return recovered();case 'center':case 'centerAuth':return center();case 'reauth':return reauth();case 'backup':return backup();case 'backupSummary':return backupSummary();case 'restoreData':return restoreData();case 'importSummary':return backupSummary(true);case 'legacyRecovery':return legacyRecovery();case 'backupResult':case 'importResult':case 'pendingResult':return authResult();case 'codeView':return codeView();case 'flow':return flow();case 'system':return system();case 'busy':return busy();default:return welcome()}}
function go(page){state.authToken++;state.authBusy=false;state.authShow=false;state.show=false;state.page=page;state.error='';shell()}
function fail(key,page){state.page=page;state.error=key;shell()}
function startSystem(origin,returnPage){state.origin=origin;state.returnPage=returnPage;go('system')}
function finish(method){state.method=method;state.created=true;go('busy');const origin=state.origin,token=state.authToken;setTimeout(()=>{if(state.page!=='busy'||state.authToken!==token)return;if(state.env!=='normal'){fail(state.env==='unsafe'?'unsafeMessage':origin==='join'?'joinFailed':origin==='recover'?'recoverFailed':'createFailed',origin==='join'?'join':origin==='recover'?'restore':'welcome');return}if(origin==='create'||origin==='drawer'){state.inviteFrom=origin;go('invite')}else if(['join','joinDevice','repair'].includes(origin))go('waiting');else if(origin==='recover')go('recoveryWaiting');else if(origin==='center')go('codeView');else go('chat')},650)}
function enterPassword(reason='precheck'){state.fallbackReason=reason;go('password')}
function beginNewProtection(origin,entry){if(state.env!=='normal')return;state.origin=origin;state.returnPage=entry;if(tryNewSystem())startSystem(origin,entry);else enterPassword('precheck')}
function unsupportedResult(){
 if(state.origin==='browser'){fail('browserNeedsCredential',state.returnPage);return}
 if(state.origin==='unlock'||state.origin==='center'||state.origin==='reauth'){fail('oldSystemUnavailable',state.returnPage);return}
 state.unsupportedSeen=true;enterPassword('result');
}
function validCode(){const value=$('#recovery-code')?.value.trim()||'';if(value!=='DEMO-ONLY'){state.error='codeWrong';shell();return false}state.codeValue=value;return true}
function action(name){switch(name){
case 'showWelcome':go('welcome');break;case 'showJoin':go('join');break;case 'showRestore':state.peerCodeVerified=false;state.recoveryConfirmed=false;state.codeValue='';go('restore');break;case 'showSpaces':go('spaces');break;case 'showChat':go('chat');break;case 'showCenter':go('center');break;
case 'startCreate':beginNewProtection('create','welcome');break;
case 'joinSystem':beginNewProtection(state.page,state.page);break;
case 'passwordBack':go(['join','joinDevice','repair'].includes(state.origin)?state.origin:state.origin==='recover'?'recoverCode':state.origin==='drawer'?'newSpaceGateway':'welcome');break;
case 'savePassword':{if(state.env!=='normal'){fail(state.env==='unsafe'?'unsafeMessage':'createFailed','password');return}const a=$('#password1')?.value||'',b=$('#password2')?.value||'';const length=Array.from(a).length;if(length<12||length>128||a!==b){state.error=length<12?'passwordShort':length>128?'passwordLong':'passwordMismatch';shell();$('#password1').value=a;$('#password2').value=b;return}finish('password');break}
case 'systemCancel':fail('systemCanceled',state.returnPage);break;case 'systemRetry':fail('systemRetryError',state.returnPage);break;case 'systemUnsupported':unsupportedResult();break;
case 'systemSuccess':if(!canSystem()){unsupportedResult();break}if(state.origin==='browser'){go('browserWaiting')}else if(state.origin==='reauth'){finishAuth()}else if(state.origin==='center'){go('codeView')}else if(state.origin==='unlock'){go('chat')}else finish('system');break;
case 'unlockSystem':if(state.env!=='unsafe'&&canSystem())startSystem('unlock','unlock');break;
case 'submitUnlock':if($('#unlock-password')?.value==='DEMO-ONLY-123')go('chat');else fail('unlockWrong','unlock');break;
case 'continueBrowser':if(state.created){go('unlock')}else if(!canSystem()){fail('browserNeedsCredential','welcome')}else{startSystem('browser','welcome')}break;case 'browserApprove':go('spaces');break;
case 'createFromSpaces':state.origin='drawer';if(state.env==='unsafe'){fail('unsafeMessage','spaces');return}if(state.env==='offline'){fail('createFailed','spaces');return}if(state.method==='password'||canSystem())finish(state.method);else go('newSpaceGateway');break;
case 'newSpaceSystem':beginNewProtection('drawer','newSpaceGateway');break;
case 'closeInvite':go(state.inviteFrom==='drawer'?'spaces':'chat');break;case 'copyInvite':$('#announce').textContent=t('copied');break;
case 'approveJoin':go('chat');break;case 'rejectJoin':fail('rejected','waiting');break;
case 'openCode':go('recoverCode');break;case 'closeCode':state.codeValue='';go('restore');break;
case 'codeSystem':if(!validCode())return;if(state.recoveryCase==='uncertain'){fail('recoveryStateUnknown','recoverCode');return}state.origin='recover';state.peerCodeVerified=false;state.recoveryConfirmed=false;if(!needsOwnRecovery()){go('recoveryWaiting')}else beginNewProtection('recover','recoverCode');break;
case 'peerEnterCode':state.peerCodeVerified=true;go('recoveryWaiting');break;
case 'finishRecovery':if(!state.peerCodeVerified||['bothReady','uncertain'].includes(state.recoveryCase))return;state.recoveryConfirmed=true;go('recovered');break;

case 'viewCode':beginReauth('recovery');break;
case 'openBackupSummary':go('backupSummary');break;case 'openImportSummary':go('importSummary');break;
case 'showBackup':go('backup');break;case 'showRestoreData':go('restoreData');break;case 'showUnlock':go('unlock');break;
case 'confirmExport':beginReauth('export');break;case 'confirmImport':beginReauth('import');break;case 'verifyLegacy':beginReauth('legacy');break;
case 'cancelAuth':cancelAuth();break;
case 'returnAuthEntry':go(state.page==='backupResult'?'backup':state.page==='importResult'?'restoreData':'spaces');break;
case 'verifyExistingPassword':{
 if(state.authBusy||state.env==='unsafe'||state.authCondition!=='normal')return;
 const valid=$('#auth-password')?.value===(state.authPurpose==='pending'?'DEMO-TARGET-123':'DEMO-ONLY-123'),purpose=state.authPurpose,token=++state.authToken;
 state.authBusy=true;state.error='';shell();
 setTimeout(()=>{if(state.page!=='reauth'||state.authToken!==token||state.authPurpose!==purpose)return;state.authBusy=false;if(!valid){state.error='unlockWrong';shell();$('#auth-password')?.focus();return}finishAuth()},500);break;
}

}}
$('#app').addEventListener('click',e=>{const flowButton=e.target.closest('[data-flow]');if(flowButton){state.flowTab=flowButton.dataset.flow;shell();return}const route=e.target.closest('[data-route]');if(route){e.preventDefault();previewRoute(route.dataset.route);return}const button=e.target.closest('[data-action]');if(button&&!button.disabled)action(button.dataset.action)});
$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&state.page==='password'&&['password1','password2'].includes(e.target.id)){e.preventDefault();if(e.target.id==='password1')$('#password2').focus();else action('savePassword');return}if(e.key==='Enter'&&state.page==='unlock'&&e.target.id==='unlock-password'){e.preventDefault();action('submitUnlock');return}if(!['reauth','centerAuth'].includes(state.page))return;if(e.key==='Enter'&&e.target.id==='auth-password'){e.preventDefault();action('verifyExistingPassword')}if(e.key==='Escape'){e.preventDefault();cancelAuth()}});
$('#app').addEventListener('change',e=>{if(e.target.id==='auth-show'){const value=$('#auth-password')?.value||'';state.authShow=e.target.checked;shell();$('#auth-password').value=value;return}if(e.target.id==='show'){const a=$('#password1')?.value||'',b=$('#password2')?.value||'',u=$('#unlock-password')?.value;state.show=e.target.checked;shell();if(u!==undefined)$('#unlock-password').value=u;else{$('#password1').value=a;$('#password2').value=b}}});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(b){previewRoute(b.dataset.route)}});
$('#recovery-tools').addEventListener('change',e=>{if(e.target.id!=='recovery-case')return;state.recoveryCase=e.target.value;state.peerCodeVerified=false;state.recoveryConfirmed=false;state.codeValue='';state.error='';state.authToken++;if(['recoveryWaiting','recovered','password'].includes(state.page))go('restore');else shell()});
$('#reauth-tools').addEventListener('change',e=>{state.authToken++;state.authBusy=false;state.authShow=false;state.error='';if(e.target.id==='auth-purpose')state.authPurpose=e.target.value;if(e.target.id==='auth-state')state.authCondition=e.target.value;shell()});
$('#markers').addEventListener('change',e=>{state.markers=e.target.checked;metadata()});
$('#detection').addEventListener('change',e=>{state.detection=e.target.value;state.unsupportedSeen=false;shell()});
$('#scenario').addEventListener('change',e=>{state.scenario=e.target.value;state.unsupportedSeen=false;shell()});$('#environment').addEventListener('change',e=>{state.env=e.target.value;state.authToken++;state.authBusy=false;shell()});$('#method').addEventListener('change',e=>{state.method=e.target.value;state.created=true;state.authToken++;state.authBusy=false;if(state.page==='reauth'&&state.method==='system')go(authUses[state.authPurpose].parent);else shell()});$('#theme').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';shell()});$('#language').addEventListener('click',()=>{state.lang=state.lang==='zh'?'en':'zh';shell()});$('#reset').addEventListener('click',()=>{const lang=state.lang,theme=state.theme;Object.assign(state,{authPurpose:'recovery',authCondition:'normal',authBusy:false,authShow:false,authToken:state.authToken+1,detection:'onEntry',unsupportedSeen:false,fallbackReason:'precheck',scenario:'bioPrf',env:'normal',method:'system',page:'welcome',origin:'create',returnPage:'welcome',error:'',show:false,created:false,recoveryCase:'meLost',peerCodeVerified:false,recoveryConfirmed:false,newSpace:false,codeValue:'',inviteFrom:'create',lang,theme});shell()});
const params=new URLSearchParams(location.search),requested=params.get('page');if(['system','password'].includes(params.get('method'))){state.method=params.get('method');state.created=true;}if(['create','unlock','recovery'].includes(params.get('flow')))state.flowTab=params.get('flow');if(recoveryCases.includes(params.get('recovery')))state.recoveryCase=params.get('recovery');if(authUses[params.get('purpose')])state.authPurpose=params.get('purpose');if(requested&&pageCatalog[requested])state.page=requested;if(['reauth','centerAuth'].includes(state.page)){state.method='password';state.created=true;}
shell();
})();
</script>
