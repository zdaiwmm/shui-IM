name: Alibaba OIDC doctor

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aliyun-oidc-doctor-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Alibaba OIDC and SAS access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect OIDC claims without printing the token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.aliyuncs.com")
          printf '%s' "$response" > "$RUNNER_TEMP/quiet-room-oidc.json"
          RUNNER_TEMP="$RUNNER_TEMP" node <<'NODE'
          import { readFileSync } from 'node:fs';

          const response = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/quiet-room-oidc.json`, 'utf8'));
          const token = response.value;
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
          const visible = Object.fromEntries(
            ['iss', 'aud', 'sub', 'repository', 'environment', 'ref', 'event_name', 'job_workflow_ref']
              .filter((key) => claims[key] !== undefined)
              .map((key) => [key, claims[key]]),
          );
          console.log(JSON.stringify(visible, null, 2));
          NODE
          rm -f "$RUNNER_TEMP/quiet-room-oidc.json"

      - name: Exchange GitHub OIDC token for RAM role credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-oidc-doctor
          role-session-expiration: 900
          audience: sts.aliyuncs.com

      - name: Install Alibaba Cloud CLI
        uses: aliyun/setup-aliyun-cli-action@v1
        with:
          version: 3.4.11

      - name: Read the configured Simple Application Server instance
        env:
          ALIBABA_CLOUD_REGION_ID: ${{ vars.SAS_REGION_ID || vars.ECS_REGION_ID }}
          SAS_REGION_ID: ${{ vars.SAS_REGION_ID || vars.ECS_REGION_ID }}
          SAS_INSTANCE_ID: ${{ vars.SAS_INSTANCE_ID || vars.ECS_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SAS_INSTANCE_ID" in
            *'<'*|*'>'*)
              echo "SAS_INSTANCE_ID must be a real Simple Application Server ID without angle-bracket placeholders" >&2
              exit 2
              ;;
          esac
          instance_ids=$(printf '["%s"]' "$SAS_INSTANCE_ID")
          aliyun swas-open ListInstances \
            --version 2020-06-01 \
            --endpoint "swas.${SAS_REGION_ID}.aliyuncs.com" \
            --force \
            --RegionId "$SAS_REGION_ID" \
            --InstanceIds "$instance_ids" \
            > "$RUNNER_TEMP/quiet-room-sas.json"

          if ! node -e "
            const { readFileSync } = require('node:fs');
            const payload = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/quiet-room-sas.json', 'utf8'));
            process.exit((payload?.Instances ?? []).length ? 0 : 1);
          "; then
            echo "Configured ID was not returned; listing visible Simple Application Server instances in ${SAS_REGION_ID} for diagnosis"
            aliyun swas-open ListInstances \
              --version 2020-06-01 \
              --endpoint "swas.${SAS_REGION_ID}.aliyuncs.com" \
              --force \
              --RegionId "$SAS_REGION_ID" \
              --PageSize 100 \
              > "$RUNNER_TEMP/quiet-room-sas.json"
          fi

          SAS_INSTANCE_ID="$SAS_INSTANCE_ID" node <<'NODE'
          import { readFileSync } from 'node:fs';

          const expected = process.env.SAS_INSTANCE_ID;
          const payload = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/quiet-room-sas.json`, 'utf8'));
          const instances = Array.isArray(payload?.Instances) ? payload.Instances : [];
          const instance = instances.find(({ InstanceId }) => InstanceId === expected);

          if (!instance) {
            const returned = instances.map(({ InstanceId, Status }) => `${InstanceId}:${Status}`).join(', ');
            throw new Error(`SAS instance ${expected} was not returned by ListInstances (returned: ${returned || 'none'})`);
          }
          if (instance.Status !== 'Running') {
            throw new Error(`SAS instance ${expected} is ${instance.Status}, expected Running`);
          }

          console.log(`SAS_OIDC_OK instance=${instance.InstanceId} status=${instance.Status}`);
          NODE
