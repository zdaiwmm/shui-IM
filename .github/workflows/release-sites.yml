name: Release and verify Quiet Room
run-name: ${{ inputs.mode }} ${{ inputs.sha }} on ${{ inputs.target }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Approved full application commit (40 hex characters)
        required: true
        type: string
      target:
        description: Release target
        type: choice
        options: [production, tokyo-public, both]
      mode:
        description: Operation
        type: choice
        options: [doctor, readback, deploy]

permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: quiet-room-production-publish
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    name: ${{ matrix.site }} / ${{ inputs.mode }}
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        site: ${{ fromJSON(inputs.target == 'both' && '["production","tokyo-public"]' || format('["{0}"]', inputs.target)) }}
    environment: production
    # Tokyo's firewall admits a fixed maintenance source. Configure an ephemeral
    # GitHub runner with approved egress before selecting Tokyo.
    runs-on: ${{ matrix.site == 'tokyo-public' && vars.TOKYO_RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 65
    env:
      APPROVED_SHA: ${{ inputs.sha }}
      PUBLISH_MODE: ${{ inputs.mode }}
      GH_TOKEN: ${{ github.token }}
      SAS_REGION_ID: ${{ vars.SAS_REGION_ID }}
      SAS_INSTANCE_ID: ${{ vars.SAS_INSTANCE_ID }}
    steps:
      - name: Validate request
        env:
          TARGET: ${{ matrix.site }}
          TOKYO_RUNNER: ${{ vars.TOKYO_RELEASE_RUNNER }}
          TARGET_SELECTION: ${{ inputs.target }}
          TOKYO_ROLE: ${{ vars.TOKYO_LIGHTSAIL_ROLE_ARN }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TARGET" == production || "$TARGET" == tokyo-public ]]
          [[ "$PUBLISH_MODE" =~ ^(doctor|readback|deploy)$ ]]
          if [[ "$TARGET_SELECTION" != production && ( -z "$TOKYO_RUNNER" || -z "$TOKYO_ROLE" ) ]]; then
            echo "Tokyo requires an approved fixed-egress runner and Lightsail role." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exchange protected GitHub OIDC identity
        if: matrix.site == 'production'
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_DEPLOY_ROLE_ARN }}
          role-session-name: quiet-room-production-publish
          role-session-expiration: 3600
          audience: sts.aliyuncs.com
      - name: Install fixed Alibaba Cloud CLI
        if: matrix.site == 'production'
        uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: 3.4.11
      - name: Validate exact CI and stream the approved image on the server
        if: matrix.site == 'production' && inputs.mode != 'readback'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.sha }}
          PUBLISH_MODE: ${{ inputs.mode }}
          SAS_REGION_ID: ${{ vars.SAS_REGION_ID }}
          SAS_INSTANCE_ID: ${{ vars.SAS_INSTANCE_ID }}
        run: node scripts/cloud-publish.mjs
      - name: Independently verify the main site
        if: matrix.site == 'production' && inputs.mode != 'doctor'
        run: node scripts/cloud-readback.mjs
      - name: Obtain temporary Tokyo deployment identity
        if: matrix.site == 'tokyo-public'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.TOKYO_LIGHTSAIL_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Authenticate the Tokyo server
        if: matrix.site == 'tokyo-public'
        run: python3 scripts/lightsail-session.py
      - name: Check Tokyo or deploy the approved image
        if: matrix.site == 'tokyo-public' && inputs.mode != 'readback'
        run: |
          if [[ "$PUBLISH_MODE" == doctor ]]; then
            node scripts/release.mjs --environment tokyo-public --doctor
          else
            node scripts/publish.mjs --environment tokyo-public --sha "$APPROVED_SHA"
          fi
      - name: Independently verify Tokyo
        if: matrix.site == 'tokyo-public' && inputs.mode != 'doctor'
        run: node scripts/production-readback.mjs --environment tokyo-public --sha "$APPROVED_SHA"
      - name: Preserve evidence for the selected environment
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quiet-room-${{ matrix.site }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quiet-room-cloud-receipt.json
            ${{ runner.temp }}/readback-invocations.json
            .git/quiet-room-readback/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
