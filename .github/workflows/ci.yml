name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Check for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run unit/integration tests
        run: npm run check

      - name: Install Chromium for the real-browser suite
        run: npx playwright install --with-deps chromium

      - name: Run real-browser end-to-end tests
        run: npm run test:browser

      - name: Verify native call media and call views
        run: npm run test:calls

      # Still required for a green run. Keep registry outages from hiding test results.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --fetch-timeout=30000 --fetch-retries=2
