name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A documentation-only main commit needs this full run before release.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compare all changed paths with the documentation allowlist
        id: scope
        run: node scripts/ci-scope.mjs

  docs:
    name: Check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-docs.mjs

  secret_scan:
    name: Check for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Retain the complete history, including the PR range's parent.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and unit/integration tests
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check

  browser:
    name: Browser regression group ${{ matrix.group }}
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      # The backup/admin browser fixture serves dist/admin.html.
      - run: npm run build
      - run: npm run test:browser -- --group ${{ matrix.group }}

  calls:
    name: Native call media and call views
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      # The unit/integration job already runs every call unit test.
      - run: npm run test:calls:e2e

  audit:
    name: Audit production dependencies
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: node scripts/audit-production.mjs

  full_application:
    # Fixed release evidence name. A green documentation run cannot replace it.
    name: Full application verification
    needs: [scope, docs, secret_scan, build, browser, calls, audit]
    if: always() && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require every full verification job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs verify full

  verify:
    # Keep the existing branch-protection check name stable.
    name: verify
    needs: [scope, docs, secret_scan, build, browser, calls, audit, full_application]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require the complete result for the selected scope
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs verify verify
