name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge queue speculative groups must run the same required checks.
  merge_group:
    types: [checks_requested]
  # A documentation-only main commit needs this full run before release.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      documents: ${{ steps.scope.outputs.documents }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compare all changed paths with the documentation allowlist
        id: scope
        run: node scripts/ci-scope.mjs

  docs:
    name: Check documentation
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-docs.mjs
        env:
          CI_DOCUMENTS: ${{ needs.scope.outputs.documents }}

  secret_scan:
    name: Check for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Retain the complete history, including the PR range's parent.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  delivery:
    name: Delivery tool verification
    needs: scope
    if: needs.scope.outputs.mode == 'delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: node scripts/check-delivery.mjs

  build:
    name: Build and unit/integration tests
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check

  browser:
    name: Browser regression group ${{ matrix.group }} shard ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Use the official image to avoid downloading OS dependencies from slow
    # runner apt mirrors. Keep the tag and digest aligned with package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    env:
      BROWSER_CONTAINER_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: 1, shard: '1/1' }
          - { group: 2, shard: '1/6' }
          - { group: 2, shard: '2/6' }
          - { group: 2, shard: '3/6' }
          - { group: 2, shard: '4/6' }
          - { group: 2, shard: '5/6' }
          - { group: 2, shard: '6/6' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - name: Check the preinstalled Playwright version
        run: node -e "if (require('playwright/package.json').version !== '1.62.1') throw new Error('Playwright image must match package-lock.json')"
      # The backup/admin browser fixture serves dist/admin.html.
      - run: npm run build
      - name: Check exact-tree browser verification evidence
        id: browser-proof
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_GROUP: ${{ matrix.group }}
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_INDEX: ${{ strategy.job-index }}
        run: node scripts/ci-browser-proof.mjs reuse
      - name: Execute the complete browser shard when fresh evidence is required
        if: steps.browser-proof.outputs.reused != 'true'
        run: npm run test:browser -- --group ${{ matrix.group }} --shard ${{ matrix.shard }}
      - name: Record freshly executed complete shard evidence
        if: steps.browser-proof.outputs.reused != 'true'
        env:
          BROWSER_GROUP: ${{ matrix.group }}
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_INDEX: ${{ strategy.job-index }}
        run: node scripts/ci-browser-proof.mjs record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.browser-proof.outputs.reused != 'true'
        with:
          name: quiet-room-browser-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/quiet-room-browser-proof.json
          if-no-files-found: error
          retention-days: 1

  calls:
    name: Native call media and call views
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      # The unit/integration job already runs every call unit test.
      - run: npm run test:calls:e2e
      - name: Verify authenticated TURN UDP and TCP media using the production overlay
        run: bash scripts/test-turn-relay.sh

  audit:
    name: Audit production dependencies
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: node scripts/audit-production.mjs

  image:
    name: Build deployable image (${{ matrix.arch }})
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the exact image with bounded architecture-specific cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: quiet-room-app:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=quiet-room-${{ matrix.arch }}
          cache-to: type=gha,scope=quiet-room-${{ matrix.arch }},mode=max,ignore-error=true,timeout=120s
      - name: Check runtime imports for the exact image
        env:
          IMAGE_PLATFORM: linux/${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm --platform "$IMAGE_PLATFORM" "quiet-room-app:$GITHUB_SHA" node --input-type=module -e \
            'await import("./server/index.mjs"); await import("./server/backup.mjs"); const { DatabaseSync } = await import("node:sqlite"); const db = new DatabaseSync(":memory:"); db.close();'
      - name: Verify staged import leaves live container and synthetic data unchanged
        if: matrix.arch == 'amd64'
        run: sudo env GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" python3 tests/staged-image-docker.py
      - name: Verify Docker storage replacement and failure recovery
        if: matrix.arch == 'amd64'
        run: sudo env GITHUB_ACTIONS=true QUIET_ROOM_STORAGE_FIXTURE_IMAGE="quiet-room-app:$GITHUB_SHA" python3 tests/storage-maintenance-docker.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && matrix.arch == 'amd64'
        with:
          name: storage-maintenance-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .delivery-evidence/storage-ci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Export the exact main image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_PLATFORM: linux/${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="quiet-room-app:$GITHUB_SHA"
          mkdir ci-image
          docker image save "$image" | gzip -1 > ci-image/image.tar.gz
          export IMAGE_ID="$(docker image inspect "$image" --format '{{.Id}}')"
          node scripts/ci-image.mjs manifest ci-image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: quiet-room-image-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ci-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  image_retention:
    name: Retain recent CI image versions
    needs: [scope, verify]
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.mode == 'full' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/ci-image-retention.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  verify:
    # Keep the existing branch-protection check name stable and make it the
    # single aggregate runner so account runner limits cannot block a green run.
    name: verify
    needs: [scope, docs, secret_scan, delivery, build, browser, calls, audit, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require the complete result for the selected scope
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs verify verify
      - name: Full application verification
        if: needs.scope.outputs.mode == 'full'
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs verify full
