name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to publish the selected main-branch commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quiet-room-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and run unit/integration tests
        run: npm run check

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://chat.mijiu.cloud
    steps:
      - name: Install the restricted deployment key
        shell: bash
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/shui-im-production"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/shui-im-production"
          printf '%s\n' '8.148.73.100 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ0TnVCGf/XAoy6kiindRxGsFl09Ycib2B+KFxOOenNf' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy the exact verified commit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -i "$HOME/.ssh/shui-im-production" \
            deploy@8.148.73.100 "deploy $GITHUB_SHA"

