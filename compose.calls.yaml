# Optional Linux production overlay; does not start TURN without --profile calls.
# docker compose --env-file .env.calls -f compose.yaml -f compose.calls.yaml --profile calls up -d
# Immutable production releases must use persistent shared/calls.env plus the
# reviewed root-owned helper described in DEPLOYMENT.md; one-off CLI flags do not persist.
# Check TURN_PUBLIC_IP, DNS, provider firewall and any traffic allowance before enabling.
services:
  quiet-room:
    environment:
      CALL_STUN_URLS: ${CALL_STUN_URLS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      CALL_RELAY_ONLY: ${CALL_RELAY_ONLY:-false}

  quiet-room-turn:
    image: ${COTURN_IMAGE:?Set a reviewed coturn/coturn image tag or digest}
    profiles: [calls]
    restart: unless-stopped
    # Host networking makes the UDP relay port mapping explicit and avoids NAT overhead.
    # Intended for a Linux host with a public IPv4 address, not Docker Desktop networking.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    environment:
      TURN_SECRET: ${TURN_SECRET:?Set a random base64url TURN_SECRET in .env.calls}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:?Set this server public IPv4 address}
      TURN_REALM: ${TURN_REALM:-quiet-room}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
      TURN_TLS_ENABLED: ${TURN_TLS_ENABLED:-false}
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/quiet-room.conf:ro
      # To enable TLS, put fullchain.pem and privkey.pem in this directory.
      # Certificates are not shared with the application container.
      - ${TURN_TLS_DIR:-./deploy/turn-tls}:/certs:ro
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        case "$$TURN_SECRET" in *[!A-Za-z0-9_-]*|'') exit 1;; esac
        [ "$${#TURN_SECRET}" -ge 32 ] && [ "$${#TURN_SECRET}" -le 512 ]
        case "$$TURN_PUBLIC_IP" in *[!0-9.]*|'') exit 1;; esac
        case "$$TURN_REALM" in *[!A-Za-z0-9.-]*|'') exit 1;; esac
        case "$$TURN_MIN_PORT:$$TURN_MAX_PORT" in *[!0-9:]*) exit 1;; esac
        [ "$$TURN_MIN_PORT" -ge 1024 ] && [ "$$TURN_MAX_PORT" -le 65535 ] && [ "$$TURN_MIN_PORT" -le "$$TURN_MAX_PORT" ]
        umask 077
        cat /etc/coturn/quiet-room.conf > /tmp/turnserver.conf
        printf '\nstatic-auth-secret=%s\nexternal-ip=%s\nrealm=%s\nmin-port=%s\nmax-port=%s\n' "$$TURN_SECRET" "$$TURN_PUBLIC_IP" "$$TURN_REALM" "$$TURN_MIN_PORT" "$$TURN_MAX_PORT" >> /tmp/turnserver.conf
        case "$$TURN_TLS_ENABLED" in
          true)
            [ -r /certs/fullchain.pem ] && [ -r /certs/privkey.pem ]
            printf '\ntls-listening-port=5349\ncert=/certs/fullchain.pem\npkey=/certs/privkey.pem\n' >> /tmp/turnserver.conf
            ;;
          false) printf '\nno-tls\n' >> /tmp/turnserver.conf;;
          *) exit 1;;
        esac
        exec turnserver -c /tmp/turnserver.conf
