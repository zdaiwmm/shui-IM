<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Room · Safari 调试</title>
<style>
:root{color-scheme:dark;font:13px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:oklch(92% .007 280);background:oklch(29% .008 280)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,select{font:inherit;color:inherit}button,select{border:1px solid oklch(48% .01 280);border-radius:6px;background:oklch(33% .009 280);padding:5px 9px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid oklch(80% .12 245);outline-offset:2px}button[aria-pressed=true]{background:oklch(42% .07 275)}
header{min-height:44px;padding:6px 16px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 14px;background:oklch(25% .008 280)}header label{display:inline-flex;align-items:center;gap:5px}header a{color:inherit;text-underline-offset:3px}.note{margin:0;padding:5px 12px;text-align:center;color:oklch(76% .01 280);font-size:11px;background:oklch(25% .008 280)}main{display:grid;place-items:center;overflow:hidden}
#phone{position:relative;outline:1px solid #ffd54a;box-shadow:0 8px 30px oklch(10% .006 280 / .35)}#screen{position:absolute;inset:0;width:393px;height:852px;transform-origin:0 0;overflow:hidden;background:oklch(17% .008 285)}
.status{position:absolute;inset:0 0 auto;height:59px;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 27px 0 32px;font-size:16px;font-weight:600}.island{position:absolute;width:122px;height:34px;border-radius:22px;top:9px;left:50%;transform:translateX(-50%);background:oklch(8% .005 280)}.system-icons{display:flex;gap:6px;align-items:center;height:20px}svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.system-icons svg{width:18px;height:18px}.battery{position:relative;width:25px;height:12px;border:1px solid currentColor;border-radius:3px;padding:2px}.battery::before{content:'';display:block;height:100%;width:82%;border-radius:1px;background:currentColor}.battery::after{content:'';position:absolute;right:-3px;top:3px;height:4px;width:2px;border-radius:1px;background:currentColor}
#web-clip{position:absolute;top:59px;left:0;width:393px;overflow:hidden}iframe{position:absolute;inset:0 auto auto 0;width:393px;border:0;background:oklch(17% .008 285)}#safari{position:absolute;bottom:0;width:100%;height:110px;background:oklch(23% .009 280);border-top:1px solid oklch(35% .01 280)}.address{margin:7px 14px 0;height:37px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:13px;background:oklch(31% .012 280);font-size:14px}.address span{flex:1;text-align:center}.address .page-menu{margin-left:11px;flex:0;font-size:15px}.chrome-button{display:grid;place-items:center;border:0;background:transparent;padding:0;width:44px;height:37px;color:oklch(80% .12 245)}.navigation{display:flex;justify-content:space-around;align-items:center;height:42px;color:oklch(80% .12 245)}.navigation span{display:grid;place-items:center;width:44px}.navigation .muted{opacity:.4}.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);height:5px;width:134px;border-radius:4px;background:oklch(92% .007 280)}#safari.collapsed{height:30px}#safari.collapsed .address,#safari.collapsed .navigation{display:none}
#keyboard{position:absolute;bottom:0;width:100%;height:320px;background:oklch(30% .008 280);display:grid;grid-template-rows:40px 1fr 44px 25px;overflow:hidden}#keyboard[hidden],#safari[hidden]{display:none}.accessory{display:flex;align-items:center;justify-content:space-between;background:oklch(24% .008 280);padding:0 13px;border-top:1px solid oklch(42% .008 280)}.accessory span{color:oklch(70% .01 280)}.accessory button{color:oklch(80% .12 245);background:transparent;border:0;min-width:52px;height:40px;padding:0;font-weight:600}.key-rows{display:grid;grid-template-rows:repeat(3,1fr);gap:9px;padding:9px 4px 6px;min-height:0}.key-row{display:flex;justify-content:center;gap:5px;min-height:0}.key{border:0;border-radius:5px;padding:0;flex:1;max-width:34px;min-width:0;background:oklch(47% .009 280);color:oklch(98% .004 280);box-shadow:0 1px oklch(12% .006 280);font-size:23px}.key:active{background:oklch(61% .012 280)}.key.wide{max-width:none;flex:1.45;background:oklch(39% .009 280);font-size:18px}.key-gap{flex:.25}.keyboard-bottom{display:flex;gap:6px;padding:3px 5px 4px}.keyboard-bottom .key{max-width:none;font-size:16px;flex:1}.keyboard-bottom .space{flex:3.3}.keyboard-bottom .return{flex:1.6}#geometry{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header id="controls"><span>Safari 风格 · 393 × 852</span><span id="scale">100%</span><button id="keyboard-toggle" aria-pressed="false">键盘</button><button id="toolbar-toggle" aria-pressed="true">工具栏展开</button><label><input id="auto-keyboard" type="checkbox" checked>随输入弹出</label><label>键盘高度 <select id="keyboard-height"><option>260</option><option selected>320</option><option>360</option><option>400</option></select></label><a href="/">直接打开</a></header>
<p id="notice" class="note">系统栏与键盘为模拟绘制；VisualViewport 为合成数据；内核仍为 Chromium。<span id="geometry"></span></p>
<main><div id="phone"><div id="screen">
<div class="status" aria-label="模拟 iOS 状态栏"><span>9:41</span><div class="island" aria-hidden="true"></div><div class="system-icons" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M2 17v-3m5 3v-6m5 6V8m5 9V5" stroke-width="3"/></svg><svg viewBox="0 0 20 20"><path d="M2 7c4-4 12-4 16 0M5 10c3-3 7-3 10 0m-7 3c1-1 3-1 4 0"/><circle cx="10" cy="16" r=".7" fill="currentColor"/></svg><div class="battery"></div></div></div>
<div id="web-clip"><iframe title="Quiet Room 移动端" allow="fullscreen" allowfullscreen></iframe></div>
<div id="safari" aria-label="模拟 Safari 底部工具栏"><div class="address"><span class="page-menu" aria-hidden="true">aA</span><span id="local-address"></span><button class="chrome-button" id="reload-page" aria-label="刷新网页"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 7M20 5v6h-6"/></svg></button></div><div class="navigation" aria-hidden="true"><span><svg viewBox="0 0 24 24"><path d="m15 4-8 8 8 8"/></svg></span><span class="muted"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></span><span><svg viewBox="0 0 24 24"><path d="M7 9H4v12h16V9h-3M12 16V2m-4 4 4-4 4 4"/></svg></span><span><svg viewBox="0 0 24 24"><path d="M12 6v15M12 6C8 3 4 4 2 5v15c3-2 7-2 10 1 3-3 7-3 10-1V5c-3-2-7-2-10 1Z"/></svg></span><span><svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="3"/><path d="M8 3h10a3 3 0 0 1 3 3v11"/></svg></span></div><div class="home" aria-hidden="true"></div></div>
<section id="keyboard" aria-label="模拟 iOS 键盘" hidden><div class="accessory"><span aria-hidden="true">⌃　⌄</span><button id="done">完成</button></div><div id="keys" class="key-rows"></div><div class="keyboard-bottom"><button class="key" data-key="numbers">123</button><button class="key space" data-key=" ">空格</button><button class="key return" data-key="Enter">换行</button></div><div class="home" aria-hidden="true"></div></section>
</div></div></main>
<script>
const $=id=>document.getElementById(id),phone=$('phone'),frame=document.querySelector('iframe'),stage=document.querySelector('main');
let saved={};try{saved=JSON.parse(sessionStorage.getItem('quiet-room-local-safari-debug')||'{}');}catch{}
const state={open:false,toolbar:saved.toolbar!==false,auto:saved.auto!==false,keyboardHeight:[260,320,360,400].includes(saved.keyboardHeight)?saved.keyboardHeight:320,visibleHeight:683,layoutHeight:683,upper:false,numbers:false};let animation=null,focused=false;
function persist(){try{sessionStorage.setItem('quiet-room-local-safari-debug',JSON.stringify({toolbar:state.toolbar,auto:state.auto,keyboardHeight:state.keyboardHeight}));}catch{}}
function fit(){stage.style.height=`${innerHeight-$('controls').offsetHeight-$('notice').offsetHeight}px`;const scale=Math.max(.1,Math.min(1,(stage.clientWidth-40)/393,(stage.clientHeight-40)/852));phone.style.width=`${393*scale}px`;phone.style.height=`${852*scale}px`;$('screen').style.transform=`scale(${scale})`;$('scale').textContent=`${Math.round(scale*100)}%`;}
function paint(height){state.visibleHeight=height;$('web-clip').style.height=`${height}px`;frame.style.height=`${state.layoutHeight}px`;try{frame.contentWindow.__localSafariBridge?.update(height,0);}catch{}$('geometry').textContent=` 布局 ${state.layoutHeight}px / 可见 ${Math.round(height)}px`;}
function layout(animate=false){if(animation!==null)cancelAnimationFrame(animation);animation=null;state.layoutHeight=852-59-(state.toolbar?110:30);const target=state.open?852-59-state.keyboardHeight:state.layoutHeight;$('safari').classList.toggle('collapsed',!state.toolbar);$('safari').hidden=state.open;$('keyboard').style.height=`${state.keyboardHeight}px`;$('keyboard-toggle').setAttribute('aria-pressed',String(state.open));$('toolbar-toggle').setAttribute('aria-pressed',String(state.toolbar));$('toolbar-toggle').textContent=state.toolbar?'工具栏展开':'工具栏收起';$('auto-keyboard').checked=state.auto;$('keyboard-height').value=state.keyboardHeight;const from=state.visibleHeight,started=performance.now();const run=now=>{const p=animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches?Math.min(1,(now-started)/240):1,progress=1-Math.pow(1-p,4);paint(from+(target-from)*progress);$('keyboard').hidden=!state.open&&p===1;$('keyboard').style.transform=`translateY(${state.open?(1-progress)*state.keyboardHeight:progress*state.keyboardHeight}px)`;if(p<1)animation=requestAnimationFrame(run);else animation=null;};if(state.open)$('keyboard').hidden=false;run(performance.now());persist();}
function setKeyboard(open,animate=true){if(state.open===open)return;state.open=open;layout(animate);}
window.__localSafariDebug={get geometry(){return{height:state.visibleHeight,layoutHeight:state.layoutHeight,offsetTop:0};},focus(value){focused=value;if(state.auto)setKeyboard(value);},sync(){layout();},get state(){return{...state,focused};}};
$('keyboard-toggle').addEventListener('pointerdown',e=>e.preventDefault());$('keyboard-toggle').onclick=()=>setKeyboard(!state.open);$('toolbar-toggle').onclick=()=>{state.toolbar=!state.toolbar;layout();};$('auto-keyboard').onchange=e=>{state.auto=e.target.checked;persist();if(state.auto)setKeyboard(focused);};$('keyboard-height').onchange=e=>{state.keyboardHeight=Number(e.target.value);layout();};$('done').onclick=()=>{try{frame.contentWindow.document.activeElement?.blur();}catch{}setKeyboard(false);};$('reload-page').onclick=()=>frame.contentWindow.location.reload();
function renderKeys(){$('keys').replaceChildren();const rows=state.numbers?['1234567890','-/:;()$&@"','.,?!\'']:['qwertyuiop','asdfghjkl','zxcvbnm'];rows.forEach((letters,index)=>{const row=document.createElement('div');row.className='key-row';if(index===1){const gap=document.createElement('span');gap.className='key-gap';row.append(gap);}if(index===2){const shift=document.createElement('button');shift.className='key wide';shift.dataset.key='shift';shift.textContent=state.numbers?'#+=':'⇧';shift.setAttribute('aria-label','切换大小写');row.append(shift);}for(const letter of letters){const b=document.createElement('button');b.className='key';b.dataset.key=state.upper&&!state.numbers?letter.toUpperCase():letter;b.textContent=b.dataset.key;row.append(b);}if(index===1){const gap=document.createElement('span');gap.className='key-gap';row.append(gap);}if(index===2){const back=document.createElement('button');back.className='key wide';back.dataset.key='Backspace';back.textContent='⌫';back.setAttribute('aria-label','退格');row.append(back);}$('keys').append(row);});document.querySelector('[data-key="numbers"]').textContent=state.numbers?'ABC':'123';}
$('keyboard').addEventListener('pointerdown',e=>{if(e.target.closest('button'))e.preventDefault();});$('keyboard').addEventListener('click',e=>{const key=e.target.closest('[data-key]')?.dataset.key;if(!key)return;if(key==='shift'){state.upper=!state.upper;renderKeys();return;}if(key==='numbers'){state.numbers=!state.numbers;renderKeys();return;}try{if(frame.contentWindow.__localSafariBridge?.type(key)==='done')setKeyboard(false);}catch{}});
addEventListener('resize',fit);new ResizeObserver(fit).observe($('controls'));frame.addEventListener('load',()=>{try{focused=Boolean(frame.contentWindow.__localSafariBridge?.focused);}catch{focused=false;}state.open=state.auto&&focused;layout();fit();});$('local-address').textContent=location.host;frame.src='/';renderKeys();layout();fit();
</script>
</body></html>
