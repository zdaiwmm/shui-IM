# Install this HTTP-only server block before the first ai.shui.click
# certificate is issued. It can coexist with the old production vhost and
# deliberately exposes only the ACME challenge path.
server {
    listen 80;
    server_name ai.shui.click;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
