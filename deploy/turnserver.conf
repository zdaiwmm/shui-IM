# Authenticated TURN only. Dynamic secret/realm/public IPv4/relay range are appended
# inside the container to a mode-0600 temporary file, never put on command line.
listening-port=3478
fingerprint
use-auth-secret
stale-nonce=600
# coturn 4.18 defaults CLI, DTLS, TLS 1.0 and TLS 1.1 off. The former
# no-cli, no-dtls, no-tlsv1 and no-tlsv1_1 flags were removed and abort startup.
no-multicast-peers
# WebRTC uses UDP allocations, including over a TCP/TLS client connection.
no-tcp-relay
# Bound this private two-person deployment and avoid unlimited relay consumption.
# A browser may open one allocation per interface, plus the candidate pool.
user-quota=16
total-quota=32
max-bps=625000
bps-capacity=2500000
# Connection addresses and credential usernames must not enter application logs.
# Use host/container traffic counters for capacity monitoring instead.
no-stdout-log
log-file=/dev/null
pidfile=/tmp/turnserver.pid
# Prevent this public relay from reaching internal services, metadata endpoints,
# loopback, carrier-grade NAT, benchmark networks or multicast destinations.
# Do not deny the TURN public IP: two relayed clients need to reach each other
# through allocations on that address. Keep other public UDP services closed.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
