# Authenticated TURN only. Dynamic secret/realm/public IPv4/relay range are appended
# inside the container to a mode-0600 temporary file, never put on command line.
listening-port=3478
fingerprint
use-auth-secret
stale-nonce=600
no-cli
no-dtls
no-tlsv1
no-tlsv1_1
no-multicast-peers
# WebRTC uses UDP allocations, including over a TCP/TLS client connection.
no-tcp-relay
# Bound this private two-person deployment and avoid unlimited relay consumption.
user-quota=4
total-quota=16
max-bps=625000
bps-cap=2500000
# Connection addresses and credential usernames must not enter application logs.
# Use host/container traffic counters for capacity monitoring instead.
no-stdout-log
log-file=/dev/null
pidfile=/tmp/turnserver.pid
# Prevent this public relay from reaching internal services, metadata endpoints,
# loopback, carrier-grade NAT, benchmark networks or multicast destinations.
# Do not deny the TURN public IP: two relayed clients need to reach each other
# through allocations on that address. Keep other public UDP services closed.
deny-peer-ip=0.0.0.0-0.255.255.255
deny-peer-ip=10.0.0.0-10.255.255.255
deny-peer-ip=100.64.0.0-100.127.255.255
deny-peer-ip=127.0.0.0-127.255.255.255
deny-peer-ip=169.254.0.0-169.254.255.255
deny-peer-ip=172.16.0.0-172.31.255.255
deny-peer-ip=192.0.0.0-192.0.0.255
deny-peer-ip=192.168.0.0-192.168.255.255
deny-peer-ip=198.18.0.0-198.19.255.255
deny-peer-ip=224.0.0.0-255.255.255.255
deny-peer-ip=::
deny-peer-ip=::1
deny-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
deny-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
deny-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
