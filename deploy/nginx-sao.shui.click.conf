# Install only after DNS/certificate provisioning and an authorized release.
server {
    listen 443 ssl;
    server_name sao.shui.click;
    ssl_certificate /etc/letsencrypt/live/sao.shui.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sao.shui.click/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    # Every admin route participates in the same cold-backup write barrier.
    if (-f /var/lib/quiet-room-deploy/maintenance) { return 503; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host sao.shui.click;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location /ws { return 404; }
}
server {
    listen 80;
    server_name sao.shui.click;
    return 301 https://sao.shui.click$request_uri;
}
