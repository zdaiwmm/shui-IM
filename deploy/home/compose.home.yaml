# Install root-owned on the shared home host. It is used for both cutover and rollback.
services:
  quiet-room:
    cpus: 1.5
    environment:
      CALL_STUN_URLS: ${CALL_STUN_URLS:?Tokyo STUN URLs required}
      TURN_URLS: ${TURN_URLS:?Tokyo TURN URLs required}
      TURN_SECRET: ${TURN_SECRET:?Tokyo TURN credential required}
      CALL_RELAY_ONLY: ${CALL_RELAY_ONLY:-false}
  quiet-room-backup:
    cpus: 0.5
volumes:
  quiet-room-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/quiet-room/persistent/data
  quiet-room-admin-status:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/quiet-room/persistent/admin-status
