daemon off;
worker_processes 1;
pid /run/quiet-room-home-gateway/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /run/quiet-room-home-gateway/body;
    proxy_temp_path /run/quiet-room-home-gateway/proxy;
    fastcgi_temp_path /run/quiet-room-home-gateway/fastcgi;
    uwsgi_temp_path /run/quiet-room-home-gateway/uwsgi;
    scgi_temp_path /run/quiet-room-home-gateway/scgi;
    map $http_upgrade $qr_connection { default upgrade; '' close; }
    server {
        listen 127.0.0.1:18085 default_server;
        server_name mijiu.cloud;
        if ($host != mijiu.cloud) { return 444; }
        client_max_body_size 3m;
        proxy_http_version 1.1;
        proxy_set_header Host mijiu.cloud;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $qr_connection;
        proxy_read_timeout 3600s;
        location = /api/health { proxy_pass http://127.0.0.1:8080; }
        location ^~ /api/ {
            if (-f /var/lib/quiet-room-deploy/maintenance) { return 503; }
            proxy_pass http://127.0.0.1:8080;
        }
        location = /ws {
            if (-f /var/lib/quiet-room-deploy/maintenance) { return 503; }
            proxy_pass http://127.0.0.1:8080;
        }
        location / { proxy_pass http://127.0.0.1:8080; }
    }
}
