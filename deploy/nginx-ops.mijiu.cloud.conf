# Tokyo TLS ingress for the independent home administrator origin.
server {
    listen 443 ssl;
    server_name ops.mijiu.cloud;
    if ($host != ops.mijiu.cloud) { return 444; }
    ssl_certificate /etc/letsencrypt/live/ops.mijiu.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.mijiu.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    proxy_hide_header Cache-Control;
    proxy_set_header Host ops.mijiu.cloud;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /admin-api/expressions {
        client_max_body_size 70m;
        proxy_pass http://127.0.0.1:18886;
    }
    location /ws { return 404; }
    location / { proxy_pass http://127.0.0.1:18886; }
}
server {
    listen 80;
    server_name ops.mijiu.cloud;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://ops.mijiu.cloud$request_uri; }
}
