server {
    listen 443 ssl;
    server_name aix.shui.click;
    ssl_certificate /etc/letsencrypt/live/aix.shui.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aix.shui.click/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /dev/null;
    client_max_body_size 1k;
    proxy_http_version 1.1;
    proxy_set_header Host aix.shui.click;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_cache off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;

    location = /healthz {
        proxy_pass http://127.0.0.1:18087;
    }
    location = /v1/x/posts/lookup {
        proxy_pass http://127.0.0.1:18087;
    }
    location ~ "^/v1/x/media/[A-Za-z0-9_-]{43}$" {
        proxy_pass http://127.0.0.1:18087;
    }
    location / {
        return 404;
    }
}
