limit_req_zone $binary_remote_addr zone=quiet_room_create:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=quiet_room_api:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=quiet_room_connections:10m;

server {
    server_name ai.shui.click;

    client_max_body_size 3m;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location = /api/rooms {
        limit_req zone=quiet_room_create burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        limit_req zone=quiet_room_api burst=60 nodelay;
        limit_conn quiet_room_connections 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ws {
        limit_conn quiet_room_connections 4;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_conn quiet_room_connections 20;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ai.shui.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.shui.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name ai.shui.click chat.mijiu.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://ai.shui.click$request_uri;
    }
}

# Keep control of the retired origin without serving application JavaScript.
# Existing chat.mijiu.cloud vaults remain cryptographically scoped to that
# origin and are intentionally not migrated by this cutover.
server {
    listen 443 ssl;
    server_name chat.mijiu.cloud;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 308 https://ai.shui.click$request_uri;

    ssl_certificate /etc/letsencrypt/live/chat.mijiu.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.mijiu.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
